<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>서비스 상태</title>
<style>
  :root{
    --bg:#f5f6fa; --surface:#ffffff; --border:#e5e7f0; --text:#1c2333; --text-dim:#5b6478; --text-faint:#9099ad;
    --good:#00b087; --warn:#e6960f; --crit:#ef3b5c; --neutral:#9099ad; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Pretendard',sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  header h1{font-size:20px;margin:0}
  .banner{border-radius:12px;padding:18px 20px;margin-bottom:28px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
  .banner.good{background:rgba(0,176,135,.1);color:var(--good)}
  .banner.warn{background:rgba(230,150,15,.1);color:var(--warn)}
  .banner.crit{background:rgba(239,59,92,.1);color:var(--crit)}
  .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .svc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .svc-label{font-weight:600;font-size:14.5px;flex:1}
  .svc-desc{font-size:12.5px;color:var(--text-dim);margin:-6px 0 10px}
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .pill.operational{background:rgba(0,176,135,.12);color:var(--good)}
  .pill.degraded{background:rgba(230,150,15,.12);color:var(--warn)}
  .pill.down{background:rgba(239,59,92,.12);color:var(--crit)}
  .pill.unknown{background:rgba(144,153,173,.12);color:var(--text-faint)}
  .history{display:flex;gap:2px;margin-top:8px}
  .bar{flex:1;height:28px;border-radius:2px;background:var(--neutral)}
  .bar.operational{background:var(--good)}
  .bar.degraded{background:var(--warn)}
  .bar.down{background:var(--crit)}
  .hist-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:6px}
  .uptime{font-size:12px;color:var(--text-dim);white-space:nowrap}
  .ann{border-left:3px solid var(--accent);padding:10px 14px;margin-bottom:10px;background:var(--surface);border-radius:0 8px 8px 0;border:1px solid var(--border);border-left-width:3px;border-left-color:var(--accent)}
  .ann.resolved{border-left-color:var(--good)}
  .ann-title{font-weight:600;font-size:13.5px;margin-bottom:3px}
  .ann-body{font-size:12.5px;color:var(--text-dim);white-space:pre-wrap}
  .ann-meta{font-size:11px;color:var(--text-faint);margin-top:6px}
  .empty{color:var(--text-faint);font-size:13px;text-align:center;padding:30px 0}
  footer{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>서비스 상태</h1>
  </header>
  <div id="banner"></div>
  <div id="announcements"></div>
  <div id="services"></div>
  <footer>최근 90일 기준 가동률 표시 · 자동 갱신</footer>
</div>
<script>
(function(){
  'use strict';
  // This page intentionally never touches any session/cookie-based auth --
  // it only ever calls the two unauthenticated /api/public/* endpoints,
  // which themselves never read flask.session (see collector/
  // public_status.py's module docstring). Nothing here assumes a login.
  var STATUS_LABEL = {operational:'정상', degraded:'저하', down:'장애', unknown:'알 수 없음'};
  var ANN_STATUS_LABEL = {investigating:'조사 중', identified:'원인 확인', monitoring:'모니터링 중', resolved:'해결됨'};

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtWhen(ms){ return ms ? new Date(ms).toLocaleString('ko-KR') : '-'; }

  function renderBanner(services){
    var el = document.getElementById('banner');
    if(!services.length){ el.innerHTML = ''; return; }
    var worst = services.reduce(function(acc,s){
      var rank = {operational:0, unknown:0, degraded:1, down:2};
      return (rank[s.status]||0) > (rank[acc]||0) ? s.status : acc;
    }, 'operational');
    var cls = worst==='down' ? 'crit' : worst==='degraded' ? 'warn' : 'good';
    var text = worst==='down' ? '일부 서비스에 장애가 발생했습니다' : worst==='degraded' ? '일부 서비스 성능이 저하되었습니다' : '모든 서비스가 정상 운영 중입니다';
    el.innerHTML = '<div class="banner '+cls+'"><span class="dot"></span>'+text+'</div>';
  }

  function renderAnnouncements(anns){
    var el = document.getElementById('announcements');
    var active = anns.filter(function(a){ return a.status !== 'resolved'; });
    var recent = anns.slice(0, 5);
    var list = active.length ? active : recent;
    if(!list.length){ el.innerHTML = ''; return; }
    el.innerHTML = list.map(function(a){
      return '<div class="ann'+(a.status==='resolved'?' resolved':'')+'">'
        + '<div class="ann-title">'+escapeHtml(a.title)+' <span class="pill '+(a.status==='resolved'?'operational':'degraded')+'">'+ (ANN_STATUS_LABEL[a.status]||a.status) +'</span></div>'
        + (a.body ? '<div class="ann-body">'+escapeHtml(a.body)+'</div>' : '')
        + '<div class="ann-meta">'+fmtWhen(a.createdAt)+(a.resolvedAt ? ' · 해결: '+fmtWhen(a.resolvedAt) : '')+'</div>'
        + '</div>';
    }).join('');
  }

  function renderServices(services){
    var el = document.getElementById('services');
    if(!services.length){ el.innerHTML = '<div class="empty">공개된 서비스가 없습니다.</div>'; return; }
    el.innerHTML = services.map(function(s){
      var hist = s.history || [];
      return '<div class="card">'
        + '<div class="svc-head"><span class="svc-label">'+escapeHtml(s.label)+'</span>'
        + '<span class="uptime">'+s.uptimePct90d.toFixed(2)+'% (90일)</span>'
        + '<span class="pill '+s.status+'">'+(STATUS_LABEL[s.status]||s.status)+'</span></div>'
        + (s.description ? '<div class="svc-desc">'+escapeHtml(s.description)+'</div>' : '')
        + '<div class="history">'+hist.map(function(h){ return '<div class="bar '+h.status+'" title="'+h.date+'"></div>'; }).join('')+'</div>'
        + '<div class="hist-foot"><span>'+(hist[0]?hist[0].date:'')+'</span><span>오늘</span></div>'
        + '</div>';
    }).join('');
  }

  function load(){
    Promise.all([
      fetch('/api/public/status').then(function(r){ return r.json(); }),
      fetch('/api/public/announcements').then(function(r){ return r.json(); }),
    ]).then(function(results){
      var statusData = results[0], annData = results[1];
      var services = statusData.services || [];
      renderBanner(services);
      renderServices(services);
      renderAnnouncements(annData.announcements || []);
    }).catch(function(){
      document.getElementById('services').innerHTML = '<div class="empty">상태 정보를 불러오지 못했습니다.</div>';
    });
  }

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
