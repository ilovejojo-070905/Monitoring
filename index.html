<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InfraSight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#080a16;
    --bg-elevated:rgba(14,17,32,.72);
    --surface:rgba(255,255,255,.045);
    --surface-2:rgba(255,255,255,.06);
    --surface-hover:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.18);
    --text:#f1f4ff;
    --text-dim:#9aa4c7;
    --text-faint:#626d94;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --accent-3:#ff3ec9;
    --accent-soft:rgba(124,92,255,.18);
    --accent-gradient:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
    --good:#00e6a8;
    --good-soft:rgba(0,230,168,.15);
    --warn:#ffb020;
    --warn-soft:rgba(255,176,32,.15);
    --crit:#ff3b5c;
    --crit-soft:rgba(255,59,92,.16);
    --info:#3ecbff;
    --info-soft:rgba(62,203,255,.15);
    --glow-accent:0 0 26px rgba(124,92,255,.4);
    --glow-good:0 0 18px rgba(0,230,168,.45);
    --glow-warn:0 0 18px rgba(255,176,32,.4);
    --glow-crit:0 0 18px rgba(255,59,92,.45);
    --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
    --radius:14px;
    --radius-sm:9px;
    --sidebar-w:228px;
    --topbar-h:64px;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);font-family:var(--font-ui);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-left:16px;padding-right:16px;
    background:
      radial-gradient(circle at 12% -8%, rgba(124,92,255,.30), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(34,211,238,.22), transparent 38%),
      radial-gradient(circle at 60% 105%, rgba(255,62,201,.16), transparent 48%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
  }
  body{padding-left:0;padding-right:0}
  h1,h2,h3,h4{font-family:var(--font-ui);margin:0;text-wrap:balance}
  p{margin:0}
  button{font-family:inherit;cursor:pointer}
  table{border-collapse:collapse}
  .mono{font-family:var(--font-mono)}
  .tabular{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- shell ---------- */
  .app-shell{
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    grid-template-rows:var(--topbar-h) 1fr;
    grid-template-areas:"sidebar topbar" "sidebar main";
    min-height:100%;
  }
  .sidebar{
    grid-area:sidebar;background:var(--bg-elevated);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 12px;gap:4px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--glow-accent),0 0 0 1px rgba(255,255,255,.12) inset}
  .brand-text b{background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-mark svg{width:18px;height:18px;stroke:#fff}
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-text b{font-size:15.5px;letter-spacing:.2px}
  .brand-text span{font-size:11px;color:var(--text-faint)}
  .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);padding:14px 12px 6px}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);
    color:var(--text-dim);text-decoration:none;font-size:13.5px;font-weight:500;border:1px solid transparent;
    background:transparent;width:100%;text-align:left;
  }
  .nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor}
  .nav-item{transition:background .15s,box-shadow .15s,border-color .15s}
  .nav-item:hover{background:var(--surface-hover);color:var(--text)}
  .nav-item.active{background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(34,211,238,.14));color:#fff;border-color:rgba(124,92,255,.5);box-shadow:0 2px 18px rgba(124,92,255,.25)}
  .nav-item .count{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--text-faint);background:var(--surface-2);padding:1px 6px;border-radius:20px}
  .nav-item.active .count{color:var(--accent-2)}
  .sidebar-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .sidebar-foot .row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint)}
  .sidebar-foot .row b{color:var(--text-dim);font-family:var(--font-mono)}

  .topbar{
    grid-area:topbar;background:var(--bg-elevated);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:20;
  }
  .hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:var(--radius-sm);width:34px;height:34px;align-items:center;justify-content:center}
  .hamburger svg{width:18px;height:18px}
  .page-title{display:flex;flex-direction:column;gap:1px;margin-right:auto}
  .page-title h1{font-size:16.5px;font-weight:600}
  .page-title span{font-size:11.5px;color:var(--text-faint)}
  .status-pills{display:flex;gap:8px}
  .status-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--font-mono);padding:5px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
  .status-pill .dot{width:7px;height:7px;border-radius:50%}
  .clock{display:flex;flex-direction:column;align-items:flex-end;padding-left:14px;border-left:1px solid var(--border)}
  .clock .time{font-family:var(--font-mono);font-size:14px;font-weight:600;letter-spacing:.02em}
  .clock .date{font-size:10.5px;color:var(--text-faint)}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--good);font-weight:600;letter-spacing:.03em}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px 1px rgba(0,230,168,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 0 rgba(0,230,168,.55)}70%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 8px rgba(0,230,168,0)}100%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 0 rgba(0,230,168,0)}}
  .bell-btn{position:relative;background:var(--surface);border:1px solid var(--border);width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:border-color .15s,color .15s}
  .bell-btn:hover{border-color:var(--accent);color:var(--accent-2)}
  .bell-btn svg{width:16px;height:16px}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:linear-gradient(135deg,var(--crit),var(--accent-3));color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--font-mono);box-shadow:var(--glow-crit)}

  .main{grid-area:main;padding:22px 26px 60px;overflow-x:hidden}
  .view{display:none;flex-direction:column;gap:20px;animation:fadein .25s ease}
  .view.active{display:flex}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- reusable ---------- */
  .card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:border-color .18s,box-shadow .18s;position:relative}
  .card:hover{border-color:var(--border-strong);box-shadow:0 10px 34px rgba(124,92,255,.10)}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h3{font-size:13.5px;font-weight:600}
  .card-head .sub{font-size:11px;color:var(--text-faint)}
  .grid{display:grid;gap:16px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .grid-span2{grid-column:span 2}
  .grid-span3{grid-column:span 3}

  .kpi-card{display:flex;align-items:center;gap:14px}
  .kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
  .kpi-icon svg{width:20px;height:20px}
  .kpi-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi-label{font-size:11.5px;color:var(--text-faint)}
  .kpi-value{font-size:22px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
  .kpi-sub{display:flex;gap:8px;font-size:10.5px;font-family:var(--font-mono)}
  .kpi-sub .g{color:var(--good)} .kpi-sub .w{color:var(--warn)} .kpi-sub .c{color:var(--crit)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill .dot{width:6px;height:6px;border-radius:50%}
  .pill.good{background:var(--good-soft);color:var(--good);box-shadow:0 0 0 1px rgba(0,230,168,.12) inset}
  .pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px rgba(255,176,32,.12) inset}
  .pill.crit{background:var(--crit-soft);color:var(--crit);box-shadow:0 0 0 1px rgba(255,59,92,.14) inset}
  .pill.info{background:var(--info-soft);color:var(--info);box-shadow:0 0 0 1px rgba(62,203,255,.12) inset}
  .pill.neutral{background:var(--surface-2);color:var(--text-dim)}
  .pill.good .dot{background:var(--good);box-shadow:0 0 6px rgba(0,230,168,.9)} .pill.warn .dot{background:var(--warn);box-shadow:0 0 6px rgba(255,176,32,.8)} .pill.crit .dot{background:var(--crit);box-shadow:0 0 6px rgba(255,59,92,.9);animation:pulse 1.6s infinite} .pill.neutral .dot{background:var(--text-faint)}

  .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
  .bar > i{display:block;height:100%;border-radius:6px}
  .bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.crit > i{background:var(--crit)}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
  table.data{width:100%;min-width:640px;border-collapse:collapse;font-size:12.5px}
  table.data thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);
    background:var(--bg-elevated);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
  }
  table.data tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-dim)}
  table.data tbody tr{cursor:pointer;transition:background .12s}
  table.data tbody tr:hover{background:var(--surface-hover)}
  table.data tbody tr.sel-row{background:var(--accent-soft)}
  table.data tbody tr.sel-row:hover{background:var(--accent-soft)}
  table.data tbody tr:last-child td{border-bottom:none}
  table.data td.name{color:var(--text);font-weight:600}
  table.data td.mono{font-family:var(--font-mono)}

  .gauge{position:relative;width:104px;height:104px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px rgba(124,92,255,.25))}
  .gauge::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg-elevated);backdrop-filter:blur(14px)}
  .gauge-label{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1}
  .gauge-label b{font-family:var(--font-mono);font-size:19px}
  .gauge-label span{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
  .gauge-row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .gauge-row .g-item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .gauge-row .g-item > span{font-size:11px;color:var(--text-faint)}

  .chip-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;transition:all .15s}
  .chip-btn.active{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(34,211,238,.16));color:#fff;border-color:rgba(124,92,255,.5);box-shadow:0 0 14px rgba(124,92,255,.2)}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}

  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;min-width:220px;transition:border-color .15s,box-shadow .15s}
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .search-box svg{width:14px;height:14px;color:var(--text-faint);flex:none}
  .search-box input{background:none;border:none;color:var(--text);font-size:12.5px;font-family:inherit;width:100%}
  .search-box input:focus{outline:none}
  .search-box input::placeholder{color:var(--text-faint)}

  .empty-note{padding:26px;text-align:center;color:var(--text-faint);font-size:12.5px}

  /* ---------- topology ---------- */
  .topo-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:
    radial-gradient(circle at 20% 20%,rgba(124,92,255,.10),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,230,168,.08),transparent 45%),
    radial-gradient(circle at 50% 100%,rgba(255,62,201,.07),transparent 50%),var(--bg-elevated);}
  .topo-canvas{position:relative;min-width:1180px;min-height:660px}
  .topo-canvas svg.links{position:absolute;inset:0;width:100%;height:100%}
  .topo-node{
    position:absolute;transform:translate(-50%,-50%);width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
  }
  .topo-node .node-box{
    width:52px;height:52px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .15s,box-shadow .15s;
  }
  .topo-node .node-box svg{width:24px;height:24px;stroke:var(--text-dim)}
  .topo-node .node-status{position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg-elevated)}
  .topo-node .node-name{font-size:10.5px;font-weight:600;text-align:center;color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap}
  .topo-node:hover .node-box{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--glow-accent)}
  .topo-node.sel .node-box{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--glow-accent)}
  .topo-node.dim{opacity:.32}
  .topo-tip{
    position:absolute;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    padding:9px 12px;font-size:11px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30;min-width:170px;
    font-family:var(--font-mono);opacity:0;transition:opacity .1s;
  }
  .topo-tip.show{opacity:1}
  .topo-tip .t-title{font-family:var(--font-ui);font-weight:600;color:var(--text);margin-bottom:5px;font-size:11.5px}
  .topo-tip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--text-dim)}
  .topo-legend{display:flex;gap:16px;flex-wrap:wrap;padding-top:2px}
  .topo-legend .l{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint)}
  .topo-legend .sw{width:16px;height:2.5px;border-radius:2px}

  /* ---------- port view ---------- */
  .port-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
  .port{aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8.5px;font-family:var(--font-mono);color:var(--text-faint);position:relative}
  .port.up{background:var(--good-soft);border-color:rgba(0,230,168,.4);color:var(--good)}
  .port.down{background:var(--surface-2);color:var(--text-faint)}
  .port.err{background:var(--crit-soft);border-color:rgba(255,59,92,.5);color:var(--crit)}

  /* ---------- register form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:11.5px;color:var(--text-dim);font-weight:600}
  .field input,.field select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);
    padding:9px 11px;font-size:12.5px;font-family:inherit;width:100%;
  }
  .field input::placeholder{color:var(--text-faint)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .form-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}
  @media (max-width:600px){ .form-grid{grid-template-columns:1fr} }

  /* ---------- facility ---------- */
  .fac-card{display:flex;flex-direction:column;gap:14px}
  .fac-top{display:flex;justify-content:space-between;align-items:flex-start}
  .fac-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .fac-metric{background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 11px;display:flex;flex-direction:column;gap:3px}
  .fac-metric span{font-size:10px;color:var(--text-faint)}
  .fac-metric b{font-family:var(--font-mono);font-size:15px}

  /* ---------- drawer ---------- */
  .overlay{position:fixed;inset:0;background:rgba(4,7,14,.6);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(480px,100vw);background:var(--bg-elevated);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--border);
    z-index:51;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.4);
  }
  .drawer.show{transform:translateX(0)}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 14px;border-bottom:1px solid var(--border)}
  .drawer-head h2{font-size:16px;font-weight:700;font-family:var(--font-mono)}
  .drawer-head .role{font-size:11.5px;color:var(--text-faint);margin-top:3px}
  .drawer-close{background:var(--surface);border:1px solid var(--border);width:30px;height:30px;border-radius:8px;color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex:none}
  .drawer-close svg{width:15px;height:15px}

  /* ---------- interface traffic popup (layered above the drawer) ---------- */
  #ifaceOverlay{z-index:53}
  .iface-modal{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(480px,92vw);
    max-height:82vh;overflow-y:auto;background:var(--bg-elevated);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border-strong);
    border-radius:var(--radius);z-index:54;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
    box-shadow:0 30px 70px rgba(0,0,0,.55),var(--glow-accent);display:flex;flex-direction:column;
  }
  .iface-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .iface-modal-body{padding:18px 20px 26px;display:flex;flex-direction:column;gap:16px}

<script>
(function(){
"use strict";

/* ================= helpers ================= */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function fmt0(n){ return Math.round(n).toString(); }
function pad2(n){ return n.toString().padStart(2,'0'); }
function levelOf(pct, warnAt, critAt){ return pct>=critAt?'crit': pct>=warnAt?'warn':'good'; }
function levelColor(lv){ return lv==='crit'?'var(--crit)': lv==='warn'?'var(--warn)':'var(--good)'; }
function levelColorHex(lv){ return lv==='crit'?'#ff3b5c': lv==='warn'?'#ffb020':'#00e6a8'; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function regTag(entity){ return entity.origin==='user' ? `<span class="pill info" style="font-size:9px;padding:1px 6px;margin-left:5px;vertical-align:middle">등록</span>` : ''; }
function maintTag(entity){ return entity.maintenance && entity.maintenance.enabled ? `<span class="pill" style="font-size:9px;padding:1px 6px;margin-left:5px;vertical-align:middle;background:var(--warn-soft);color:var(--warn)">점검중</span>` : ''; }

Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.color = '#a3aed6';
Chart.defaults.borderColor = '#233149';

/* ================= auth ================= */
let CSRF_TOKEN = null;
let CURRENT_ROLE = null;
let CURRENT_USER = null;

async function checkAuth(){
  try{
    const r = await fetch('/api/auth/me', {cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

let _reauthPromise = null;
function reAuth(){
  if(_reauthPromise) return _reauthPromise;
  $('#loginOverlay').style.display = 'flex';
  $('#loginError').textContent = '';
  _reauthPromise = new Promise((resolve)=>{
    $('#loginForm').addEventListener('submit', async function onSubmit(e){
      e.preventDefault();
      $('#loginError').textContent = '';
      const u = $('#loginUsername').value.trim();
      const p = $('#loginPassword').value;
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p}),
        });
        const j = await r.json();
        if(!r.ok) throw new Error(j.error || '로그인 실패');
        CSRF_TOKEN = j.csrfToken; CURRENT_ROLE = j.role; CURRENT_USER = j.username;
        $('#loginForm').removeEventListener('submit', onSubmit);
        $('#loginOverlay').style.display = 'none';
        $('#loginPassword').value = '';
        $('#foot-user').textContent = j.username + (j.role!=='ADMIN' ? ` (${j.role})` : '');
        applyRoleUI();
        _reauthPromise = null;
        resolve();
      }catch(err){
        $('#loginError').textContent = err.message;
      }
    });
  });
  return _reauthPromise;
}

function ensureAuthed(){
  return new Promise((resolve)=>{
    checkAuth().then(info=>{
      if(info && info.username){
        CSRF_TOKEN = info.csrfToken; CURRENT_ROLE = info.role; CURRENT_USER = info.username;
        $('#foot-user').textContent = info.username + (info.role!=='ADMIN' ? ` (${info.role})` : '');
        applyRoleUI();
        resolve();
        return;
      }
      reAuth().then(resolve);
    });
  });
}

/* Every mutating call goes through this: attaches the CSRF header, and if
   the session has been invalidated (logout elsewhere, idle timeout, a
   password change) since the page loaded, re-shows the login overlay
   in-place instead of silently failing or leaving the button looking stuck. */
async function apiFetch(url, opts){
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({}, opts.headers||{});
  const method = (opts.method||'GET').toUpperCase();
  if(['POST','PUT','DELETE','PATCH'].includes(method) && CSRF_TOKEN){
    opts.headers['X-CSRF-Token'] = CSRF_TOKEN;
  }
  const r = await fetch(url, opts);
  if(r.status === 401){
    await reAuth();
    throw new Error('세션이 만료되어 다시 로그인했습니다. 다시 시도해주세요.');
  }
  return r;
}

/* Hiding controls per role is convenience only -- server.py enforces the
   real access control on every route regardless of what the UI shows. */
function applyRoleUI(){
  const isAdmin = CURRENT_ROLE === 'ADMIN';
  const isOperatorPlus = CURRENT_ROLE === 'ADMIN' || CURRENT_ROLE === 'OPERATOR';
  document.body.classList.toggle('role-admin', isAdmin);
  document.body.classList.toggle('role-operator-plus', isOperatorPlus);
  const usersNav = $('#nav-users');
  if(usersNav) usersNav.style.display = isAdmin ? '' : 'none';
}

/* ================= backend-driven live state ================= */
let SERVERS = [], DBS = [], NETS = [], FACS = [], INCIDENTS = [];
let SERVER_INFO = { lanIp: location.hostname || 'localhost', port: location.port || '5057' };

async function syncState(){
  try{
    const r = await apiFetch('/api/state', {cache:'no-store'});
    if(!r.ok) throw new Error('bad status');
    const j = await r.json();
    SERVERS = j.servers; DBS = j.dbs; NETS = j.nets; FACS = j.facs;
    INCIDENTS = j.incidents.map(i=>({ id:i.id, time:new Date(i.ts), severity:i.severity, source:i.source, category:i.category, message:i.message, status:i.status }));
    if(j.serverInfo) SERVER_INFO = j.serverInfo;
    rebuildTopology();
    return true;
  }catch(e){
    return false;
  }
}
async function registerDevice(category, mode, name, ip, fields){
  const r = await apiFetch('/api/devices', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category, mode, name, ip, fields}),
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'등록 실패');
  return j;
}
async function unregisterDevice(id){
  await apiFetch('/api/devices/'+id, {method:'DELETE'});
}
async function ackIncident(id){
  await apiFetch('/api/incidents/'+id+'/ack', {method:'POST'});
}
async function afterDeviceChange(){
  await syncState();
  refreshBadges();
  refreshTopologyView();
  renderRegister();
  if(VIEWS[currentView]) VIEWS[currentView].render();
  refreshOpenDrawer();
  renderIfaceModal();
}

/* ================= icons for topology ================= */
const ICONS = {
  cloud:'<path d="M7 17a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 7a4.5 4.5 0 0 1 1 8.9"/><path d="M7 17h10"/>',
  firewall:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 14h16M9 4v16M14 4v16"/>',
  router:'<rect x="3" y="9" width="18" height="6" rx="1.5"/><path d="M7 15v3M17 15v3M12 4v5"/>',
  switch:'<rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 16v2M11 16v2M15 16v2"/>',
  server:'<rect x="4" y="4" width="16" height="6" rx="1.2"/><rect x="4" y="14" width="16" height="6" rx="1.2"/><path d="M8 7h.01M8 17h.01"/>',

/* ================= topology: hub + every registered device, fully dynamic ================= */
let TOPO_NODES = [];
let TOPO_LINKS = [];
let lastTopoNodeIds = null;
function rebuildTopology(){
  const nodes = [{id:'hub', label:'InfraSight', icon:'monitor', x:70, y:280, ref:null}];
  const links = [];
  const iconFor = cat => cat==='server'?'server':cat==='db'?'db':cat==='net'?'switch':'ups';
  let i = 0;
  [['server',SERVERS],['db',DBS],['net',NETS],['fac',FACS]].forEach(([cat,list])=>{
    list.forEach(e=>{
      const col = Math.floor(i/7), row = i%7;
      nodes.push({id:e.id, label:e.name, icon:iconFor(cat), x:290+col*160, y:40+row*90, ref:e.id});
      links.push(['hub', e.id]);
      i++;
    });
  });
  TOPO_NODES = nodes; TOPO_LINKS = links;
}
function findEntity(ref){
  return SERVERS.find(s=>s.id===ref) || DBS.find(s=>s.id===ref) || NETS.find(s=>s.id===ref) || FACS.find(s=>s.id===ref);
}

const charts = {};
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function lineChart(canvas, labels, series, opts){
  return new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets: series.map(s=>({
      label:s.label, data:s.data, borderColor:s.color, backgroundColor:s.fill?hexA(s.color,.14):'transparent',
      fill:!!s.fill, tension:.35, pointRadius:0, borderWidth:2,
    })) },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{intersect:false,mode:'index'},
      plugins:{ legend:{display: series.length>1, labels:{boxWidth:8,boxHeight:8,color:'#a3aed6',font:{size:10.5}}},
        tooltip:{backgroundColor:'#12142a', borderColor:'#3a3f6e', borderWidth:1, titleFont:{size:10.5}, bodyFont:{size:10.5}} },
      scales:{
        x:{display:!!opts?.showX, grid:{color:'#1b1e3d'}, ticks:{color:'#6b74a0',font:{size:9.5},maxTicksLimit:6}},
        y:{ display:true, grid:{color:'#1b1e3d'}, ticks:{color:'#6b74a0',font:{size:9.5}}, suggestedMax:opts?.max, suggestedMin:0 },
      }
    }
  });
}
function barChart(canvas, labels, data, colors){
  return new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{data, backgroundColor:colors, borderRadius:5, maxBarThickness:26}] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:false}, tooltip:{backgroundColor:'#12142a',borderColor:'#3a3f6e',borderWidth:1}},
      scales:{ x:{max:100, grid:{color:'#1b1e3d'}, ticks:{color:'#6b74a0',font:{size:9.5}}}, y:{grid:{display:false}, ticks:{color:'#a3aed6',font:{size:10.5,family:"'IBM Plex Mono'"}}} }
    }
  });
}
function hexA(hex,a){
  const m={'#7c5cff':'124,92,255','#00e6a8':'0,230,168','#ffb020':'255,176,32','#ff3b5c':'255,59,92','#3ecbff':'62,203,255','#ff3ec9':'255,62,201'};
  return `rgba(${m[hex]||'124,92,255'},${a})`;
}

}

function showTopoTip(node){
  const n = TOPO_NODES.find(x=>x.id===node.dataset.node);
  const tip = $('#topoTip');
  let html = `<div class="t-title">${escapeHtml(n.label)}</div>`;
  const ent = n.ref ? findEntity(n.ref) : null;
  if(ent){
    const rows = [];
    if(ent.mode==='ping' || ent.mode==='snmp'){
      rows.push(`<div class="t-row"><span>응답</span><span style="color:${ent.reachable?'var(--good)':'var(--crit)'}">${ent.reachable? fmt0(ent.latencyMs||0)+' ms' : '응답없음'}</span></div>`);
    }
    if(typeof ent.cpu === 'number') rows.push(`<div class="t-row"><span>CPU</span><span>${fmt0(ent.cpu)}%</span></div>`);
    if(typeof ent.mem === 'number') rows.push(`<div class="t-row"><span>MEM</span><span>${fmt0(ent.mem)}%</span></div>`);
    if(typeof ent.portsTotal === 'number') rows.push(`<div class="t-row"><span>인터페이스</span><span>${ent.portsUp}/${ent.portsTotal} Up</span></div>`);
    if(typeof ent.trafficIn === 'number') rows.push(`<div class="t-row"><span>트래픽</span><span>${fmt1((ent.trafficIn||0)+(ent.trafficOut||0))} Mbps</span></div>`);
    if(ent.mode==='agent' && !ent.online) rows.push(`<div class="t-row"><span>상태</span><span style="color:var(--warn)">에이전트 대기중</span></div>`);
    else rows.push(`<div class="t-row"><span>상태</span><span style="color:${levelColor(ent.status)}">${statusLabel(ent.status)}</span></div>`);
    html += rows.join('');
  } else {
    html += `<div class="t-row"><span>구간</span><span>관제 네트워크</span></div>`;
  }
  tip.innerHTML = html;
  tip.classList.add('show');
}
function positionTip(e){
  const tip = $('#topoTip');
  const wrap = $('.topo-wrap');
  const rect = wrap.getBoundingClientRect();
  let x = e.clientX - rect.left + wrap.scrollLeft + 16;
  let y = e.clientY - rect.top + wrap.scrollTop + 12;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function statusLabel(lv){ return lv==='crit'?'위험':lv==='warn'?'주의':'정상'; }

function refreshTopology(){
  TOPO_NODES.forEach(n=>{
    if(!n.ref) return;
    const ent = findEntity(n.ref);
    if(!ent) return;
    const box = document.querySelector(`.topo-node[data-node="${n.id}"] .node-status`);
    if(box) box.style.background = levelColor(ent.status);
  });
  TOPO_LINKS.forEach(([a,b],i)=>{
    const na = TOPO_NODES.find(n=>n.id===a);
    const entA = na && na.ref ? findEntity(na.ref) : null;
    const line = document.querySelector(`line[data-link="${i}"]`);
    if(!line) return;
    let color = '#3a3f6e', width=2;
    if(entA && entA.status){ color = entA.status==='crit'?'#ff3b5c':entA.status==='warn'?'#ffb020':'#3d4570'; width = entA.status==='good'?2:2.6; }
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', width);
  });
}
function refreshTopologyView(){
  const currentIds = TOPO_NODES.map(n=>n.id).join(',');
  if(currentIds !== lastTopoNodeIds){
    renderTopologySkeleton();
    lastTopoNodeIds = currentIds;
  }
  refreshTopology();
}

function statusFilterRow(id, current){
  const opts=[['all','전체'],['good','정상'],['warn','주의'],['crit','위험']];
  return `<div class="chip-row" id="${id}">${opts.map(([v,l])=>`<button class="chip-btn ${v===current?'active':''}" data-f="${v}">${l}</button>`).join('')}</div>`;
}
function wireStatusFilter(id, setter, rerender){
  $$(`#${id} .chip-btn`).forEach(b=> b.addEventListener('click', ()=>{
    $$(`#${id} .chip-btn`).forEach(x=>x.classList.remove('active')); b.classList.add('active');
    setter(b.dataset.f); rerender();
  }));
}
function applyStatusFilter(list, filterVal){
  return filterVal==='all' ? list : list.filter(x=>x.status===filterVal);
}
function modeTag(e){
  if(e.mode==='ping') return `<span class="mono" style="font-size:9.5px;color:${e.reachable?'var(--text-faint)':'var(--crit)'};margin-left:6px">${e.reachable? 'Ping '+fmt0(e.latencyMs||0)+'ms' : '응답없음'}</span>`;
  if(e.mode==='snmp') return `<span class="mono" style="font-size:9.5px;color:${e.reachable?'var(--text-faint)':'var(--crit)'};margin-left:6px">${e.reachable? 'SNMP '+fmt0(e.latencyMs||0)+'ms' : 'SNMP 응답없음'}</span>`;
  if(e.mode==='agent' && !e.online) return `<span class="mono" style="font-size:9.5px;color:var(--warn);margin-left:6px">Agent 대기중</span>`;
  return '';
}

function renderNetwork(){

  const n = NETS.find(x=>x.id===selectedNetId);

    $('#net-chart-title').textContent = `${n.name} 응답시간 추이`;

    $('#net-chart-title').textContent = `응답시간 추이`;

    charts.net_chart.update('none');

    charts.net_chart2.data.datasets[1].data = hasCpuMem && n.hist.mem ? n.hist.mem.map(fmt1) : [];
    charts.net_chart2.update('none');
  }
}

          <p>· <b>SNMP</b>는 스위치·라우터·UPS·NAS 등 SNMP 에이전트가 켜진 장비에서 장치 정보·지연시간을 확인하고, 지원 시 인터페이스 트래픽·CPU·배터리까지 실측합니다. 장비의 SNMP 설정에서 Community 문자열을 미리 확인하세요.</p>
          <p>· 등록된 장비는 서버에 저장되어 다른 브라우저에서 접속해도 동일하게 표시됩니다.</p>
        </div>
      </div>

        <thead><tr><th>영역</th><th>장비명</th><th>수집방식</th><th>IP</th><th>상태</th><th>등록일</th><th></th></tr></thead>

  function updateFormVisibility(){
    $$('#reg-form [data-group]').forEach(g=>{ g.style.display = g.dataset.group===regCategory ? '' : 'none'; });
    $('#mode-btn-agent').style.display = regCategory==='server' ? '' : 'none';
    if(regCategory!=='server' && regMode==='agent') regMode = 'ping';
    $$('#reg-mode-chips .chip-btn').forEach(x=> x.classList.toggle('active', x.dataset.mode===regMode));
    $$('#reg-form [data-mode-group]').forEach(g=>{ g.style.display = g.dataset.modeGroup===regMode ? '' : 'none'; });
    $('#f-ip-label').textContent = (regMode==='ping'||regMode==='snmp') ? 'IP 주소 *' : 'IP 주소 (선택)';
  }
  $$('#reg-cat-chips .chip-btn').forEach(b=> b.addEventListener('click', ()=>{
    $$('#reg-cat-chips .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    regCategory = b.dataset.cat; updateFormVisibility();
  }));
  $$('#reg-mode-chips .chip-btn').forEach(b=> b.addEventListener('click', ()=>{
    regMode = b.dataset.mode; updateFormVisibility();
  }));
  $('#agent-copy-btn').addEventListener('click', ()=>{
    const text = $('#agent-command-text').textContent;
    try{ navigator.clipboard.writeText(text); }catch(e){}
  });
  updateFormVisibility();

  $('#reg-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = $('#reg-error');
    errEl.textContent='';
    const effMode = regCategory==='server' ? regMode : (regMode==='agent' ? 'ping' : regMode);
    const name = $('#f-name').value.trim();
    const ip = $('#f-ip').value.trim();
    if(!name){ errEl.textContent='장비명을 입력하세요'; return; }
    if((effMode==='ping'||effMode==='snmp') && !ip){ errEl.textContent=(effMode==='snmp'?'SNMP':'Ping')+' 모니터링은 IP 주소가 필요합니다'; return; }
    let fields = {};
    if(regCategory==='server'){ fields.os=$('#f-os').value; fields.role=$('#f-role-server').value.trim(); }
    else if(regCategory==='db'){ fields.engine=$('#f-engine').value; fields.role=$('#f-role-db').value.trim(); }
    else if(regCategory==='net'){ fields.type=$('#f-nettype').value; fields.role=$('#f-role-net').value.trim(); }
    else if(regCategory==='fac'){ fields.type=$('#f-factype').value; fields.role=$('#f-role-fac').value.trim(); }
    if(effMode==='snmp'){
      fields.community = $('#f-snmp-community').value.trim() || 'public';
      fields.snmpVersion = $('#f-snmp-version').value;
      fields.snmpPort = parseInt($('#f-snmp-port').value)||161;
    }

    try{
      const result = await registerDevice(regCategory, effMode, name, ip, fields);
      await afterDeviceChange();
      if(result.agentCommand){
        $('#agent-command-text').textContent = result.agentCommand;
        if(result.agentDownloadUrl) $('#agent-download-link').href = result.agentDownloadUrl;
        if(result.agentInstallerUrl) $('#agent-installer-link').href = result.agentInstallerUrl;
        $('#agent-command-box').style.display = '';
      } else {
        e.target.reset();
        $('#agent-command-box').style.display = 'none';
        updateFormVisibility();
      }
    }catch(err){
      errEl.textContent = err.message || '등록에 실패했습니다';
    }
  });
}
function modeLabel(e){
  if(e.mode==='local') return '로컬 (실측)';

  if(e.mode==='snmp') return e.reachable ? 'SNMP (실측)' : 'SNMP (응답없음)';
  return 'Ping (도달성)';
}

async function renderUsers(){
  const r = await apiFetch('/api/users');
  if(!r.ok) return;
  const j = await r.json();

  $('#user-count-sub').textContent = `총 ${users.length}개 계정`;

/* ================= DRAWER ================= */
let openDrawerId = null;
function openDrawerFor(id){
  const s = SERVERS.find(x=>x.id===id);
  const d = DBS.find(x=>x.id===id);
  const n = NETS.find(x=>x.id===id);
  const f = FACS.find(x=>x.id===id);
  const entity = s||d||n||f;
  if(!entity) return;
  if(id !== openDrawerId && ifaceModalState && ifaceModalState.deviceId !== id) closeIfaceModal();
  openDrawerId = id;
  const catLabel = s?'서버 (SMS)':d?'데이터베이스 (DBMS)':n?'네트워크 (NMS)':'전산실 설비 (FMS)';
  const maint = entity.maintenance || {enabled:false};
  const maintBtn = $('#drawerMaintBtn');
  maintBtn.textContent = maint.enabled ? '유지보수 해제' : '유지보수 시작';
  maintBtn.style.color = maint.enabled ? 'var(--warn)' : '';
  maintBtn.style.borderColor = maint.enabled ? 'rgba(255,176,32,.4)' : '';
  maintBtn.onclick = async ()=>{
    const enabling = !maint.enabled;
    await apiFetch(`/api/devices/${id}/maintenance`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled: enabling, start: enabling ? Date.now() : null, end: null, reason: enabling ? '수동 설정' : null}),
    });
    await afterDeviceChange();
  };
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
  if(entity.mode==='ping' || entity.mode==='snmp') drawPingDevice(entity, catLabel);
  else if(entity.mode==='agent' && !entity.online) drawAgentPending(entity, catLabel);
  else if(s) drawServer(s);
  else drawPingDevice(entity, catLabel);
  $('#overlay').classList.add('show'); $('#drawer').classList.add('show');
}
function closeDrawer(){
  openDrawerId = null;
  closeIfaceModal();
  $('#overlay').classList.remove('show'); $('#drawer').classList.remove('show');
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
}
function refreshOpenDrawer(){
  if(!openDrawerId) return;
  if(!findEntity(openDrawerId)){ closeDrawer(); return; }
  openDrawerFor(openDrawerId);
}

function fmtMbps(v){

    <div class="card"><div class="card-head"><h3>인터페이스 목록</h3><span class="sub">클릭하면 트래픽 창이 열립니다 · ${e.portsUp||0}/${ifaces.length} Up</span></div>
      <div id="iface-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        ${ifaces.map(f=>`<div class="iface-row" data-idx="${escapeHtml(f.idx)}" style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;background:${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'var(--accent-soft)':'transparent'};border:1px solid ${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'rgba(124,92,255,.4)':'transparent'}">
          <span class="mono" style="color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px">${escapeHtml(f.name)}</span>
          <span style="display:flex;align-items:center;gap:8px;flex:none">
            ${f.status==='up' ? `<span class="mono" style="font-size:10px;color:var(--text-faint)">${fmtMbps((f.inMbps||0)+(f.outMbps||0))} Mbps</span>` : ''}
            <span class="pill ${f.status==='up'?'good':'neutral'}"><span class="dot"></span>${f.status==='up'?'Up':'Down'}</span>
          </span>
        </div>`).join('')}
      </div>
    </div>` : '';

  $('#drawerBody').innerHTML = `
    <div class="kv-grid">
      <div class="kv"><span>상태</span><b style="color:${levelColor(e.status)}">${statusLabel(e.status)}</b></div>
      <div class="kv"><span>응답시간</span><b>${e.reachable? fmt0(e.latencyMs||0)+'ms' : '응답없음'}</b></div>
      ${extraKv}
    </div>
    <div class="card"><div class="card-head"><h3>응답시간 추이</h3><span class="sub">${isSnmp?'SNMP':'Ping / 포트 확인'} · 최근 60초</span></div>
      <div style="height:160px"><canvas id="drawerChart1"></canvas></div></div>
    ${cpuMemCard}
    ${trafficCard}
    ${ifaceCard}
    <div class="card"><div class="card-head"><h3>안내</h3></div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;margin:0">${isSnmp
        ? 'SNMP로 장치 정보와 응답시간을 실측합니다. 인터페이스·CPU·메모리·배터리 등은 장비가 해당 MIB를 지원할 때만 표시됩니다.'
        : '이 장비는 Ping(또는 포트 확인)으로만 모니터링됩니다. 상세 지표가 필요하면 SNMP로 등록하거나, 해당 PC에 InfraSight 에이전트를 설치해 다시 등록하세요.'}</p>
    </div>
  `;
  $$('.iface-row', $('#drawerBody')).forEach(row=>{
    row.addEventListener('click', ()=>{
      if(ifaceModalState && ifaceModalState.deviceId===e.id && ifaceModalState.idx===row.dataset.idx){
        closeIfaceModal();
      } else {
        openIfaceModal(e.id, row.dataset.idx);
      }
      drawPingDevice(e, catLabel);
    });
  });
  if(drawerBodyEl) drawerBodyEl.scrollTop = prevBodyScroll;
  const newIfaceEl = document.getElementById('iface-list');
  if(newIfaceEl) newIfaceEl.scrollTop = prevIfaceScroll;
  charts.drawer1 = lineChart($('#drawerChart1'), Array(24).fill(''), [{label:'지연시간(ms)', data:(e.hist&&e.hist.latency)||[], color:'#3ecbff', fill:true}], {showX:false});
  if(hasCpuMem){
    const series = [{label:'CPU', data:e.hist.cpu.map(fmt1), color:'#7c5cff'}];
    if(e.hist.mem) series.push({label:'MEM', data:e.hist.mem.map(fmt1), color:'#00e6a8'});
    charts.drawer3 = lineChart($('#drawerChart3'), Array(24).fill(''), series, {showX:false, max:100});
  }
  if(hasTraffic){
    charts.drawer2 = lineChart($('#drawerChart2'), Array(24).fill(''), [{label:'트래픽(Mbps)', data:e.hist.traffic, color:'#ff3ec9', fill:true}], {showX:false});
  }
}
function drawAgentPending(e, catLabel){
  $('#drawerTitle').textContent = e.name;
  $('#drawerRole').textContent = `${catLabel} · Agent 연결 대기 중`;
  $('#drawerBody').innerHTML = `
    <div class="kv-grid"><div class="kv" style="grid-column:span 2"><span>상태</span><b style="color:var(--warn)">에이전트 미연결</b></div></div>
    <div class="card"><div class="card-head"><h3>설치 안내</h3></div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;margin:0">등록 시 안내된 명령어를 해당 PC의 터미널에서 실행하면 몇 초 내로 실시간 지표가 표시됩니다.</p>
    </div>
  `;
}

/* ================= topbar pills / badges ================= */
function refreshBadges(){
  const all = [...SERVERS,...DBS,...NETS,...FACS];
  const c = countStatus(all);
  $('#topStatusPills').innerHTML = `
    <span class="status-pill"><span class="dot" style="background:var(--good)"></span>정상 ${c.good}</span>
    <span class="status-pill"><span class="dot" style="background:var(--warn)"></span>주의 ${c.warn}</span>
    <span class="status-pill"><span class="dot" style="background:var(--crit)"></span>위험 ${c.crit}</span>
  `;
  $('#bellBadge').textContent = INCIDENTS.filter(i=>i.status==='open').length;
  $('#nav-count-servers').textContent = SERVERS.length;
  $('#nav-count-db').textContent = DBS.length;
  $('#nav-count-net').textContent = NETS.length;
  $('#nav-count-fac').textContent = FACS.length;
  $('#nav-count-inc').textContent = INCIDENTS.filter(i=>i.status==='open').length;
  $('#foot-total').textContent = all.length + '대';
  $('#foot-addr').textContent = `${SERVER_INFO.lanIp}:${SERVER_INFO.port}`;
}

/* ================= view routing ================= */
const VIEWS = {
  overview: {skeleton:renderOverviewSkeleton, render:renderOverview, title:'전체 현황', sub:'서버 · DB · 네트워크 · 설비 통합 모니터링 개요'},
  topology: {skeleton:renderTopologySkeleton, render:refreshTopologyView, title:'토폴로지 맵', sub:'인프라 연결 구조 및 실시간 트래픽'},
  servers: {skeleton:renderServersSkeleton, render:renderServers, title:'서버 관리 (SMS)', sub:'CPU · 메모리 · 디스크 · 프로세스 모니터링'},
  database: {skeleton:renderDatabaseSkeleton, render:renderDatabase, title:'데이터베이스 관리 (DBMS)', sub:'RDBMS / NoSQL 성능 및 세션 모니터링'},
  network: {skeleton:renderNetworkSkeleton, render:renderNetwork, title:'네트워크 관리 (NMS)', sub:'스위치 · 라우터 트래픽 및 포트 상태'},
  facility: {skeleton:renderFacilitySkeleton, render:renderFacility, title:'전산실 설비 관리 (FMS)', sub:'UPS · 항온항습기 · 전원 설비 모니터링'},
  incidents: {skeleton:renderIncidentsSkeleton, render:renderIncidents, title:'이벤트 / 장애 관리', sub:'전체 영역 통합 이벤트 로그 및 조치 이력'},
  register: {skeleton:renderRegisterSkeleton, render:renderRegister, title:'장비 등록', sub:'신규 서버 · DB · 네트워크 · 설비 등록 및 관리'},
  users: {skeleton:renderUsersSkeleton, render:renderUsers, title:'사용자 관리', sub:'로그인 계정 및 권한 관리 (ADMIN)'},
};
let currentView = 'overview';
function initSkeletons(){ Object.values(VIEWS).forEach(v=>v.skeleton()); }
function switchView(name){
  if(!VIEWS[name]) return;
  currentView = name;
  $$('.view').forEach(v=> v.classList.toggle('active', v.dataset.view===name));
  $$('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  $('#pageTitle').textContent = VIEWS[name].title;
  $('#pageSub').textContent = VIEWS[name].sub;
  VIEWS[name].render();
  document.getElementById('sidebar').classList.remove('open');
  $('#sidebarScrim').classList.remove('show');
}
$$('.nav-item').forEach(btn=> btn.addEventListener('click', ()=> switchView(btn.dataset.view)));

/* ================= clock ================= */
function tickClock(){
  const now = new Date();
  $('#clockTime').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  $('#clockDate').textContent = `${now.getFullYear()}.${pad2(now.getMonth()+1)}.${pad2(now.getDate())} ${['일','월','화','수','목','금','토'][now.getDay()]}`;
}

/* ================= drawer / sidebar wiring ================= */
$('#drawerClose').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
$('#bellBtn').addEventListener('click', ()=> switchView('incidents'));
$('#hamburgerBtn').addEventListener('click', ()=>{
  $('#sidebar').classList.toggle('open'); $('#sidebarScrim').classList.toggle('show');
});
$('#sidebarScrim').addEventListener('click', ()=>{ $('#sidebar').classList.remove('open'); $('#sidebarScrim').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/auth/logout', {method:'POST'});
  location.reload();
});
$('#changePwBtn').addEventListener('click', ()=>{
  $('#pwError').textContent = ''; $('#pwCurrent').value=''; $('#pwNew').value='';
  $('#pwOverlay').style.display = 'flex';
});
$('#pwCancel').addEventListener('click', ()=>{ $('#pwOverlay').style.display = 'none'; });
$('#pwForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  $('#pwError').textContent = '';
  try{
    const r = await apiFetch('/api/auth/change-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({currentPassword:$('#pwCurrent').value, newPassword:$('#pwNew').value}),
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||'변경 실패');
    alert('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
    location.reload();
  }catch(err){ $('#pwError').textContent = err.message; }
});

/* ================= main loop ================= */
initSkeletons();
tickClock();
setInterval(tickClock, 1000);
(async function boot(){
  await ensureAuthed();
  await syncState();
  refreshBadges();
  switchView('overview');
  setInterval(async ()=>{
    const ok = await syncState();
    if(ok){
      refreshBadges();
      VIEWS[currentView].render();
      refreshOpenDrawer();
      renderIfaceModal();
    }
  }, 2200);
})();

})();
</script>
