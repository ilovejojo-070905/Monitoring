/* ================= Phase 6: shared search/status filter ================= */
function statusFilterRow(id, current){
  const opts=[['all','전체'],['good','정상'],['warn','주의'],['crit','위험']];
  return `<div class="chip-row" id="${id}">${opts.map(([v,l])=>`<button class="chip-btn ${v===current?'active':''}" data-f="${v}">${l}</button>`).join('')}</div>`;
}
function wireStatusFilter(id, setter, rerender){
  $$(`#${id} .chip-btn`).forEach(b=> b.addEventListener('click', ()=>{
    $$(`#${id} .chip-btn`).forEach(x=>x.classList.remove('active')); b.classList.add('active');
    setter(b.dataset.f); rerender();
  }));
}
function applyStatusFilter(list, filterVal){
  return filterVal==='all' ? list : list.filter(x=>x.status===filterVal);
}
// 2-1: shared by every list view's search box -- name/IP substring match,
// plus group and tags, so "3층" finds every device in that group without
// needing a separate control just for that.
function matchesEntitySearch(entity, q){
  if(!q) return true;
  if(entity.name.toLowerCase().includes(q)) return true;
  if((entity.ip||'').includes(q)) return true;
  if((entity.group||'').toLowerCase().includes(q)) return true;
  if((entity.tags||[]).some(t=>t.toLowerCase().includes(q))) return true;
  return false;

/* ================= FLOW ANALYSIS (NetFlow/sFlow, 4-3) =================
   Push-based, unlike every other view in this file: SNMP/Ping/Agent all
   poll a device on a schedule, but a flow exporter sends data to us on its
   own schedule (collector/flow_listener.py's UDP listeners), so this view's
   first job is just answering "is anything actually sending us flows yet".
   No local device in this environment supports NetFlow/sFlow (see the 4-3
   plan notes), so #flow-status-card's empty state is the realistic default
   until real hardware is pointed at this collector. */
let flowRange = '1h';
let flowDeviceFilter = '';
function fmtBytes(n){
  n = n || 0;
  const units = ['B','KB','MB','GB','TB'];
  let i = 0;
  while(n >= 1024 && i < units.length-1){ n /= 1024; i++; }
  return (i===0 ? fmt0(n) : fmt1(n)) + ' ' + units[i];
}
function renderFlowSkeleton(){
  const el = $('#view-flowanalysis');
  el.innerHTML = `
    <div class="card" id="flow-status-card">
      <div class="card-head"><h3>수신 현황</h3><span class="sub">NetFlow(UDP) · sFlow(UDP) exporter</span></div>
      <div id="flow-status-body" class="empty-note">불러오는 중...</div>
    </div>
    <div class="card">
      <div class="card-head" style="align-items:center;flex-wrap:wrap;gap:10px">
        <div><h3>트래픽 분석</h3><span class="sub">흐름(flow) 기반 집계 · 방향(송/수신) 구분 없이 전체 트래픽량 기준</span></div>
        <div class="chip-row" id="flow-range-chips">
          <button class="chip-btn active" data-range="1h">1시간</button>

      </div>
    </div>
    <div class="grid grid-3">
      <div class="card grid-span2">
        <div class="card-head"><h3>대역폭 사용량</h3><span class="sub" id="flow-summary-sub">-</span></div>

      </div>
      <div class="card">
        <div class="card-head"><h3>프로토콜별 분석</h3></div>
        <div style="display:flex;align-items:center;gap:14px">

            <canvas id="flow-protocol-chart"></canvas>

      <div class="table-wrap"><table class="data reg-device-table">
        <thead><tr><th>출발지 IP</th><th>목적지 IP</th><th>트래픽</th><th>패킷</th></tr></thead>
        <tbody id="flow-talkers-tbody"></tbody>
      </table></div>
    </div>
  `;
  $$('#flow-range-chips .chip-btn').forEach(b=> b.addEventListener('click', ()=>{
    $$('#flow-range-chips .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    flowRange = b.dataset.range; renderFlow();
  }));
  $('#flow-device-filter').addEventListener('change', ()=>{
    flowDeviceFilter = $('#flow-device-filter').value; renderFlow();
  });
}
async function renderFlow(){
  const deviceList = [...SERVERS, ...DBS, ...NETS, ...FACS];
  const filterEl = $('#flow-device-filter');
  if(filterEl && filterEl.options.length <= 1){
    filterEl.innerHTML = '<option value="">전체 장비</option>' +
      deviceList.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
  }
  const qs = `range=${flowRange}` + (flowDeviceFilter ? `&deviceId=${encodeURIComponent(flowDeviceFilter)}` : '');
  let status, summary, timeseries, protocols, talkers;
  try{
    [status, summary, timeseries, protocols, talkers] = await Promise.all([
      apiFetch('/api/flow/status').then(r=>r.json()),
      apiFetch(`/api/flow/summary?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/timeseries?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/protocols?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/top-talkers?${qs}`).then(r=>r.json()),
    ]);
  }catch(err){
    $('#flow-status-body').innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(err.message||'')}</div>`;
    return;
  }

  const statusBody = $('#flow-status-body');
  if(!status.exporters || !status.exporters.length){
    statusBody.innerHTML = `<div class="empty-note">
      아직 NetFlow(UDP ${status.netflowPort})/sFlow(UDP ${status.sflowPort})로 트래픽을 보내는 장비가 없습니다.
      장비에서 이 서버 IP로 flow export를 설정하면 여기에 자동으로 나타납니다.
    </div>`;
  } else {
    statusBody.innerHTML = `<div class="table-wrap"><table class="data reg-device-table">
      <thead><tr><th>Exporter IP</th><th>매칭된 장비</th><th>방식</th><th>최근 수신</th><th>누적 레코드</th></tr></thead>
      <tbody>${status.exporters.map(e=>`
        <tr>
          <td class="mono">${escapeHtml(e.exporterIp)}</td>
          <td>${e.deviceName ? escapeHtml(e.deviceName) : '<span style="color:var(--text-faint)">미등록</span>'}</td>
          <td class="mono">${e.protocol==='netflow'?'NetFlow':'sFlow'}</td>
          <td class="mono">${timeAgo(new Date(e.lastSeenAt))}</td>
          <td class="mono">${fmt0(e.recordCount)}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  $('#flow-summary-sub').textContent = `총 ${fmtBytes(summary.bytesTotal)} · 패킷 ${fmt0(summary.packetsTotal)}개 (${flowRange})`;
  const labels = timeseries.points.map(p=> new Date(p.ts).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'}));
  const bwData = timeseries.points.map(p=> p.bytes);
  if(charts.flow_bandwidth) destroyChart('flow_bandwidth');
  charts.flow_bandwidth = lineChart($('#flow-bandwidth-chart'), labels, [
    {label:'트래픽', data:bwData, color:'#3ecbff', fill:true},
  ], {showX:true});

  const protoColors = {TCP:'#7c5cff', UDP:'#00e6a8', ICMP:'#ffb020', OTHER:'#8f99b3'};
  if(charts.flow_protocol) destroyChart('flow_protocol');
  charts.flow_protocol = doughnutChart($('#flow-protocol-chart'),
    protocols.protocols.map(p=>p.protocol), protocols.protocols.map(p=>p.bytes),
    protocols.protocols.map(p=>protoColors[p.protocol]||'#8f99b3'));
  const protoTotal = protocols.protocols.reduce((s,p)=>s+p.bytes,0);
  $('#flow-protocol-legend').innerHTML = protocols.protocols.length ? protocols.protocols.map(p=>`
    <div style="display:flex;align-items:center;gap:7px">
      <span style="width:8px;height:8px;border-radius:50%;background:${protoColors[p.protocol]||'#8f99b3'};flex:none"></span>
      <span style="color:var(--text-dim);font-size:11px;flex:1">${escapeHtml(p.protocol)}</span>
      <span class="mono" style="font-size:10.5px;color:var(--text-faint)">${protoTotal? fmt0(p.bytes/protoTotal*100):0}%</span>
    </div>`).join('') : `<div class="empty-note" style="padding:8px">데이터 없음</div>`;

  $('#flow-talkers-tbody').innerHTML = talkers.pairs.map(p=>`
    <tr>
      <td class="mono">${escapeHtml(p.srcIp)}</td>
      <td class="mono">${escapeHtml(p.dstIp)}</td>
      <td class="mono">${fmtBytes(p.bytes)}</td>
      <td class="mono">${fmt0(p.packets)}</td>
    </tr>`).join('') || `<tr><td colspan="4"><div class="empty-note">해당 구간에 수집된 트래픽이 없습니다</div></td></tr>`;
}

function renderIncidents(){
  let rows = INCIDENTS;
  if(incFilter==='crit') rows = rows.filter(i=>i.severity==='crit');
  if(incFilter==='warn') rows = rows.filter(i=>i.severity==='warn');
  if(incFilter==='info') rows = rows.filter(i=>i.severity==='info');
  if(incFilter==='open') rows = rows.filter(i=>i.status==='open');
  const q = ($('#inc-search')?.value||'').toLowerCase();
  if(q) rows = rows.filter(i=> i.message.toLowerCase().includes(q) || i.source.toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  $('#inc-tbody').innerHTML = rows.slice(0,80).map(i=>`
    <tr>
      <td><span class="pill ${i.severity==='crit'?'crit':i.severity==='warn'?'warn':'good'}"><span class="dot"></span>${i.severity==='crit'?'위험':i.severity==='warn'?'주의':'정보'}</span></td>
      <td class="mono">${i.time.toLocaleTimeString('ko-KR',{hour12:false})}</td>
      <td>${i.category}</td>
      <td class="name">${escapeHtml(i.source)}</td>
      <td>${escapeHtml(i.message)}${i.duringMaintenance?' <span class="pill neutral" style="font-size:9px;padding:1px 6px" title="점검 중 발생 (알림은 억제되었으나 이벤트는 기록됨)">점검중</span>':''}</td>
      <td><span class="pill neutral">${i.status==='open'?'미해결':i.status==='ack'?'확인됨':'해결됨'}</span></td>
      <td>${i.status==='open' ? `<button class="btn" data-ack="${i.id}">확인</button>` : ''}</td>
    </tr>`).join('') || `<tr><td colspan="7"><div class="empty-note">해당 조건의 이벤트가 없습니다</div></td></tr>`;
  $$('#inc-tbody [data-ack]').forEach(b=> b.addEventListener('click', async (e)=>{
    e.stopPropagation();
    await ackIncident(b.dataset.ack);
    await syncState();
    renderIncidents(); refreshBadges();
  }));
}

  function updateFormVisibility(){
    $$('#reg-form [data-group]').forEach(g=>{ g.style.display = g.dataset.group===regCategory ? '' : 'none'; });
    $('#mode-btn-agent').style.display = regCategory==='server' ? '' : 'none';

    $$('#reg-mode-chips .chip-btn').forEach(x=> x.classList.toggle('active', x.dataset.mode===regMode));
    $$('#reg-form [data-mode-group]').forEach(g=>{ g.style.display = g.dataset.modeGroup===regMode ? '' : 'none'; });
    $('#f-ip-label').textContent = (regMode==='ping'||regMode==='snmp') ? 'IP 주소 *' : 'IP 주소 (선택)';

  // OS/엔진/네트워크 유형/설비 유형 선택에서 "기타"를 고르면 바로 아래 직접
  // 입력란을 보여준다 -- 선택이 아닌 값으로 돌아가면 항상 비워서, 드롭다운을
  // 다시 프리셋으로 바꿨을 때 안 보이는 기존 입력값이 제출에 섞여 들어가는
  // 일이 없게 한다.

  function updateOtherFieldVisibility(selId, otherId){
    const sel = $('#'+selId), other = $('#'+otherId);

  function updateSnmpFieldVisibility(){

  function updateSnmpSubmitGate(){

  function buildSnmpTestPayload(){
    const ip = $('#f-ip').value.trim();
    if(!ip) return {error:'IP 주소를 먼저 입력하세요'};
    const version = $('#f-snmp-version').value;
    const port = parseInt($('#f-snmp-port').value) || 161;
    const payload = {ip, snmpVersion: version, snmpPort: port};
    if(version === 'v3'){
      const username = $('#f-snmp-v3-username').value.trim();
      if(!username) return {error:'SNMPv3 사용자명을 입력하세요'};
      payload.snmpv3Username = username;
      const lvl = $('#f-snmp-v3-seclevel').value;
      if(lvl==='authNoPriv' || lvl==='authPriv'){
        const authPw = $('#f-snmp-v3-authpw').value;
        if(!authPw) return {error:'인증 비밀번호를 입력하세요'};
        if(authPw.length < 8) return {error:'인증 비밀번호는 8자 이상이어야 합니다'};
        payload.snmpv3AuthProtocol = $('#f-snmp-v3-authproto').value;
        payload.snmpv3AuthPassword = authPw;
      }
      if(lvl==='authPriv'){
        const privPw = $('#f-snmp-v3-privpw').value;
        if(!privPw) return {error:'개인정보 보호 비밀번호를 입력하세요'};
        if(privPw.length < 8) return {error:'개인정보 보호 비밀번호는 8자 이상이어야 합니다'};
        payload.snmpv3PrivProtocol = $('#f-snmp-v3-privproto').value;
        payload.snmpv3PrivPassword = privPw;
      }
    } else {
      payload.community = $('#f-snmp-community').value.trim() || 'public';
    }
    return payload;
  }
  $('#snmp-test-btn').addEventListener('click', async ()=>{
    const resultEl = $('#snmp-test-result');
    const btn = $('#snmp-test-btn');
    const payload = buildSnmpTestPayload();
    if(payload.error){ resultEl.textContent = payload.error; resultEl.style.color = 'var(--crit)'; return; }
    btn.disabled = true; btn.textContent = '테스트 중...';
    resultEl.textContent = '응답 대기 중...'; resultEl.style.color = 'var(--text-faint)';
    try{
      const r = await apiFetch('/api/devices/test-snmp', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const j = await r.json();
      if(!r.ok || j.ok === false){
        resultEl.textContent = j.error || '테스트에 실패했습니다';
        resultEl.style.color = 'var(--crit)';
        snmpTestPassed = false;
      } else {
        resultEl.textContent = '✓ ' + (j.message || '연결에 성공했습니다');
        resultEl.style.color = 'var(--good)';
        snmpTestPassed = true;
      }
    }catch(err){
      resultEl.textContent = err.message || '테스트 중 오류가 발생했습니다';
      resultEl.style.color = 'var(--crit)';
      snmpTestPassed = false;
    }finally{
      btn.disabled = false; btn.textContent = '연결 테스트';
      updateSnmpSubmitGate();
    }
  });

  function scanResultsTableHtml(results){
    if(!results.length) return `<div class="empty-note">응답하는 장비를 찾지 못했습니다.</div>`;
    return `
      <div class="table-wrap"><table class="data reg-device-table">
        <thead><tr><th>IP</th><th>호스트명</th><th>응답시간</th><th>추정 장비 종류</th><th></th></tr></thead>
        <tbody>
          ${results.map(d=>`
            <tr>
              <td class="mono">${escapeHtml(d.ip)}</td>
              <td>${escapeHtml(d.hostname||'-')}</td>
              <td class="mono">${typeof d.latencyMs==='number' ? fmt0(d.latencyMs)+' ms' : '-'}</td>
              <td>${d.guessedType ? escapeHtml(d.guessedType) : '<span style="color:var(--text-faint)">-</span>'}</td>
              <td>${d.alreadyRegistered
                ? `<span class="pill" style="font-size:11px">이미 등록됨</span>`
                : `<button type="button" class="btn" data-fill-ip="${escapeHtml(d.ip)}" data-fill-name="${escapeHtml(d.hostname||d.ip)}">등록 폼에 채우기</button>`}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
      <div style="font-size:11px;color:var(--text-faint);margin-top:6px">${results.length}대 발견</div>
    `;
  }

      if(!j.scans.length){ panel.innerHTML = `<div class="empty-note">탐지 이력이 없습니다.</div>`; return; }

      $$('[data-view-scan]', panel).forEach(b=> b.addEventListener('click', async ()=>{

        // DB 조회(ORDER BY ip)는 문자열 정렬이라 "250"이 "30"보다 앞에

        // 옥텟 기준 숫자 정렬로 맞춘다.
        const mapped = detail.results.map(x=>({ip:x.ip, hostname:x.hostname, latencyMs:x.latency_ms,
          guessedType:x.guessed_type, alreadyRegistered:!!x.already_registered}))
          .sort((a,b)=> a.ip.split('.').map(Number).reduce((n,p,i)=>n+p*Math.pow(1000,3-i),0)
                       - b.ip.split('.').map(Number).reduce((n,p,i)=>n+p*Math.pow(1000,3-i),0));
        resultsEl.innerHTML = `<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:6px">
          ${new Date(detail.started_at).toLocaleString('ko-KR')} · ${escapeHtml(detail.range_text)} 스캔 결과</div>`
          + scanResultsTableHtml(mapped);
        wireFillButtons(resultsEl);
        resultsEl.scrollIntoView({behavior:'smooth', block:'start'});
      }));

      panel.innerHTML = `<div class="empty-note">${escapeHtml(err.message)}</div>`;

        $('#f-engine-other').value = entity.engine;
      } else {

        $('#f-engine-other').value = '';

      updateOtherFieldVisibility('f-engine','f-engine-other');
      $('#f-role-db').value = entity.role||'';

        nettypeSelEl.value = '기타';
        $('#f-nettype-other').value = entity.type;
      } else {
        nettypeSelEl.value = entity.type || '공유기';
        $('#f-nettype-other').value = '';
      }
      updateOtherFieldVisibility('f-nettype','f-nettype-other');
    }
    else if(cat==='fac'){
      const factypeSelEl = $('#f-factype');
      const factypePresetMatch = [...factypeSelEl.options].some(o=> o.value===(entity.type||''));
      if(entity.type && !factypePresetMatch){
        factypeSelEl.value = '기타';
        $('#f-factype-other').value = entity.type;
      } else {

      $('#f-snmp-version').value = entity.snmpVersion || 'v2c';
      $('#f-snmp-port').value = entity.snmpPort || 161;
      // v3 username/protocols/passwords are credentials -- like the community
      // string above, they're never sent back to the client to prefill, so
      // every v3 field starts blank here. Unlike community there's no

      // security level defaults to the most-common case (authPriv) rather
      // than implying "no auth" just because nothing was typed.
      $('#f-snmp-v3-username').value = '';
      $('#f-snmp-v3-username').placeholder = '변경하려면 입력 (비워두면 기존 값 유지)';
      $('#f-snmp-v3-seclevel').value = 'authPriv';
      $('#f-snmp-v3-authpw').value = '';
      $('#f-snmp-v3-privpw').value = '';
    }
    updateSnmpFieldVisibility();
    markSnmpUntested();

  $('#reg-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = $('#reg-error');
    errEl.textContent='';
    const effMode = regCategory==='server' ? regMode : (regMode==='agent' ? 'ping' : regMode);
    const name = $('#f-name').value.trim();
    const ip = $('#f-ip').value.trim();
    if(!name){ errEl.textContent='장비명을 입력하세요'; return; }
    if((effMode==='ping'||effMode==='snmp') && !ip){ errEl.textContent=(effMode==='snmp'?'SNMP':'Ping')+' 모니터링은 IP 주소가 필요합니다'; return; }
    let fields = {};
    const groupVal = $('#f-group').value.trim();
    if(groupVal) fields.group = groupVal;
    try{
      const th = readThresholdFields('f-th');
      if(Object.keys(th).length) fields.thresholds = th;
    }catch(thErr){ errEl.textContent = thErr.message; return; }
    if(regCategory==='server'){
      const osSel = $('#f-os').value;
      if(osSel==='기타'){
        const customOs = $('#f-os-other').value.trim();
        if(!customOs){ errEl.textContent = 'OS를 직접 입력해주세요'; return; }
        fields.os = customOs;
      } else {
        fields.os = osSel;
      }
      fields.role=$('#f-role-server').value.trim();
    }
    else if(regCategory==='db'){
      const engineSel = $('#f-engine').value;
      if(engineSel==='기타'){
        const customEngine = $('#f-engine-other').value.trim();
        if(!customEngine){ errEl.textContent = '엔진을 직접 입력해주세요'; return; }
        fields.engine = customEngine;
      } else {
        fields.engine = engineSel;
      }
      fields.role=$('#f-role-db').value.trim();
    }
    else if(regCategory==='net'){
      const nettypeSel = $('#f-nettype').value;
      if(nettypeSel==='기타'){
        const customType = $('#f-nettype-other').value.trim();
        if(!customType){ errEl.textContent = '유형을 직접 입력해주세요'; return; }
        fields.type = customType;
      } else {
        fields.type = nettypeSel;
      }
    }
    else if(regCategory==='fac'){
      const factypeSel = $('#f-factype').value;
      if(factypeSel==='기타'){
        const customFactype = $('#f-factype-other').value.trim();
        if(!customFactype){ errEl.textContent = '유형을 직접 입력해주세요'; return; }
        fields.type = customFactype;
      } else {
        fields.type = factypeSel;
      }
      fields.role=$('#f-role-fac').value.trim();
    }
    if(effMode==='snmp'){
      if(!editingDeviceId && !snmpTestPassed){
        errEl.textContent = 'SNMP 연결 테스트를 먼저 통과해야 등록할 수 있습니다';
        return;
      }
      const snmpVersion = $('#f-snmp-version').value;
      fields.snmpVersion = snmpVersion;
      fields.snmpPort = parseInt($('#f-snmp-port').value)||161;
      if(snmpVersion === 'v3'){
        const usernameInput = $('#f-snmp-v3-username').value.trim();
        if(!editingDeviceId && !usernameInput){ errEl.textContent = 'SNMPv3 사용자명을 입력하세요'; return; }
        // Editing: blank means "keep the existing secret" (it's never sent
        // back to the client to prefill, so blank is the only way to say
        // that) -- same pattern the community string already used below.
        if(usernameInput || !editingDeviceId) fields.snmpv3Username = usernameInput;
        const lvl = $('#f-snmp-v3-seclevel').value;
        if(lvl==='authNoPriv' || lvl==='authPriv'){
          const authPwInput = $('#f-snmp-v3-authpw').value;
          if(authPwInput || !editingDeviceId){
            if(!authPwInput){ errEl.textContent = '인증 비밀번호를 입력하세요'; return; }
            if(authPwInput.length < 8){ errEl.textContent = '인증 비밀번호는 8자 이상이어야 합니다'; return; }
            fields.snmpv3AuthProtocol = $('#f-snmp-v3-authproto').value;
            fields.snmpv3AuthPassword = authPwInput;
          }
        }
        if(lvl==='authPriv'){
          const privPwInput = $('#f-snmp-v3-privpw').value;
          if(privPwInput || !editingDeviceId){
            if(!privPwInput){ errEl.textContent = '개인정보 보호 비밀번호를 입력하세요'; return; }
            if(privPwInput.length < 8){ errEl.textContent = '개인정보 보호 비밀번호는 8자 이상이어야 합니다'; return; }
            fields.snmpv3PrivProtocol = $('#f-snmp-v3-privproto').value;
            fields.snmpv3PrivPassword = privPwInput;
          }
        }
      } else {
        const communityInput = $('#f-snmp-community').value.trim();
        // Adding: blank falls back to the common SNMP default (v3 has no
        // equivalent insecure default, which is why it's required above).
        if(communityInput || !editingDeviceId) fields.community = communityInput || 'public';
      }
    }

    // Prevents an impatient/accidental double-click on 장비 등록 from firing
    // two separate registration requests before the first one's response
    // (and the resulting form-reset) ever lands -- exactly how a device could
    // previously end up registered twice under the same name.
    const submitBtn = $('#reg-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = editingDeviceId ? '수정 중...' : '등록 중...';
    try{
      if(editingDeviceId){
        await updateDevice(editingDeviceId, name, ip, fields);
        await afterDeviceChange();
        exitEditMode();
      } else {
        const result = await registerDevice(regCategory, effMode, name, ip, fields);
        await afterDeviceChange();
        if(result.agentCommand){
          $('#agent-command-text').textContent = result.agentCommand;
          if(result.agentDownloadUrl) $('#agent-download-link').href = result.agentDownloadUrl;
          if(result.agentInstallerUrl) $('#agent-installer-link').href = result.agentInstallerUrl;
          if(result.agentConfigUrl) $('#agent-config-link').href = result.agentConfigUrl;
          $('#agent-command-box').style.display = '';
        } else {
          e.target.reset();
          $('#agent-command-box').style.display = 'none';
          updateFormVisibility();
          markSnmpUntested();
        }
      }
    }catch(err){
      const msg = err.message || (editingDeviceId ? '수정에 실패했습니다' : '등록에 실패했습니다');
      errEl.textContent = msg;
      alert(msg);
    }finally{
      // Not a blind re-enable: a freshly-submitted/reset SNMP form needs a
      // new connection test before the NEXT registration too, so this has
      // to go through the same gate rather than just flipping disabled back
      // to false regardless of state.
      updateSnmpSubmitGate();
      submitBtn.textContent = editingDeviceId ? '수정 완료' : '장비 등록';
    }
  });
}
function renderRegister(){

async function renderTotpBody(){
  const body = $('#totp-body');
  if(!body) return;

  const st = await r.json();
  if(st.enabled){
    body.innerHTML = `
      <div class="kv-grid" style="margin-bottom:12px">
        <div class="kv"><span>상태</span><span class="pill good" style="width:fit-content"><span class="dot"></span>사용 중</span></div>
        <div class="kv"><span>남은 복구 코드</span><b id="totp-recovery-count">${st.recoveryCodesRemaining}개</b></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        ${totpFieldWrap('인증 코드 (아래 작업에 공통 사용)', '<input type="text" id="totp-action-code" inputmode="numeric" maxlength="6" placeholder="000000" style="width:120px">')}
        <button type="button" class="btn" id="totp-regen-btn">복구 코드 재발급</button>
        <button type="button" class="btn" id="totp-disable-btn" style="color:var(--crit)">2FA 비활성화</button>
      </div>

      <div id="totp-recovery-box" style="display:none;margin-top:12px"></div>

    $('#totp-regen-btn').addEventListener('click', async ()=>{
      const code = $('#totp-action-code').value.trim();
      const errEl = $('#totp-action-error');
      errEl.textContent = '';
      const ok = await showConfirm('기존 복구 코드가 모두 무효화되고 새 코드가 발급됩니다. 계속할까요?', {title:'복구 코드 재발급', okText:'재발급'});
      if(!ok) return;
      const r2 = await apiFetch('/api/auth/totp/recovery-codes/regenerate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code})});
      const j2 = await r2.json();
      if(!r2.ok){ errEl.textContent = j2.error||'재발급 실패'; return; }
      // Deliberately NOT a full renderTotpBody() re-render here -- that
      // would replace #totp-recovery-box (and the codes just shown in it)
      // out from under the user the instant its own fetch resolved. A full
      // re-render only happens on /enroll/confirm below, where the box is

      // against it.
      showRecoveryCodes(j2.recoveryCodes, '#totp-recovery-box');

      if(!ok) return;
      const r2 = await apiFetch('/api/auth/totp/disable', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code})});
      const j2 = await r2.json();
      if(!r2.ok){ errEl.textContent = j2.error||'비활성화 실패'; return; }
      renderTotpBody();
    });

    body.innerHTML = `

      $('#totp-enroll-box').innerHTML = `
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">

            <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">

              <button type="button" class="btn primary" id="totp-confirm-btn">확인하고 활성화</button>
            </div>
            <div id="totp-confirm-error" style="color:var(--crit);font-size:11.5px;margin-top:8px"></div>

        if(!r3.ok){ errEl.textContent = j3.error||'확인 실패'; return; }

        // #totp-body from the "not enrolled" layout to the "enrolled" one,
        // and only the latter has #totp-recovery-box at all. Showing codes
        // first (or racing it via setTimeout) targets a box that doesn't
        // exist yet in the DOM and silently shows nothing.
        await renderTotpBody();
        showRecoveryCodes(j3.recoveryCodes, '#totp-recovery-box');
      });
    });
  }
}

let slaLoaded = false;

function fmtDuration(ms){
  if(ms == null) return '-';
  const totalMin = Math.round(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  const parts = [];
  if(days) parts.push(days+'일');
  if(hours) parts.push(hours+'시간');
  if(!days && mins) parts.push(mins+'분');
  return parts.length ? parts.join(' ') : '0분';
}
function uptimePillClass(pct){ return pct>=99.9?'good':pct>=99?'warn':'crit'; }
function toDatetimeLocalValue(ms){
  const d = new Date(ms);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function applySlaRange(days){
  slaRangeDays = days;
  const end = Date.now();
  const start = days===1 ? new Date().setHours(0,0,0,0) : end - days*86400000;
  $('#sla-start').value = toDatetimeLocalValue(start);
  $('#sla-end').value = toDatetimeLocalValue(end);
}
function populateReportTargetOptions(){
  const sel = $('#report-target');
  if(!sel) return;
  const prevValue = sel.value;
  const all = [...SERVERS, ...DBS, ...NETS, ...FACS];
  const groups = [...new Set(all.map(e=>e.group).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">전체</option>'
    + (groups.length ? `<optgroup label="그룹">${groups.map(g=>`<option value="group:${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</optgroup>` : '')
    + `<optgroup label="장비">${all.map(d=>`<option value="device:${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join('')}</optgroup>`;
  if([...sel.options].some(o=>o.value===prevValue)) sel.value = prevValue;
}
function downloadReport(fmt){
  const type = $('#report-type').value;
  const target = $('#report-target').value;
  const start = new Date($('#sla-start').value).getTime();
  const end = new Date($('#sla-end').value).getTime();
  if(!start || !end || start >= end){ alert('기간을 먼저 선택해주세요'); return; }
  let url = `/api/reports/export?type=${type}&format=${fmt}&start=${start}&end=${end}`;
  if(target.startsWith('device:')) url += '&deviceId='+encodeURIComponent(target.slice(7));
  else if(target.startsWith('group:')) url += '&group='+encodeURIComponent(target.slice(6));
  // A plain navigation (not fetch+blob) -- the server sends Content-
  // Disposition: attachment, so the browser downloads the file and stays
  // on this page, same pattern the existing agent-installer download link
  // already uses. This also means the request carries the session cookie
  // automatically, same as any other same-origin navigation.
  window.location.href = url;
}

      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:10px"><input type="checkbox" id="sla-sev-crit" ${j.downtimeSeverities.includes('crit')?'checked':''}> 위험 (crit) 포함</label>
      <button type="button" class="btn primary" id="sla-settings-save">저장</button>
      <span id="sla-settings-status" style="font-size:11.5px;margin-left:8px"></span>
    `;
    $('#sla-settings-save').addEventListener('click', async ()=>{
      const sevs = [];
      if($('#sla-sev-warn').checked) sevs.push('warn');
      if($('#sla-sev-crit').checked) sevs.push('crit');
      const statusEl = $('#sla-settings-status');
      if(!sevs.length){ statusEl.textContent = '최소 1개는 선택해야 합니다'; statusEl.style.color = 'var(--crit)'; return; }
      const r2 = await apiFetch('/api/sla/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({downtimeSeverities: sevs})});
      const j2 = await r2.json();
      statusEl.textContent = r2.ok ? '저장되었습니다 (다음 조회부터 적용)' : (j2.error||'저장 실패');
      statusEl.style.color = r2.ok ? 'var(--good)' : 'var(--crit)';
    });
  });
}

function wireChannelHandlers(){
  const setStatus = (prefix, text, ok)=>{
    const el = $('#ch-'+prefix+'-status');
    if(el){ el.textContent = text; el.style.color = ok ? 'var(--good)' : 'var(--crit)'; }
  };
  $('#ch-smtp-save').addEventListener('click', async ()=>{
    setStatus('smtp', '', true);
    const body = {
      host: $('#ch-smtp-host').value.trim(), port: parseInt($('#ch-smtp-port').value) || null,
      username: $('#ch-smtp-username').value.trim(), password: $('#ch-smtp-password').value || null,
      alertTo: $('#ch-smtp-alertto').value.trim(), minSeverity: $('#ch-smtp-minseverity').value,
      useTls: $('#ch-smtp-usetls').checked, enabled: $('#ch-smtp-enabled').checked,
    };
    const r = await apiFetch('/api/settings/smtp', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ setStatus('smtp', j.error||'저장 실패', false); return; }
    setStatus('smtp', '저장되었습니다', true);
    $('#ch-smtp-password').value = '';
    loadChannelSettings();
  });
  $('#ch-smtp-test').addEventListener('click', async ()=>{
    setStatus('smtp', '발송 중...', true);
    const r = await apiFetch('/api/settings/smtp/test', {method:'POST'});
    const j = await r.json();
    setStatus('smtp', r.ok ? '테스트 발송 성공' : (j.error||'발송 실패'), r.ok);
    // 발송 이력 패널이 이미 열려 있다면 방금 보낸 테스트 결과가 바로 보이도록
    // 다시 불러온다 -- 닫혀 있으면 건드리지 않는다 (불필요한 요청 방지).
    const panel = $('#ch-smtp-log-panel');
    if(panel && panel.style.display !== 'none') loadSmtpLogPanel();
  });
  function loadSmtpLogPanel(){
    const panel = $('#ch-smtp-log-panel');
    if(!panel) return;
    panel.innerHTML = '<div class="empty-note">불러오는 중...</div>';
    apiFetch('/api/settings/smtp/log').then(async r=>{
      const j = await r.json();
      if(!r.ok){ panel.innerHTML = `<div class="empty-note">${escapeHtml(j.error||'불러오기 실패')}</div>`; return; }
      if(!j.log.length){ panel.innerHTML = '<div class="empty-note">발송 이력이 없습니다</div>'; return; }
      panel.innerHTML = `<div class="table-wrap"><table class="data reg-device-table">
        <thead><tr><th>시각</th><th>심각도</th><th>발생 위치</th><th>수신자</th><th>결과</th><th>시도 횟수</th><th>오류</th></tr></thead>
        <tbody>${j.log.map(l=>`<tr>
          <td style="font-size:11px;white-space:nowrap">${fmtWhen(l.ts)}</td>
          <td>${escapeHtml(l.severity)}</td>
          <td class="name">${escapeHtml(l.source)}</td>
          <td class="mono" style="font-size:11px">${escapeHtml(l.recipient)}</td>
          <td><span class="pill ${l.status==='success'?'good':'crit'}">${l.status==='success'?'성공':'실패'}</span></td>
          <td class="mono">${l.attempts}</td>
          <td style="font-size:11px;color:var(--crit)">${l.error?escapeHtml(l.error):'-'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    });
  }
  $('#ch-smtp-log-btn').addEventListener('click', ()=>{
    const panel = $('#ch-smtp-log-panel');
    if(panel.style.display !== 'none'){ panel.style.display = 'none'; return; }
    panel.style.display = '';
    loadSmtpLogPanel();
  });
  for(const prefix of ['slack','teams']){
    $('#ch-'+prefix+'-save').addEventListener('click', async ()=>{
      setStatus(prefix, '', true);
      const body = {
        url: $('#ch-'+prefix+'-url').value.trim() || null,
        minSeverity: $('#ch-'+prefix+'-minseverity').value,
        enabled: $('#ch-'+prefix+'-enabled').checked,
      };
      const r = await apiFetch('/api/settings/'+prefix, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json();
      if(!r.ok){ setStatus(prefix, j.error||'저장 실패', false); return; }
      setStatus(prefix, '저장되었습니다', true);
      $('#ch-'+prefix+'-url').value = '';
      loadChannelSettings();
    });
    $('#ch-'+prefix+'-test').addEventListener('click', async ()=>{
      setStatus(prefix, '발송 중...', true);
      const r = await apiFetch('/api/settings/'+prefix+'/test', {method:'POST'});
      const j = await r.json();
      setStatus(prefix, r.ok ? '테스트 발송 성공' : (j.error||'발송 실패'), r.ok);
    });
  }
  $('#ch-kakao-save').addEventListener('click', async ()=>{
    const body = {
      enabled: $('#ch-kakao-enabled').checked,
      senderKey: $('#ch-kakao-senderkey').value.trim(),
      templateCode: $('#ch-kakao-templatecode').value.trim(),
    };
    const r = await apiFetch('/api/settings/kakao', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    setStatus('kakao', r.ok ? '저장되었습니다' : (j.error||'저장 실패'), r.ok);
  });
  $('#ch-sms-save').addEventListener('click', async ()=>{
    const body = {
      enabled: $('#ch-sms-enabled').checked, provider: $('#ch-sms-provider').value.trim(),
      senderNumber: $('#ch-sms-sendernumber').value.trim(), apiKey: $('#ch-sms-apikey').value || null,
    };
    const r = await apiFetch('/api/settings/sms', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ setStatus('sms', j.error||'저장 실패', false); return; }
    setStatus('sms', '저장되었습니다', true);
    $('#ch-sms-apikey').value = '';
  });
}

const RS_FREQ_LABEL = {weekly:'주간', monthly:'월간'};
const RS_TYPE_LABEL = {incident:'장애 이력', resource:'자원 사용률', network:'네트워크 상태'};
function populateReportScheduleTargetOptions(){
  const sel = $('#rs-target');
  if(!sel) return;
  const prevValue = sel.value;
  const all = [...SERVERS, ...DBS, ...NETS, ...FACS];
  const groups = [...new Set(all.map(e=>e.group).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">전체</option>'
    + (groups.length ? `<optgroup label="그룹">${groups.map(g=>`<option value="group:${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</optgroup>` : '')
    + `<optgroup label="장비">${all.map(d=>`<option value="device:${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join('')}</optgroup>`;
  if([...sel.options].some(o=>o.value===prevValue)) sel.value = prevValue;
}
function reportScheduleTargetDesc(s){
  if(s.device_id){
    const d = [...SERVERS,...DBS,...NETS,...FACS].find(x=>x.id===s.device_id);
    return '장비: '+(d?d.name:s.device_id);
  }
  if(s.group_name) return '그룹: '+s.group_name;
  return '전체';
}

function wireReportScheduleHandlers(){
  $('#rs-create-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = $('#rs-error');
    errEl.textContent = '';
    const recipients = $('#rs-recipients').value.split(',').map(s=>s.trim()).filter(Boolean);
    const target = $('#rs-target').value;
    const body = {
      name: $('#rs-name').value.trim(), frequency: $('#rs-frequency').value,
      reportType: $('#rs-type').value, format: $('#rs-format').value, recipients,
    };
    if(target.startsWith('device:')) body.deviceId = target.slice(7);
    else if(target.startsWith('group:')) body.group = target.slice(6);
    const r = await apiFetch('/api/reports/schedules', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ errEl.textContent = j.error||'등록 실패'; return; }
    $('#rs-name').value = ''; $('#rs-recipients').value = '';
    renderReportScheduleList();
  });

    const panel = $('#rs-log-panel');
    if(panel.style.display !== 'none'){ panel.style.display = 'none'; return; }
    panel.style.display = '';
    panel.innerHTML = '<div class="empty-note">불러오는 중...</div>';
    const r = await apiFetch('/api/reports/delivery-log?limit=50');

async function renderUsers(){
  const r = await apiFetch('/api/users');

  const j = await r.json();
  const users = j.users||[];
  $('#user-count-sub').textContent = `총 ${users.length}개 계정`;
  const now = Date.now();
  $('#user-tbody').innerHTML = users.map(u=>{
    const locked = u.locked_until && u.locked_until > now;
    const inactive = !u.is_active;
    // 1-4: 운영자는 ADMIN 계정을 건드릴 수 없다 (서버도 동일하게 막음 --
    // _operator_blocked_on_admin_target) -- 그 계정 행에서는 제어 버튼을
    // 아예 숨겨서 눌러봐야 403이 나는 상황 자체를 만들지 않는다.

    let statusHtml;
    if(inactive) statusHtml = `<span class="pill neutral">비활성화</span>`;

    else statusHtml = `<span class="pill good">정상</span>`;

      <td class="name">${escapeHtml(u.username)}${u.username===CURRENT_USER?' <span class="pill info" style="font-size:9px">나</span>':''}</td>
      <td><span class="pill neutral">${ROLE_LABEL[u.role]||u.role}</span></td>
      <td class="mono">${u.created_at ? new Date(u.created_at).toLocaleDateString('ko-KR') : '-'}</td>
      <td class="mono">${u.last_login_at ? new Date(u.last_login_at).toLocaleString('ko-KR') : '-'}</td>
      <td>${statusHtml}</td>
      <td>${u.totp_enabled ? '<span class="pill good" style="font-size:9px">사용 중</span>' : (u.role==='ADMIN' ? '<span class="pill crit" style="font-size:9px">미설정</span>' : '<span class="pill neutral" style="font-size:9px">사용 안 함</span>')}</td>

        ${canManage && locked ? `<button type="button" class="btn" data-unlock="${u.id}">잠금 해제</button>` : ''}
        ${canManage && u.totp_enabled ? `<button type="button" class="btn" data-totpreset="${u.id}">2FA 초기화</button>` : ''}
        ${canManage && u.username!==CURRENT_USER ? `<button type="button" class="btn" data-toggleactive="${u.id}" data-active="${u.is_active?1:0}">${inactive?'활성화':'비활성화'}</button>` : ''}
        ${canManage && u.username!==CURRENT_USER ? `<button type="button" class="btn" data-deluser="${u.id}">삭제</button>` : ''}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="7"><div class="empty-note">계정이 없습니다</div></td></tr>`;
  $$('#user-tbody [data-deluser]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!(await showConfirm('이 계정을 삭제할까요?', {title:'계정 삭제', okText:'삭제'}))) return;
    const r = await apiFetch('/api/users/'+b.dataset.deluser, {method:'DELETE'});
    const j = await r.json();
    if(!r.ok){ alert(j.error||'삭제 실패'); return; }
    renderUsers();
  }));
  $$('#user-tbody [data-unlock]').forEach(b=> b.addEventListener('click', async ()=>{
    await apiFetch('/api/users/'+b.dataset.unlock+'/unlock', {method:'POST'});
    renderUsers();
  }));
  $$('#user-tbody [data-totpreset]').forEach(b=> b.addEventListener('click', async ()=>{
    const ok = await showConfirm('이 계정의 2FA를 초기화할까요? 기존 인증 앱 등록과 복구 코드가 모두 무효화되고, 현재 로그인된 세션도 함께 종료됩니다. 분실/교체된 기기 때문일 때만 사용하세요.', {title:'2FA 초기화', okText:'초기화'});

  }));
  $$('#user-tbody [data-toggleactive]').forEach(b=> b.addEventListener('click', async ()=>{

    renderUsers();
  }

}

/* ================= 2-2 threshold settings (global/group/device) ================= */
const THRESHOLD_METRIC_LABEL = {cpu:'CPU', mem:'메모리', disk:'디스크'};
function thresholdFieldsHtml(prefix, values){
  const v = values || {};
  return `
    <div class="form-grid">
      ${Object.entries(THRESHOLD_METRIC_LABEL).map(([k,label])=>`
        <div class="field"><label>${label} 경고 (%)</label><input type="number" min="0" max="100" id="${prefix}-${k}-warn" value="${v[k]&&v[k].warn!=null?v[k].warn:''}"></div>
        <div class="field"><label>${label} 심각 (%)</label><input type="number" min="0" max="100" id="${prefix}-${k}-crit" value="${v[k]&&v[k].crit!=null?v[k].crit:''}"></div>
      `).join('')}
      <div class="field" style="grid-column:1/-1"><label>초과 지속 시간 (초, 0=즉시)</label><input type="number" min="0" max="14400" id="${prefix}-sustained" value="${v.sustainedSec!=null?v.sustainedSec:''}"></div>
    </div>`;
}
function readThresholdFields(prefix){
  const out = {};
  for(const k of Object.keys(THRESHOLD_METRIC_LABEL)){
    const wEl = $('#'+prefix+'-'+k+'-warn'), cEl = $('#'+prefix+'-'+k+'-crit');
    if(!wEl) continue;
    const w = wEl.value.trim(), c = cEl.value.trim();
    if(w === '' && c === '') continue;
    if(w === '' || c === '') throw new Error(`${THRESHOLD_METRIC_LABEL[k]} 임계치는 경고/심각 값을 모두 입력해야 합니다`);
    const wv = Number(w), cv = Number(c);
    if(!(wv>=0 && wv<=100 && cv>=0 && cv<=100)) throw new Error('임계치는 0~100 사이여야 합니다');
    if(wv >= cv) throw new Error(`${THRESHOLD_METRIC_LABEL[k]}의 경고 값은 심각 값보다 작아야 합니다`);
    out[k] = {warn: wv, crit: cv};
  }
  const sEl = $('#'+prefix+'-sustained');
  if(sEl){
    const s = sEl.value.trim();
    if(s !== '') out.sustainedSec = Number(s);
  }
  return out;
}

function renderMaintWindowTargetOptions(){
  const scopeEl = $('#mw-scope'), sel = $('#mw-scope-id');
  if(!scopeEl || !sel) return;
  const scope = scopeEl.value;
  const prevValue = sel.value;
  if(scope === 'device'){
    const all = [...SERVERS, ...DBS, ...NETS, ...FACS];
    sel.innerHTML = all.map(d=>`<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join('') || '<option value="">(등록된 장비 없음)</option>';
  } else {
    const groups = [...new Set([...SERVERS,...DBS,...NETS,...FACS].map(e=>e.group).filter(Boolean))].sort();
    sel.innerHTML = groups.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('') || '<option value="">(등록된 그룹 없음)</option>';
  }
  // Rebuilding <select> options resets the selection -- restore whatever
  // was picked before if it's still a valid option, so a periodic refresh
  // (new device/group appearing while this view is open) doesn't silently
  // swap out from under someone mid-form the way it would for #mw-scope
  // itself changing (that's a deliberate reset, this call is not).
  if([...sel.options].some(o=>o.value===prevValue)) sel.value = prevValue;
}

function openDrawerFor(id){
  const s = SERVERS.find(x=>x.id===id);
  const d = DBS.find(x=>x.id===id);
  const n = NETS.find(x=>x.id===id);
  const f = FACS.find(x=>x.id===id);
  const entity = s||d||n||f;
  if(!entity) return;
  if(id !== openDrawerId && ifaceModalState && ifaceModalState.deviceId !== id) closeIfaceModal();
  openDrawerId = id;
  const catLabel = s?'서버 (SMS)':d?'데이터베이스 (DBMS)':n?'네트워크 (NMS)':'전산실 설비 (FMS)';
  const cat = s?'server':d?'db':n?'net':'fac';
  const maint = entity.maintenance || {enabled:false};
  const maintBtn = $('#drawerMaintBtn');
  // 1-4: /api/devices/<id>/maintenance is OPERATOR+ on the server -- a
  // VIEWER would just get a 403, so don't even show the button.
  maintBtn.style.display = CURRENT_ROLE_RANK >= 1 ? '' : 'none';
  maintBtn.textContent = maint.enabled ? '유지보수 해제' : '유지보수 시작';
  maintBtn.style.color = maint.enabled ? 'var(--warn)' : '';
  maintBtn.style.borderColor = maint.enabled ? 'rgba(255,176,32,.4)' : '';
  maintBtn.onclick = async ()=>{
    const enabling = !maint.enabled;
    await apiFetch(`/api/devices/${id}/maintenance`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled: enabling, start: enabling ? Date.now() : null, end: null, reason: enabling ? '수동 설정' : null}),
    });
    await afterDeviceChange();
  };
  // 수정/삭제는 "장비 등록" 화면의 등록된 장비 목록 표가 삭제되면서 이쪽
  // (상세 드로어)으로 옮겨왔다 -- 사용자가 직접 등록한 장비(origin==='user')
  // 에만 의미가 있는 동작인 데다, 1-4부터는 OPERATOR+ 권한도 필요하다
  // (/api/devices/<id> PUT·DELETE가 서버에서 OPERATOR 이상을 요구함).
  const editBtn = $('#drawerEditBtn');
  const delBtn = $('#drawerDelBtn');
  const isUserOrigin = entity.origin === 'user' && CURRENT_ROLE_RANK >= 1;
  editBtn.style.display = isUserOrigin ? '' : 'none';
  delBtn.style.display = isUserOrigin ? '' : 'none';
  if(isUserOrigin){
    editBtn.onclick = ()=>{
      // 수정 폼은 "장비 등록" 화면(#view-register) 안에 모달로 떠 있는 구조라,
      // 그 화면이 비활성 상태(display:none)인 동안에는 열어봐야 화면에 전혀
      // 보이지 않는다 -- 드로어는 어느 화면에서든 열릴 수 있으므로, 먼저 그
      // 화면으로 전환한 뒤에 수정 모달을 띄운다.
      closeDrawer();
      switchView('register');
      window.startEditDevice(entity, cat);
    };
    delBtn.onclick = async ()=>{
      const ok = await showConfirm(`"${entity.name}" 삭제할까요?\n등록된 설정과 이력이 함께 삭제됩니다.`, {title:'장비 삭제', okText:'삭제'});
      if(!ok) return;
      await unregisterDevice(id);
      closeDrawer();
      afterDeviceChange();
    };
  }
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
  if(entity.mode==='ping' || entity.mode==='snmp') drawPingDevice(entity, catLabel);
  else if(entity.mode==='agent' && !entity.online) drawAgentPending(entity, catLabel);
  else if(s) drawServer(s);
  else drawPingDevice(entity, catLabel);
  $('#drawerBody').insertAdjacentHTML('beforeend', collectionStateBlock(entity) + agentInfoBlock(entity));
  $('#overlay').classList.add('show'); $('#drawer').classList.add('show');
}
function closeDrawer(){
  openDrawerId = null;
  closeIfaceModal();
  $('#overlay').classList.remove('show'); $('#drawer').classList.remove('show');
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
}
function refreshOpenDrawer(){
  if(!openDrawerId) return;
  if(!findEntity(openDrawerId)){ closeDrawer(); return; }
  // openDrawerFor rebuilds #drawerBody's innerHTML wholesale every ~2.2s
  // while the drawer stays open (same live-refresh poll that updates the
  // rest of the dashboard) -- without this, that reset the scroll position
  // to the top every single cycle, so scrolling down to read anything
  // (an interface list, Top 프로세스, ...) got yanked back up moments later.
  const body = $('#drawerBody');
  const scrollTop = body ? body.scrollTop : 0;
  openDrawerFor(openDrawerId);
  if(body) $('#drawerBody').scrollTop = scrollTop;
}

    <div class="card"><div class="card-head"><h3>Top 프로세스</h3><span class="sub">CPU 사용률 순</span></div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint)"><span>프로세스</span><span style="display:flex;gap:16px"><span style="width:38px;text-align:right">CPU</span><span style="width:38px;text-align:right">MEM</span></span></div>
        ${(s.procs||[]).slice(0,10).map(p=>`<div style="display:flex;justify-content:space-between;font-size:12px"><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name)}</span><span style="display:flex;gap:16px"><span class="mono" style="color:var(--text-dim);width:38px;text-align:right">${fmt1(p.pct)}%</span><span class="mono" style="color:var(--text-dim);width:38px;text-align:right">${p.memPct!=null?fmt1(p.memPct)+'%':'-'}</span></span></div>`).join('') || '<span style="font-size:12px;color:var(--text-faint)">데이터 없음</span>'}
      </div>
    </div>
    <div class="card"><div class="card-head"><h3>디스크 상세</h3><span class="sub">파티션별 용량</span></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${(s.disks||[]).map(d=>`
          <div>
            <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px"><span class="mono">${escapeHtml(d.mount)}</span><span class="mono" style="color:${levelColor(devLevelOf(s,'disk',d.pct))}">${fmt1(d.used)} / ${fmt1(d.total)} GB (${fmt1(d.pct)}%)</span></div>
            <div class="bar ${devLevelOf(s,'disk',d.pct)}"><i style="width:${d.pct}%"></i></div>
          </div>`).join('') || '<span style="font-size:12px;color:var(--text-faint)">데이터 없음</span>'}

      <div style="display:flex;flex-direction:column;gap:8px">
        ${(s.nics||[]).map(n=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px"><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${escapeHtml(n.name)}</span><span style="display:flex;gap:12px;flex:none"><span class="mono" style="color:var(--info)">↓${fmtMbps(n.inMbps)}</span><span class="mono" style="color:#ff3ec9">↑${fmtMbps(n.outMbps)}</span></span></div>`).join('') || '<span style="font-size:12px;color:var(--text-faint)">데이터 없음</span>'}

      <div style="display:flex;flex-direction:column;gap:8px">
        ${(s.services && s.services.stoppedAutoStart && s.services.stoppedAutoStart.length) ? s.services.stoppedAutoStart.map(sv=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${escapeHtml(sv.name)}</span><span class="pill warn" style="flex:none"><span class="dot"></span>${escapeHtml(sv.status)}</span></div>`).join('')
          : `<span style="font-size:12px;color:var(--text-faint)">${s.services ? '자동 시작 서비스 중 중지된 항목 없음' : '데이터 없음'}</span>`}

function fmtMbps(v){
  v = v||0;
  if(v > 0 && v < 0.01) return '<0.01';
  if(v < 1) return v.toFixed(3);
  return fmt1(v);
}
function drawPingDevice(e, catLabel){
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
  const drawerBodyEl = $('#drawerBody');
  const prevBodyScroll = drawerBodyEl ? drawerBodyEl.scrollTop : 0;
  const prevIfaceEl = document.getElementById('iface-list');
  const prevIfaceScroll = prevIfaceEl ? prevIfaceEl.scrollTop : 0;
  $('#drawerTitle').textContent = e.name;
  $('#drawerRole').textContent = `${catLabel} · ${e.ip||'-'}`;
  const isSnmp = e.mode==='snmp';
  let extraKv = '';
  if(typeof e.cpu === 'number') extraKv += `<div class="kv"><span>CPU (SNMP 실측)</span><b style="color:${levelColor(devLevelOf(e,'cpu',e.cpu))}">${fmt1(e.cpu)}%</b></div>`;
  if(typeof e.mem === 'number') extraKv += `<div class="kv"><span>메모리 (SNMP 실측)</span><b style="color:${levelColor(devLevelOf(e,'mem',e.mem))}">${fmt1(e.mem)}%</b></div>`;
  if(typeof e.uptime === 'number') extraKv += `<div class="kv"><span>Uptime (SNMP 실측)</span><b>${fmt1(e.uptime)}일</b></div>`;
  if(typeof e.battPct === 'number') extraKv += `<div class="kv"><span>배터리 (SNMP 실측)</span><b>${fmt0(e.battPct)}%</b></div>`;
  if(typeof e.portsTotal === 'number') extraKv += `<div class="kv"><span>인터페이스</span><b>${e.portsUp}/${e.portsTotal} Up</b></div>`;
  if(isSnmp && e.sysDescr) extraKv += `<div class="kv" style="grid-column:span 2"><span>장치 정보 (SNMP sysDescr)</span><b style="font-size:11px;font-weight:500;white-space:normal;line-height:1.4">${escapeHtml(e.sysDescr)}</b></div>`;

  const hasCpuMem = isSnmp && e.hist && e.hist.cpu && typeof e.cpu === 'number';
  const cpuMemCard = hasCpuMem ? `
    <div class="card"><div class="card-head"><h3>CPU / 메모리 추이</h3><span class="sub">SNMP 실측 · 최근 60초</span></div>
      <div style="height:140px"><canvas id="drawerChart3"></canvas></div>
    </div>` : '';

  const hasTraffic = isSnmp && e.hist && e.hist.traffic && typeof e.trafficIn === 'number';
  const trafficCard = hasTraffic ? `
    <div class="card"><div class="card-head"><h3>인터페이스 트래픽</h3><span class="sub">SNMP IF-MIB 실측 · Mbps</span></div>
      <div class="kv-grid" style="margin-bottom:12px"><div class="kv"><span>In</span><b>${fmtMbps(e.trafficIn)} Mbps</b></div><div class="kv"><span>Out</span><b>${fmtMbps(e.trafficOut)} Mbps</b></div></div>
      <div style="height:140px"><canvas id="drawerChart2"></canvas></div>
    </div>` : '';

  const ifaces = isSnmp && Array.isArray(e.interfaces) ? e.interfaces : [];
  const ifaceCard = ifaces.length ? `
    <div class="card"><div class="card-head"><h3>인터페이스 목록</h3><span class="sub">클릭하면 트래픽 창이 열립니다 · ${e.portsUp||0}/${ifaces.length} Up</span></div>
      <div id="iface-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        ${ifaces.map(f=>`<div class="iface-row" data-idx="${escapeHtml(f.idx)}" style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;background:${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'var(--accent-soft)':'transparent'};border:1px solid ${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'rgba(124,92,255,.4)':'transparent'}">
          <span class="mono" style="color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px">${escapeHtml(f.name)}</span>
          <span style="display:flex;align-items:center;gap:8px;flex:none">
            ${f.status==='up' ? `<span class="mono" style="font-size:10px;color:var(--text-faint)">${fmtMbps((f.inMbps||0)+(f.outMbps||0))} Mbps</span>` : ''}
            <span class="pill ${f.status==='up'?'good':'neutral'}"><span class="dot"></span>${f.status==='up'?'Up':'Down'}</span>
          </span>
        </div>`).join('')}
      </div>
    </div>` : '';

  $('#drawerBody').innerHTML = `
    <div class="kv-grid">
      <div class="kv"><span>상태</span><b style="color:${levelColor(e.status)}">${statusLabel(e.status)}</b></div>
      <div class="kv"><span>응답시간</span><b>${e.reachable? fmt0(e.latencyMs||0)+'ms' : '응답없음'}</b></div>
      ${extraKv}
    </div>
    <div class="card"><div class="card-head"><h3>응답시간 추이</h3><span class="sub">${isSnmp?'SNMP':'Ping / 포트 확인'} · 최근 60초</span></div>
      <div style="height:160px"><canvas id="drawerChart1"></canvas></div></div>
    ${cpuMemCard}
    ${trafficCard}
    ${ifaceCard}
    <div class="card"><div class="card-head"><h3>안내</h3></div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;margin:0">${isSnmp
        ? 'SNMP로 장치 정보와 응답시간을 실측합니다. 인터페이스·CPU·메모리·배터리 등은 장비가 해당 MIB를 지원할 때만 표시됩니다.'
        : '이 장비는 Ping(또는 포트 확인)으로만 모니터링됩니다. 상세 지표가 필요하면 SNMP로 등록하거나, 해당 PC에 InfraSight 에이전트를 설치해 다시 등록하세요.'}</p>
    </div>
  `;
  $$('.iface-row', $('#drawerBody')).forEach(row=>{
    row.addEventListener('click', ()=>{
      if(ifaceModalState && ifaceModalState.deviceId===e.id && ifaceModalState.idx===row.dataset.idx){
        closeIfaceModal();
      } else {
        openIfaceModal(e.id, row.dataset.idx);
      }
      drawPingDevice(e, catLabel);
    });
  });
  if(drawerBodyEl) drawerBodyEl.scrollTop = prevBodyScroll;
  const newIfaceEl = document.getElementById('iface-list');
  if(newIfaceEl) newIfaceEl.scrollTop = prevIfaceScroll;
  charts.drawer1 = lineChart($('#drawerChart1'), Array(24).fill(''), [{label:'지연시간(ms)', data:(e.hist&&e.hist.latency)||[], color:'#3ecbff', fill:true}], {showX:false});
  if(hasCpuMem){
    const series = [{label:'CPU', data:e.hist.cpu.map(fmt1), color:'#7c5cff'}];
    if(e.hist.mem) series.push({label:'MEM', data:e.hist.mem.map(fmt1), color:'#00e6a8'});
    charts.drawer3 = lineChart($('#drawerChart3'), Array(24).fill(''), series, {showX:false, max:100});
  }
  if(hasTraffic){
    charts.drawer2 = lineChart($('#drawerChart2'), Array(24).fill(''), [{label:'트래픽(Mbps)', data:e.hist.traffic, color:'#ff3ec9', fill:true}], {showX:false});
  }
}

/* ================= view routing ================= */
const VIEWS = {
  overview: {skeleton:renderOverviewSkeleton, render:renderOverview, title:'전체 현황', sub:'서버 · DB · 네트워크 · 설비 통합 모니터링 개요'},
  topology: {skeleton:renderTopologySkeleton, render:refreshTopologyView, title:'토플로지 맵', sub:'인프라 연결 구조 및 실시간 트래픽'},
  servers: {skeleton:renderServersSkeleton, render:renderServers, title:'서버 관리 (SMS)', sub:'CPU · 메모리 · 디스크 · 프로세스 모니터링'},
  database: {skeleton:renderDatabaseSkeleton, render:renderDatabase, title:'데이터베이스 관리 (DBMS)', sub:'RDBMS / NoSQL 성능 및 세션 모니터링'},
  network: {skeleton:renderNetworkSkeleton, render:renderNetwork, title:'네트워크 관리 (NMS)', sub:'스위치 · 라우터 트래픽 및 포트 상태'},
  flowanalysis: {skeleton:renderFlowSkeleton, render:renderFlow, title:'트래픽 분석 (NetFlow/sFlow)', sub:'흐름(flow) 기반 대역폭·상위 트래픽·프로토콜 분석'},
  facility: {skeleton:renderFacilitySkeleton, render:renderFacility, title:'전산실 설비 관리 (FMS)', sub:'UPS · 항온항습기 · 전원 설비 모니터링'},
  incidents: {skeleton:renderIncidentsSkeleton, render:renderIncidents, title:'이벤트 / 장애 관리', sub:'전체 영역 통합 이벤트 로그 및 조치 이력'},
  register: {skeleton:renderRegisterSkeleton, render:renderRegister, title:'장비 등록', sub:'신규 서버 · DB · 네트워크 · 설비 등록 및 관리'},
  sla: {skeleton:renderSlaSkeleton, render:renderSla, title:'가동률 / SLA', sub:'장비·그룹별 가동률, 장애 통계, MTTR/MTBF'},
  security: {skeleton:renderSecuritySkeleton, render:renderSecurity, title:'보안', sub:'2단계 인증(2FA)과 API 토큰 관리'},
  channels: {skeleton:renderChannelsSkeleton, render:renderChannels, title:'알림 채널', sub:'이메일·Slack·Teams·카카오톡·SMS 알림 채널 설정'},
  publicstatus: {skeleton:renderPublicStatusSkeleton, render:renderPublicStatus, title:'공개 상태 페이지', sub:'외부에 공개할 서비스와 장애/복구 공지 관리'},
  users: {skeleton:renderUsersSkeleton, render:renderUsers, title:'사용자 관리', sub:'로그인 계정 및 권한 관리 (ADMIN)'},
};
let currentView = 'overview';
function initSkeletons(){ Object.values(VIEWS).forEach(v=>v.skeleton()); }
function switchView(name){
  if(!VIEWS[name]) return;
  if(currentView==='register' && name!=='register'){
    if(editingDeviceId && !confirm('수정을 취소할까요?')) return;
    if(typeof window.exitRegisterEditMode==='function') window.exitRegisterEditMode();
  }
  // Each search box lives in a skeleton built once at startup (see
  // initSkeletons()) and never rebuilt, so a leftover search term from a
  // previous visit would otherwise sit in the input indefinitely. Clearing
  // it on the way IN (not on every render() -- that also fires on each
  // live-data poll while the view is open, which would wipe out whatever
  // the user is actively typing) means each fresh visit starts blank.
  const SEARCH_INPUT_ID = {servers:'srv-search', database:'db-search', network:'net-search', incidents:'inc-search'};
  if(SEARCH_INPUT_ID[name] && currentView!==name){
    const s = $('#'+SEARCH_INPUT_ID[name]); if(s) s.value = '';
  }
  currentView = name;
  $$('.view').forEach(v=> v.classList.toggle('active', v.dataset.view===name));
  $$('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  expandNavGroupFor(name);
  $('#pageTitle').textContent = VIEWS[name].title;
  $('#pageSub').textContent = VIEWS[name].sub;
  VIEWS[name].render();
  document.getElementById('sidebar').classList.remove('open');
  $('#sidebarScrim').classList.remove('show');
}
$$('.nav-item').forEach(btn=> btn.addEventListener('click', ()=> switchView(btn.dataset.view)));

/* ================= collapsible nav groups ================= */
function setNavGroupCollapsed(label, collapsed){
  label.classList.toggle('collapsed', collapsed);
  const wrap = document.getElementById(label.dataset.group);
  if(wrap) wrap.classList.toggle('collapsed', collapsed);
}
$$('.nav-group-label').forEach(label=>{
  label.addEventListener('click', ()=> setNavGroupCollapsed(label, !label.classList.contains('collapsed')));
});
function expandNavGroupFor(viewName){
  const btn = $(`.nav-item[data-view="${viewName}"]`);
  const wrap = btn && btn.closest('.nav-group-wrap');
  if(!wrap) return;
  const label = $(`.nav-group-label[data-group="${wrap.id}"]`);
  if(label) setNavGroupCollapsed(label, false);
}

/* ================= clock ================= */
function tickClock(){
  const now = new Date();
  $('#clockTime').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  $('#clockDate').textContent = `${now.getFullYear()}.${pad2(now.getMonth()+1)}.${pad2(now.getDate())} ${['일','월','화','수','목','금','토'][now.getDay()]}`;
}

/* ================= drawer / sidebar wiring ================= */
$('#drawerClose').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
$('#bellBtn').addEventListener('click', ()=> switchView('incidents'));
$('#hamburgerBtn').addEventListener('click', ()=>{
  $('#sidebar').classList.toggle('open'); $('#sidebarScrim').classList.toggle('show');
});
$('#sidebarScrim').addEventListener('click', ()=>{ $('#sidebar').classList.remove('open'); $('#sidebarScrim').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/auth/logout', {method:'POST'});
  location.reload();
});
/* ================= main loop ================= */
initSkeletons();
tickClock();
setInterval(tickClock, 1000);
(async function boot(){
  await ensureAuthed();
  await loadGlobalThresholds();
  await syncState();
  refreshBadges();
  switchView('overview');
  async function pollTick(){
    const ok = await syncState();
    if(ok){
      refreshBadges();
      VIEWS[currentView].render();
      refreshOpenDrawer();
      renderIfaceModal();
    }
  }
  setInterval(pollTick, 2200);
  // A background/inactive tab gets its setInterval throttled by the browser
  // (can fall to roughly once a minute) -- without this, a device registered
  // from another tab only shows up here after a manual refresh, since the
  // poll that would've picked it up may not fire again for a while. Forcing
  // one fresh sync the moment this tab becomes visible again closes that gap.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') pollTick();
  });
})();

})();
</script>
