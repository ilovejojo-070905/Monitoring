    const errEl = $('#scan-error');
    const resultsEl = $('#scan-results');
    errEl.textContent = '';
    if(!range){ errEl.textContent = '스캔할 IP 대역을 입력해주세요'; return; }
    const btn = $('#scan-start-btn');
    btn.disabled = true; btn.textContent = '스캔 중...';
    resultsEl.innerHTML = `<div class="empty-note">스캔 중입니다 (대역이 넓으면 몇 초 걸릴 수 있어요)...</div>`;
    try{
      const r = await apiFetch('/api/discovery/scan', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({range}),
      });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || '스캔에 실패했습니다');
      if(!j.results.length){
        resultsEl.innerHTML = `<div class="empty-note">응답하는 장비를 찾지 못했습니다.</div>`;
        return;
      }
      resultsEl.innerHTML = `
        <div class="table-wrap"><table class="data reg-device-table">
          <thead><tr><th>IP</th><th>호스트명</th><th>응답시간</th><th></th></tr></thead>
          <tbody>
            ${j.results.map(d=>`
              <tr>
                <td class="mono">${escapeHtml(d.ip)}</td>
                <td>${escapeHtml(d.hostname||'-')}</td>
                <td class="mono">${typeof d.latencyMs==='number' ? d.latencyMs+' ms' : '-'}</td>
                <td>${d.alreadyRegistered
                  ? `<span class="pill" style="font-size:11px">이미 등록됨</span>`
                  : `<button type="button" class="btn" data-fill-ip="${escapeHtml(d.ip)}" data-fill-name="${escapeHtml(d.hostname||d.ip)}">등록 폼에 채우기</button>`}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:6px">${j.results.length}대 발견</div>
      `;
      $$('#scan-results [data-fill-ip]').forEach(b=> b.addEventListener('click', ()=>{
        exitEditMode();
        $('#f-name').value = b.dataset.fillName;
        $('#f-ip').value = b.dataset.fillIp;
        regMode = 'ping';
        $$('#reg-mode-chips .chip-btn').forEach(x=> x.classList.toggle('active', x.dataset.mode==='ping'));
        updateFormVisibility();
        $('#reg-form-card').scrollIntoView({behavior:'smooth', block:'start'});
        $('#f-name').focus();
      }));
    }catch(err){
      errEl.textContent = err.message;
      resultsEl.innerHTML = '';
    }finally{
      btn.disabled = false; btn.textContent = '스캔 시작';
    }
  });

  $$('.card-head.collapsible').forEach(head=>{
    head.addEventListener('click', ()=>{
      const wrap = document.getElementById(head.dataset.collapse);
      const collapsed = !head.classList.contains('collapsed');
      head.classList.toggle('collapsed', collapsed);
      if(wrap) wrap.classList.toggle('collapsed', collapsed);
    });
  });

  function exitEditMode(){
    editingDeviceId = null;
    $('#reg-form-title').textContent = '새 장비 등록';
    $('#reg-form-sub').textContent = 'Agent는 실측 전체 지표, Ping은 도달성, SNMP는 장치 정보와 인터페이스 트래픽까지 실측합니다';
    $('#edit-mode-banner').style.display = 'none';
    $('#reg-cat-chips').style.display = '';
    $('#reg-mode-chips').style.display = '';
    $('#reg-submit-btn').textContent = '장비 등록';
    $('#f-snmp-community').placeholder = 'public';
    $('#reg-form').reset();
    updateFormVisibility();
    markSnmpUntested();
    $('#reg-form-card').classList.remove('modal-mode');
    $('#reg-edit-overlay').classList.remove('show');
    // Also the reset target for simply leaving the 등록 screen after a
    // successful registration -- without this, the "설치 파일 다운로드"
    // box from the last device you registered just sits there showing
    // (and re-showing) every time you come back, even for an unrelated
    // later visit.
    $('#agent-command-box').style.display = 'none';
  }
  $('#edit-cancel-btn').addEventListener('click', exitEditMode);
  $('#reg-edit-overlay').addEventListener('click', exitEditMode);
  window.exitRegisterEditMode = exitEditMode;
  window.startEditDevice = function(entity, cat){
    editingDeviceId = entity.id;
    regCategory = cat;
    regMode = entity.mode;
    $$('#reg-cat-chips .chip-btn').forEach(x=> x.classList.toggle('active', x.dataset.cat===cat));
    updateFormVisibility();
    $('#reg-cat-chips').style.display = 'none';
    $('#reg-mode-chips').style.display = 'none';
    $('#reg-form-title').textContent = '장비 수정';
    $('#reg-form-sub').textContent = `"${entity.name}" 정보를 수정합니다`;
    $('#edit-mode-name').textContent = entity.name;
    $('#edit-mode-banner').style.display = 'flex';
    $('#reg-submit-btn').textContent = '수정 완료';
    $('#f-name').value = entity.name || '';
    $('#f-ip').value = entity.ip || '';
    $('#f-group').value = entity.group || '';
    if(cat==='server'){ $('#f-os').value = entity.os||'linux'; $('#f-role-server').value = entity.role||''; }
    else if(cat==='db'){ $('#f-engine').value = entity.engine||'Oracle'; $('#f-role-db').value = entity.role||''; }
    else if(cat==='net'){ $('#f-nettype').value = entity.type||'공유기'; $('#f-role-net').value = entity.role||''; }
    else if(cat==='fac'){ $('#f-factype').value = entity.type||'UPS'; $('#f-role-fac').value = entity.role||''; }
    if(entity.mode==='snmp'){
      $('#f-snmp-community').value = '';
      $('#f-snmp-community').placeholder = '변경하려면 입력 (비워두면 기존 값 유지)';
      $('#f-snmp-version').value = entity.snmpVersion || 'v2c';
      $('#f-snmp-port').value = entity.snmpPort || 161;
      // v3 username/protocols/passwords are credentials -- like the community
      // string above, they're never sent back to the client to prefill, so
      // every v3 field starts blank here. Unlike community there's no
      // sensible non-secret default to fall back to if left blank, so the
      // security level defaults to the most-common case (authPriv) rather
      // than implying "no auth" just because nothing was typed.
      $('#f-snmp-v3-username').value = '';
      $('#f-snmp-v3-username').placeholder = '변경하려면 입력 (비워두면 기존 값 유지)';
      $('#f-snmp-v3-seclevel').value = 'authPriv';
      $('#f-snmp-v3-authpw').value = '';
      $('#f-snmp-v3-privpw').value = '';
    }
    updateSnmpFieldVisibility();
    markSnmpUntested();
    $('#agent-command-box').style.display = 'none';
    $('#reg-form-card').classList.add('modal-mode');
    $('#reg-edit-overlay').classList.add('show');
  };

  $('#reg-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = $('#reg-error');
    errEl.textContent='';
    const effMode = regCategory==='server' ? regMode : (regMode==='agent' ? 'ping' : regMode);
    const name = $('#f-name').value.trim();
    const ip = $('#f-ip').value.trim();
    if(!name){ errEl.textContent='장비명을 입력하세요'; return; }
    if((effMode==='ping'||effMode==='snmp') && !ip){ errEl.textContent=(effMode==='snmp'?'SNMP':'Ping')+' 모니터링은 IP 주소가 필요합니다'; return; }
    let fields = {};
    const groupVal = $('#f-group').value.trim();
    if(groupVal) fields.group = groupVal;
    if(regCategory==='server'){ fields.os=$('#f-os').value; fields.role=$('#f-role-server').value.trim(); }
    else if(regCategory==='db'){ fields.engine=$('#f-engine').value; fields.role=$('#f-role-db').value.trim(); }
    else if(regCategory==='net'){ fields.type=$('#f-nettype').value; fields.role=$('#f-role-net').value.trim(); }
    else if(regCategory==='fac'){ fields.type=$('#f-factype').value; fields.role=$('#f-role-fac').value.trim(); }
    if(effMode==='snmp'){
      if(!editingDeviceId && !snmpTestPassed){
        errEl.textContent = 'SNMP 연결 테스트를 먼저 통과해야 등록할 수 있습니다';
        return;
      }
      const snmpVersion = $('#f-snmp-version').value;
      fields.snmpVersion = snmpVersion;
      fields.snmpPort = parseInt($('#f-snmp-port').value)||161;
      if(snmpVersion === 'v3'){
        const usernameInput = $('#f-snmp-v3-username').value.trim();
        if(!editingDeviceId && !usernameInput){ errEl.textContent = 'SNMPv3 사용자명을 입력하세요'; return; }
        // Editing: blank means "keep the existing secret" (it's never sent
        // back to the client to prefill, so blank is the only way to say
        // that) -- same pattern the community string already used below.
        if(usernameInput || !editingDeviceId) fields.snmpv3Username = usernameInput;
        const lvl = $('#f-snmp-v3-seclevel').value;
        if(lvl==='authNoPriv' || lvl==='authPriv'){
          const authPwInput = $('#f-snmp-v3-authpw').value;
          if(authPwInput || !editingDeviceId){
            if(!authPwInput){ errEl.textContent = '인증 비밀번호를 입력하세요'; return; }
            if(authPwInput.length < 8){ errEl.textContent = '인증 비밀번호는 8자 이상이어야 합니다'; return; }
            fields.snmpv3AuthProtocol = $('#f-snmp-v3-authproto').value;
            fields.snmpv3AuthPassword = authPwInput;
          }
        }
        if(lvl==='authPriv'){
          const privPwInput = $('#f-snmp-v3-privpw').value;
          if(privPwInput || !editingDeviceId){
            if(!privPwInput){ errEl.textContent = '개인정보 보호 비밀번호를 입력하세요'; return; }
            if(privPwInput.length < 8){ errEl.textContent = '개인정보 보호 비밀번호는 8자 이상이어야 합니다'; return; }
            fields.snmpv3PrivProtocol = $('#f-snmp-v3-privproto').value;
            fields.snmpv3PrivPassword = privPwInput;
          }
        }
      } else {
        const communityInput = $('#f-snmp-community').value.trim();
        // Adding: blank falls back to the common SNMP default (v3 has no
        // equivalent insecure default, which is why it's required above).
        if(communityInput || !editingDeviceId) fields.community = communityInput || 'public';
      }
    }

    // Prevents an impatient/accidental double-click on 장비 등록 from firing
    // two separate registration requests before the first one's response
    // (and the resulting form-reset) ever lands -- exactly how a device could
    // previously end up registered twice under the same name.
    const submitBtn = $('#reg-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = editingDeviceId ? '수정 중...' : '등록 중...';
    try{
      if(editingDeviceId){
        await updateDevice(editingDeviceId, name, ip, fields);
        await afterDeviceChange();
        exitEditMode();
      } else {
        const result = await registerDevice(regCategory, effMode, name, ip, fields);
        await afterDeviceChange();
        if(result.agentCommand){
          $('#agent-command-text').textContent = result.agentCommand;
          if(result.agentDownloadUrl) $('#agent-download-link').href = result.agentDownloadUrl;
          if(result.agentInstallerUrl) $('#agent-installer-link').href = result.agentInstallerUrl;
          $('#agent-command-box').style.display = '';
        } else {
          e.target.reset();
          $('#agent-command-box').style.display = 'none';
          updateFormVisibility();
          markSnmpUntested();
        }
      }
    }catch(err){
      const msg = err.message || (editingDeviceId ? '수정에 실패했습니다' : '등록에 실패했습니다');
      errEl.textContent = msg;
      alert(msg);
    }finally{
      // Not a blind re-enable: a freshly-submitted/reset SNMP form needs a
      // new connection test before the NEXT registration too, so this has
      // to go through the same gate rather than just flipping disabled back
      // to false regardless of state.
      updateSnmpSubmitGate();
      submitBtn.textContent = editingDeviceId ? '수정 완료' : '장비 등록';
    }
  });
}
function renderRegister(){
  // The old "등록된 장비 목록" tables (서버/DB/네트워크/설비, with 수정/삭제
  // buttons) were removed from this page -- edit/delete now lives in the
  // device detail drawer instead (see openDrawerFor). This function now only
  // keeps the group-name autocomplete (#f-group-list) on the registration
  // form up to date with whatever groups already exist across all devices.
  const groupList = $('#f-group-list');
  if(!groupList) return;
  const all = [...SERVERS, ...DBS, ...NETS, ...FACS];
  const distinctGroups = [...new Set(all.map(e=>e.group).filter(Boolean))].sort();
  groupList.innerHTML = distinctGroups.map(g=>`<option value="${escapeHtml(g)}">`).join('');
}

async function renderUsers(){
  const r = await apiFetch('/api/users');
  if(!r.ok) return;

        ${locked ? `<button type="button" class="btn" data-unlock="${u.id}">잠금 해제</button>` : ''}
        ${u.username!==CURRENT_USER ? `<button type="button" class="btn" data-deluser="${u.id}">삭제</button>` : ''}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="6"><div class="empty-note">계정이 없습니다</div></td></tr>`;
  $$('#user-tbody [data-deluser]').forEach(b=> b.addEventListener('click', async ()=>{

    const r = await apiFetch('/api/users/'+b.dataset.deluser, {method:'DELETE'});

  $$('#user-tbody [data-unlock]').forEach(b=> b.addEventListener('click', async ()=>{
    await apiFetch('/api/users/'+b.dataset.unlock+'/unlock', {method:'POST'});

    openUserEditModal(b.dataset.edituser, b.dataset.username, b.dataset.role);

}

/* ================= user edit modal ================= */
function openUserEditModal(userId, username, role){
  $('#userEditTitle').textContent = `"${username}" 수정`;
  $('#ue-role').value = role;
  $('#ue-password').value = '';
  $('#userEditError').textContent = '';
  $('#userEditOverlay').classList.add('show');
  $('#userEditModal').classList.add('show');
  function close(){
    $('#userEditOverlay').classList.remove('show');
    $('#userEditModal').classList.remove('show');
    $('#userEditOkBtn').removeEventListener('click', onSave);
    $('#userEditCancelBtn').removeEventListener('click', close);
    $('#userEditOverlay').removeEventListener('click', close);
  }
  async function onSave(){
    const newRole = $('#ue-role').value;
    const newPassword = $('#ue-password').value;
    if(newPassword && newPassword.length < 8){
      $('#userEditError').textContent = '새 비밀번호는 8자 이상이어야 합니다';
      return;
    }
    const body = {};
    if(newRole !== role) body.role = newRole;
    if(newPassword) body.password = newPassword;
    if(!Object.keys(body).length){ close(); return; }
    const r = await apiFetch('/api/users/'+userId, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ $('#userEditError').textContent = j.error||'수정 실패'; return; }
    close();
    renderUsers();
  }
  $('#userEditOkBtn').addEventListener('click', onSave);
  $('#userEditCancelBtn').addEventListener('click', close);
  $('#userEditOverlay').addEventListener('click', close);
}

/* ================= DRAWER ================= */
let openDrawerId = null;
function collectionStateLabel(cs){ return {good:'정상', warn:'주의', crit:'장애', nodata:'미수집', unknown:'알 수 없음'}[cs] || '알 수 없음'; }
function collectionStatePillClass(cs){ return {good:'good', warn:'warn', crit:'crit', nodata:'neutral', unknown:'info'}[cs] || 'neutral'; }
function fmtWhen(ms){ return ms ? new Date(ms).toLocaleString('ko-KR') : '-'; }
function collectionStateBlock(e){
  const cs = e.collectionState || 'nodata';
  return `
    <div class="card">
      <div class="card-head"><h3>수집 상태</h3><span class="sub">등록/수집 관점의 상태 (위 리소스 상태와 별개)</span></div>

    </div>`;
}
function agentInfoBlock(e){

  return `
    <div class="card">
      <div class="card-head"><h3>Agent 정보</h3><span class="sub">에이전트 프로세스 자체 보고 값</span></div>

      </div>

function openDrawerFor(id){
  const s = SERVERS.find(x=>x.id===id);
  const d = DBS.find(x=>x.id===id);
  const n = NETS.find(x=>x.id===id);
  const f = FACS.find(x=>x.id===id);
  const entity = s||d||n||f;
  if(!entity) return;
  if(id !== openDrawerId && ifaceModalState && ifaceModalState.deviceId !== id) closeIfaceModal();
  openDrawerId = id;
  const catLabel = s?'서버 (SMS)':d?'데이터베이스 (DBMS)':n?'네트워크 (NMS)':'전산실 설비 (FMS)';
  const cat = s?'server':d?'db':n?'net':'fac';
  const maint = entity.maintenance || {enabled:false};
  const maintBtn = $('#drawerMaintBtn');
  maintBtn.textContent = maint.enabled ? '유지보수 해제' : '유지보수 시작';
  maintBtn.style.color = maint.enabled ? 'var(--warn)' : '';
  maintBtn.style.borderColor = maint.enabled ? 'rgba(255,176,32,.4)' : '';
  maintBtn.onclick = async ()=>{
    const enabling = !maint.enabled;
    await apiFetch(`/api/devices/${id}/maintenance`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled: enabling, start: enabling ? Date.now() : null, end: null, reason: enabling ? '수동 설정' : null}),
    });
    await afterDeviceChange();
  };
  // 수정/삭제는 "장비 등록" 화면의 등록된 장비 목록 표가 삭제되면서 이쪽
  // (상세 드로어)으로 옮겨왔다 -- 사용자가 직접 등록한 장비(origin==='user')
  // 에만 의미가 있는 동작이라 그 외에는 버튼 자체를 숨긴다.
  const editBtn = $('#drawerEditBtn');
  const delBtn = $('#drawerDelBtn');
  const isUserOrigin = entity.origin === 'user';
  editBtn.style.display = isUserOrigin ? '' : 'none';
  delBtn.style.display = isUserOrigin ? '' : 'none';
  if(isUserOrigin){
    editBtn.onclick = ()=>{
      // 수정 폼은 "장비 등록" 화면(#view-register) 안에 모달로 떠 있는 구조라,
      // 그 화면이 비활성 상태(display:none)인 동안에는 열어봐야 화면에 전혀
      // 보이지 않는다 -- 드로어는 어느 화면에서든 열릴 수 있으므로, 먼저 그
      // 화면으로 전환한 뒤에 수정 모달을 띄운다.
      closeDrawer();
      switchView('register');
      window.startEditDevice(entity, cat);
    };
    delBtn.onclick = async ()=>{
      const ok = await showConfirm(`"${entity.name}" 삭제할까요?\n등록된 설정과 이력이 함께 삭제됩니다.`, {title:'장비 삭제', okText:'삭제'});
      if(!ok) return;
      await unregisterDevice(id);
      closeDrawer();
      afterDeviceChange();
    };
  }
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
  if(entity.mode==='ping' || entity.mode==='snmp') drawPingDevice(entity, catLabel);
  else if(entity.mode==='agent' && !entity.online) drawAgentPending(entity, catLabel);
  else if(s) drawServer(s);
  else drawPingDevice(entity, catLabel);
  $('#drawerBody').insertAdjacentHTML('beforeend', collectionStateBlock(entity) + agentInfoBlock(entity));
  $('#overlay').classList.add('show'); $('#drawer').classList.add('show');
}
function closeDrawer(){
  openDrawerId = null;
  closeIfaceModal();
  $('#overlay').classList.remove('show'); $('#drawer').classList.remove('show');
  destroyChart('drawer1'); destroyChart('drawer2'); destroyChart('drawer3'); destroyChart('drawer4');
}
function refreshOpenDrawer(){
  if(!openDrawerId) return;
  if(!findEntity(openDrawerId)){ closeDrawer(); return; }
  // openDrawerFor rebuilds #drawerBody's innerHTML wholesale every ~2.2s
  // while the drawer stays open (same live-refresh poll that updates the
  // rest of the dashboard) -- without this, that reset the scroll position
  // to the top every single cycle, so scrolling down to read anything
  // (an interface list, Top 프로세스, ...) got yanked back up moments later.
  const body = $('#drawerBody');
  const scrollTop = body ? body.scrollTop : 0;
  openDrawerFor(openDrawerId);
  if(body) $('#drawerBody').scrollTop = scrollTop;
}

  if(typeof e.uptime === 'number') extraKv += `<div class="kv"><span>Uptime (SNMP 실측)</span><b>${fmt1(e.uptime)}일</b></div>`;

  if(isSnmp && e.sysDescr) extraKv += `<div class="kv" style="grid-column:span 2"><span>장치 정보 (SNMP sysDescr)</span><b style="font-size:11px;font-weight:500;white-space:normal;line-height:1.4">${escapeHtml(e.sysDescr)}</b></div>`;

  const hasCpuMem = isSnmp && e.hist && e.hist.cpu && typeof e.cpu === 'number';
  const cpuMemCard = hasCpuMem ? `
    <div class="card"><div class="card-head"><h3>CPU / 메모리 추이</h3><span class="sub">SNMP 실측 · 최근 60초</span></div>
      <div style="height:140px"><canvas id="drawerChart3"></canvas></div>

  const hasTraffic = isSnmp && e.hist && e.hist.traffic && typeof e.trafficIn === 'number';
  const trafficCard = hasTraffic ? `
    <div class="card"><div class="card-head"><h3>인터페이스 트래픽</h3><span class="sub">SNMP IF-MIB 실측 · Mbps</span></div>
      <div class="kv-grid" style="margin-bottom:12px"><div class="kv"><span>In</span><b>${fmtMbps(e.trafficIn)} Mbps</b></div><div class="kv"><span>Out</span><b>${fmtMbps(e.trafficOut)} Mbps</b></div></div>
      <div style="height:140px"><canvas id="drawerChart2"></canvas></div>
    </div>` : '';

  const ifaces = isSnmp && Array.isArray(e.interfaces) ? e.interfaces : [];
  const ifaceCard = ifaces.length ? `
    <div class="card"><div class="card-head"><h3>인터페이스 목록</h3><span class="sub">클릭하면 트래픽 창이 열립니다 · ${e.portsUp||0}/${ifaces.length} Up</span></div>
      <div id="iface-list" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        ${ifaces.map(f=>`<div class="iface-row" data-idx="${escapeHtml(f.idx)}" style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;background:${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'var(--accent-soft)':'transparent'};border:1px solid ${ifaceModalState&&ifaceModalState.deviceId===e.id&&ifaceModalState.idx===f.idx?'rgba(124,92,255,.4)':'transparent'}">
          <span class="mono" style="color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px">${escapeHtml(f.name)}</span>
          <span style="display:flex;align-items:center;gap:8px;flex:none">
            ${f.status==='up' ? `<span class="mono" style="font-size:10px;color:var(--text-faint)">${fmtMbps((f.inMbps||0)+(f.outMbps||0))} Mbps</span>` : ''}
            <span class="pill ${f.status==='up'?'good':'neutral'}"><span class="dot"></span>${f.status==='up'?'Up':'Down'}</span>
          </span>
        </div>`).join('')}
      </div>
    </div>` : '';

  $('#drawerBody').innerHTML = `
    <div class="kv-grid">
      <div class="kv"><span>상태</span><b style="color:${levelColor(e.status)}">${statusLabel(e.status)}</b></div>
      <div class="kv"><span>응답시간</span><b>${e.reachable? fmt0(e.latencyMs||0)+'ms' : '응답없음'}</b></div>
      ${extraKv}
    </div>
    <div class="card"><div class="card-head"><h3>응답시간 추이</h3><span class="sub">${isSnmp?'SNMP':'Ping / 포트 확인'} · 최근 60초</span></div>
      <div style="height:160px"><canvas id="drawerChart1"></canvas></div></div>
    ${cpuMemCard}
    ${trafficCard}
    ${ifaceCard}
    <div class="card"><div class="card-head"><h3>안내</h3></div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;margin:0">${isSnmp
        ? 'SNMP로 장치 정보와 응답시간을 실측합니다. 인터페이스·CPU·메모리·배터리 등은 장비가 해당 MIB를 지원할 때만 표시됩니다.'
        : '이 장비는 Ping(또는 포트 확인)으로만 모니터링됩니다. 상세 지표가 필요하면 SNMP로 등록하거나, 해당 PC에 InfraSight 에이전트를 설치해 다시 등록하세요.'}</p>
    </div>
  `;
  $$('.iface-row', $('#drawerBody')).forEach(row=>{
    row.addEventListener('click', ()=>{
      if(ifaceModalState && ifaceModalState.deviceId===e.id && ifaceModalState.idx===row.dataset.idx){
        closeIfaceModal();
      } else {
        openIfaceModal(e.id, row.dataset.idx);
      }
      drawPingDevice(e, catLabel);
    });
  });
  if(drawerBodyEl) drawerBodyEl.scrollTop = prevBodyScroll;
  const newIfaceEl = document.getElementById('iface-list');
  if(newIfaceEl) newIfaceEl.scrollTop = prevIfaceScroll;
  charts.drawer1 = lineChart($('#drawerChart1'), Array(24).fill(''), [{label:'지연시간(ms)', data:(e.hist&&e.hist.latency)||[], color:'#3ecbff', fill:true}], {showX:false});
  if(hasCpuMem){
    const series = [{label:'CPU', data:e.hist.cpu.map(fmt1), color:'#7c5cff'}];
    if(e.hist.mem) series.push({label:'MEM', data:e.hist.mem.map(fmt1), color:'#00e6a8'});
    charts.drawer3 = lineChart($('#drawerChart3'), Array(24).fill(''), series, {showX:false, max:100});
  }
  if(hasTraffic){
    charts.drawer2 = lineChart($('#drawerChart2'), Array(24).fill(''), [{label:'트래픽(Mbps)', data:e.hist.traffic, color:'#ff3ec9', fill:true}], {showX:false});
  }
}
function drawAgentPending(e, catLabel){
  $('#drawerTitle').textContent = e.name;
  $('#drawerRole').textContent = `${catLabel} · Agent 연결 대기 중`;
  $('#drawerBody').innerHTML = `
    <div class="kv-grid"><div class="kv" style="grid-column:span 2"><span>상태</span><b style="color:var(--warn)">에이전트 미연결</b></div></div>
    <div class="card"><div class="card-head"><h3>설치 안내</h3></div>
      <p style="font-size:12px;color:var(--text-dim);line-height:1.6;margin:0">등록 시 안내된 명령어를 해당 PC의 터미널에서 실행하면 몇 초 내로 실시간 지표가 표시됩니다.</p>
    </div>
  `;
}

/* ================= topbar pills / badges ================= */
function refreshBadges(){
  const all = [...SERVERS,...DBS,...NETS,...FACS];
  const c = countStatus(all);
  $('#topStatusPills').innerHTML = `
    <span class="status-pill"><span class="dot" style="background:var(--good)"></span>정상 ${c.good}</span>
    <span class="status-pill"><span class="dot" style="background:var(--warn)"></span>주의 ${c.warn}</span>
    <span class="status-pill"><span class="dot" style="background:var(--crit)"></span>위험 ${c.crit}</span>
  `;
  $('#bellBadge').textContent = INCIDENTS.filter(i=>i.status==='open').length;
  $('#nav-count-servers').textContent = SERVERS.length;
  $('#nav-count-db').textContent = DBS.length;
  $('#nav-count-net').textContent = NETS.length;
  $('#nav-count-fac').textContent = FACS.length;
  $('#nav-count-inc').textContent = INCIDENTS.filter(i=>i.status==='open').length;
  $('#foot-total').textContent = all.length + '대';
  $('#foot-addr').textContent = `${SERVER_INFO.lanIp}:${SERVER_INFO.port}`;
}

/* ================= view routing ================= */
const VIEWS = {
  overview: {skeleton:renderOverviewSkeleton, render:renderOverview, title:'전체 현황', sub:'서버 · DB · 네트워크 · 설비 통합 모니터링 개요'},
  topology: {skeleton:renderTopologySkeleton, render:refreshTopologyView, title:'토플로지 맵', sub:'인프라 연결 구조 및 실시간 트래픽'},
  servers: {skeleton:renderServersSkeleton, render:renderServers, title:'서버 관리 (SMS)', sub:'CPU · 메모리 · 디스크 · 프로세스 모니터링'},
  database: {skeleton:renderDatabaseSkeleton, render:renderDatabase, title:'데이터베이스 관리 (DBMS)', sub:'RDBMS / NoSQL 성능 및 세션 모니터링'},
  network: {skeleton:renderNetworkSkeleton, render:renderNetwork, title:'네트워크 관리 (NMS)', sub:'스위치 · 라우터 트래픽 및 포트 상태'},
  flowanalysis: {skeleton:renderFlowSkeleton, render:renderFlow, title:'트래픽 분석 (NetFlow/sFlow)', sub:'흐름(flow) 기반 대역폭·상위 트래픽·프로토콜 분석'},
  facility: {skeleton:renderFacilitySkeleton, render:renderFacility, title:'전산실 설비 관리 (FMS)', sub:'UPS · 항온항습기 · 전원 설비 모니터링'},
  incidents: {skeleton:renderIncidentsSkeleton, render:renderIncidents, title:'이벤트 / 장애 관리', sub:'전체 영역 통합 이벤트 로그 및 조치 이력'},
  register: {skeleton:renderRegisterSkeleton, render:renderRegister, title:'장비 등록', sub:'신규 서버 · DB · 네트워크 · 설비 등록 및 관리'},
  users: {skeleton:renderUsersSkeleton, render:renderUsers, title:'사용자 관리', sub:'로그인 계정 및 권한 관리 (ADMIN)'},
};
let currentView = 'overview';
function initSkeletons(){ Object.values(VIEWS).forEach(v=>v.skeleton()); }
function switchView(name){
  if(!VIEWS[name]) return;
  if(currentView==='register' && name!=='register'){
    if(editingDeviceId && !confirm('수정을 취소할까요?')) return;
    if(typeof window.exitRegisterEditMode==='function') window.exitRegisterEditMode();
  }
  // Each search box lives in a skeleton built once at startup (see
  // initSkeletons()) and never rebuilt, so a leftover search term from a
  // previous visit would otherwise sit in the input indefinitely. Clearing
  // it on the way IN (not on every render() -- that also fires on each
  // live-data poll while the view is open, which would wipe out whatever
  // the user is actively typing) means each fresh visit starts blank.
  const SEARCH_INPUT_ID = {servers:'srv-search', database:'db-search', network:'net-search', incidents:'inc-search'};
  if(SEARCH_INPUT_ID[name] && currentView!==name){
    const s = $('#'+SEARCH_INPUT_ID[name]); if(s) s.value = '';
  }
  currentView = name;
  $$('.view').forEach(v=> v.classList.toggle('active', v.dataset.view===name));
  $$('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  expandNavGroupFor(name);
  $('#pageTitle').textContent = VIEWS[name].title;
  $('#pageSub').textContent = VIEWS[name].sub;
  VIEWS[name].render();
  document.getElementById('sidebar').classList.remove('open');
  $('#sidebarScrim').classList.remove('show');
}
$$('.nav-item').forEach(btn=> btn.addEventListener('click', ()=> switchView(btn.dataset.view)));

/* ================= collapsible nav groups ================= */
function setNavGroupCollapsed(label, collapsed){
  label.classList.toggle('collapsed', collapsed);
  const wrap = document.getElementById(label.dataset.group);
  if(wrap) wrap.classList.toggle('collapsed', collapsed);
}
$$('.nav-group-label').forEach(label=>{
  label.addEventListener('click', ()=> setNavGroupCollapsed(label, !label.classList.contains('collapsed')));
});
function expandNavGroupFor(viewName){
  const btn = $(`.nav-item[data-view="${viewName}"]`);
  const wrap = btn && btn.closest('.nav-group-wrap');
  if(!wrap) return;
  const label = $(`.nav-group-label[data-group="${wrap.id}"]`);
  if(label) setNavGroupCollapsed(label, false);
}

/* ================= clock ================= */
function tickClock(){
  const now = new Date();
  $('#clockTime').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  $('#clockDate').textContent = `${now.getFullYear()}.${pad2(now.getMonth()+1)}.${pad2(now.getDate())} ${['일','월','화','수','목','금','토'][now.getDay()]}`;
}

/* ================= drawer / sidebar wiring ================= */
$('#drawerClose').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
$('#bellBtn').addEventListener('click', ()=> switchView('incidents'));
$('#hamburgerBtn').addEventListener('click', ()=>{
  $('#sidebar').classList.toggle('open'); $('#sidebarScrim').classList.toggle('show');
});
$('#sidebarScrim').addEventListener('click', ()=>{ $('#sidebar').classList.remove('open'); $('#sidebarScrim').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/auth/logout', {method:'POST'});
  location.reload();
});
/* ================= main loop ================= */
initSkeletons();
tickClock();
setInterval(tickClock, 1000);
(async function boot(){
  await ensureAuthed();
  await syncState();
  refreshBadges();
  switchView('overview');
  setInterval(async ()=>{
    const ok = await syncState();
    if(ok){
      refreshBadges();
      VIEWS[currentView].render();
      refreshOpenDrawer();
      renderIfaceModal();
    }
  }, 2200);
})();

})();
</script>
