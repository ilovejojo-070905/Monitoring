<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InfraSight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#101d38;
    --bg-elevated:rgba(27,44,80,.92);
    --chrome-text:#f2f5fc;
    --chrome-text-dim:rgba(242,245,252,.72);
    --chrome-text-faint:rgba(242,245,252,.5);
    --surface:#ffffff;
    --surface-2:#f1f4fa;
    --surface-hover:#e9edf6;
    --border:rgba(30,41,59,.08);
    --border-strong:rgba(30,41,59,.16);
    --text:#1c2333;
    --text-dim:#5b6478;
    --text-faint:#8f99b3;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --accent-3:#ff3ec9;
    --accent-soft:rgba(124,92,255,.13)
;
    --accent-gradient:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
    --good:#00b087;
    --good-soft:rgba(0,176,135,.13);
    --warn:#e6960f;
    --warn-soft:rgba(230,150,15,.14);
    --crit:#ef3b5c;
    --crit-soft:rgba(239,59,92,.13);
    --info:#0ea5e9;
    --info-soft:rgba(14,165,233,.13);
    --glow-accent:0 8px 22px rgba(124,92,255,.22);
    --glow-good:0 8px 20px rgba(0,176,135,.22);
    --glow-warn:0 8px 20px rgba(230,150,15,.22);
    --glow-crit:0 8px 20px rgba(239,59,92,.22);
    --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
    --radius:14px;
    --radius-sm:9px;
    --sidebar-w:228px;
    --topbar-h:64px;
    --sidebar-bg:#101d38;
    --sidebar-text:#ffffff;
    --sidebar-text-dim:rgba(255,255,255,.75);
    --sidebar-text-faint:rgba(255,255,255,.5);
    --sidebar-hover:rgba(255,255,255,.10);
    --sidebar-border:rgba(255,255,255,.14);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  /* Always reserve the scrollbar's own width (stops .main's content from
     visibly widening/narrowing as the drag handlers toggle the page's
     ability to scroll -- see startTopoDrag). Matching html's own background
     to .main's is what keeps that reserved strip from reading as a stray
     empty gap: without it, the strip shows through in whatever html's
     default background is, which doesn't match the light content beside it. */
  html{scrollbar-gutter:stable;background:#e6f6fc}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);font-family:var(--font-ui);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-left:16px;padding-right:16px;
    background:
      radial-gradient(circle at 12% -8%, rgba(124,92,255,.07), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(34,211,238,.06), transparent 38%),
      radial-gradient(circle at 60% 105%, rgba(255,62,201,.04), transparent 48%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
  }
  body{padding-left:0;padding-right:0}
  h1,h2,h3,h4{font-family:var(--font-ui);margin:0;text-wrap:balance}
  p{margin:0}
  button{font-family:inherit;cursor:pointer}
  table{border-collapse:collapse}
  .mono{font-family:var(--font-mono)}
  .tabular{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- shell ---------- */
  .app-shell{
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    grid-template-rows:var(--topbar-h) 1fr;
    grid-template-areas:"sidebar topbar" "sidebar main";
    min-height:100%;
  }
  .sidebar{
    grid-area:sidebar;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
    display:flex;flex-direction:column;padding:18px 12px;gap:4px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px;}
  .brand-mark{width:42px;height:42px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset}
  .brand-text b{color:var(--sidebar-text)}
  .brand-mark svg{width:24px;height:24px;stroke:var(--sidebar-bg)}
  .brand-text{display:flex;flex-direction:column;line-height:1.2}
  .brand-text b{font-size:19px;letter-spacing:.2px}
  .brand-text span{font-size:12.5px;color:var(--sidebar-text-faint)}
  .nav-group-label{
    font-size:16.5px;font-weight:700;letter-spacing:.02em;color:var(--sidebar-text);padding:14px 10px 8px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;
    background:none;border:none;width:100%;text-align:left;font-family:inherit;
  }
  .nav-group-label:hover{color:var(--sidebar-text)}
  .nav-group-label .chev{width:15px;height:15px;flex:none;stroke:var(--sidebar-text-faint);transition:transform .2s}
  .nav-group-label.collapsed .chev{transform:rotate(-90deg)}
  .nav-group-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
  .nav-group-wrap.collapsed{grid-template-rows:0fr}
  .nav-group-inner{overflow:hidden;display:flex;flex-direction:column;gap:4px;min-height:0}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);
    color:var(--sidebar-text-dim);text-decoration:none;font-size:13.5px;font-weight:600;border:1px solid transparent;
    background:transparent;width:100%;text-align:left;
  }
  .nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor}
  .nav-item{transition:background .15s,box-shadow .15s,border-color .15s}
  .nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
  .nav-item.active{background:#ffffff;color:var(--sidebar-bg);border-color:transparent;box-shadow:0 6px 16px rgba(0,0,0,.18);font-weight:700}
  .nav-item .count{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--sidebar-text-faint);background:rgba(255,255,255,.12);padding:1px 6px;border-radius:20px}
  .nav-item.active .count{color:var(--sidebar-bg);background:var(--surface-2)}
  .sidebar-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--sidebar-border);display:flex;flex-direction:column;gap:6px}
  .sidebar-foot .row{display:flex;justify-content:space-between;font-size:11px;color:var(--sidebar-text-faint)}
  .sidebar-foot .row b{color:var(--sidebar-text-dim);font-family:var(--font-mono)}

  .topbar{
    grid-area:topbar;background:var(--bg-elevated);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:20;
  }
  .hamburger{display:none;background:none;border:1px solid var(--border);color:var(--chrome-text-dim);border-radius:var(--radius-sm);width:34px;height:34px;align-items:center;justify-content:center}
  .hamburger svg{width:18px;height:18px}
  .page-title{display:flex;flex-direction:column;gap:1px;margin-right:auto}
  .page-title h1{font-size:16.5px;font-weight:600;color:var(--chrome-text)}
  .page-title span{font-size:11.5px;color:var(--chrome-text-faint)}
  .status-pills{display:flex;gap:8px}
  .status-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--font-mono);padding:5px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
  .status-pill .dot{width:7px;height:7px;border-radius:50%}
  .clock{display:flex;flex-direction:column;align-items:flex-end;padding-left:14px;border-left:1px solid var(--border)}
  .clock .time{font-family:var(--font-mono);font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--chrome-text)}
  .clock .date{font-size:10.5px;color:var(--chrome-text-faint)}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--good);font-weight:600;letter-spacing:.03em}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px 1px rgba(0,230,168,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 0 rgba(0,230,168,.55)}70%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 8px rgba(0,230,168,0)}100%{box-shadow:0 0 8px 1px rgba(0,230,168,.7),0 0 0 0 rgba(0,230,168,0)}}
  .bell-btn{position:relative;background:var(--surface);border:1px solid var(--border);width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:border-color .15s,color .15s}
  .bell-btn:hover{border-color:var(--accent);color:var(--accent-2)}
  .bell-btn svg{width:16px;height:16px}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:linear-gradient(135deg,var(--crit),var(--accent-3));color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--font-mono);box-shadow:var(--glow-crit)}

  .main{grid-area:main;padding:22px 26px 24px;overflow-x:hidden;background:#e6f6fc;min-height:calc(100vh - var(--topbar-h));box-sizing:border-box}
  .view{display:none;flex-direction:column;gap:10px;animation:fadein .25s ease}
  .view.active{display:flex}
  #view-topology.active{background:var(--bg);border-radius:var(--radius);padding:16px;min-height:100%}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- reusable ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:border-color .18s,box-shadow .18s;position:relative;box-shadow:0 1px 2px rgba(30,41,59,.04),0 6px 20px rgba(30,41,59,.05)}
  .card:hover{border-color:var(--border-strong);box-shadow:0 10px 28px rgba(124,92,255,.14)}
  #view-overview .card, #view-servers .card, #view-database .card, #view-network .card, #view-facility .card, #view-incidents .card, #view-register .card, #view-users .card{border-color:#7dd3fc}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
  .card-head.collapsible{cursor:pointer;user-select:none;align-items:center}
  .card-head.collapsible h3{font-size:17px}
  .card-head.collapsible .sub{font-size:12.5px}
  .card-head.collapsible .chev{width:15px;height:15px;flex:none;stroke:var(--text-faint);transition:transform .2s}
  .card-head.collapsible.collapsed .chev{transform:rotate(-90deg)}
  .collapse-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
  .collapse-wrap.collapsed{grid-template-rows:0fr}
  .collapse-inner{overflow:hidden;min-height:0}
  .mini-toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-top:7px;padding:2px 0}
  .mini-toggle span{font-size:10.5px;color:var(--text-faint)}
  .mini-toggle .chev{width:12px;height:12px;flex:none;stroke:var(--text-faint);transition:transform .2s}
  .mini-toggle.collapsed .chev{transform:rotate(-90deg)}
  .card-head h3{font-size:13.5px;font-weight:600}
  .card-head .sub{font-size:11px;color:var(--text-faint)}
  /* 서버/DB/네트워크/설비/이벤트/등록/계정 목록 화면의 카드 제목만 확대.
     전체 현황·토플로지 맵은 카드가 촘촘히 배치되는 요약 화면이라 제외. */
  #view-servers .card-head h3, #view-database .card-head h3, #view-network .card-head h3,
  #view-facility .card-head h3, #view-incidents .card-head h3, #view-register .card-head h3,
  #view-users .card-head h3{font-size:16px}
  .grid{display:grid;gap:16px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .grid-span2{grid-column:span 2}
  .grid-span3{grid-column:span 3}

  .kpi-card{display:flex;align-items:center;gap:14px}
  .kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
  .kpi-icon svg{width:20px;height:20px}
  .kpi-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi-label{font-size:14px;color:var(--text);font-weight:600}
  .kpi-value{font-size:22px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
  .kpi-sub{display:flex;gap:8px;font-size:10.5px;font-family:var(--font-mono)}
  .kpi-sub .g{color:var(--good)} .kpi-sub .w{color:var(--warn)} .kpi-sub .c{color:var(--crit)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill .dot{width:6px;height:6px;border-radius:50%}
  .pill.good{background:var(--good-soft);color:var(--good);box-shadow:0 0 0 1px rgba(0,230,168,.12) inset}
  .pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px rgba(255,176,32,.12) inset}
  .pill.crit{background:var(--crit-soft);color:var(--crit);box-shadow:0 0 0 1px rgba(255,59,92,.14) inset}
  .pill.info{background:var(--info-soft);color:var(--info);box-shadow:0 0 0 1px rgba(62,203,255,.12) inset}
  .pill.neutral{background:var(--surface-2);color:var(--text-dim)}
  .pill.good .dot{background:var(--good);box-shadow:0 0 6px rgba(0,230,168,.9)} .pill.warn .dot{background:var(--warn);box-shadow:0 0 6px rgba(255,176,32,.8)} .pill.crit .dot{background:var(--crit);box-shadow:0 0 6px rgba(255,59,92,.9);animation:pulse 1.6s infinite} .pill.info .dot{background:var(--good);box-shadow:0 0 6px rgba(0,230,168,.9)} .pill.neutral .dot{background:var(--text-faint)}

  .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
  .bar > i{display:block;height:100%;border-radius:6px}
  .bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.crit > i{background:var(--crit)}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
  table.data{width:100%;min-width:640px;border-collapse:collapse;font-size:12.5px}
  table.data thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--chrome-text-faint);
    background:var(--bg-elevated);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
  }
  table.data tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-dim)}
  table.data tbody tr{cursor:pointer;transition:background .12s}
  table.data tbody tr:hover{background:var(--surface-hover)}
  table.data tbody tr.sel-row{background:var(--accent-soft)}
  table.data tbody tr.sel-row:hover{background:var(--accent-soft)}
  table.data tbody tr:last-child td{border-bottom:none}
  table.data td.name{color:var(--text);font-weight:600}
  table.data td.mono{font-family:var(--font-mono)}
  table.data.reg-device-table{font-size:14.5px}
  table.data.reg-device-table thead th{font-size:13px;text-align:center;color:var(--chrome-text)}
  table.data.reg-device-table tbody td{padding:13px 14px;text-align:center}
  table.data.reg-device-table td.name{font-weight:700}

  .gauge{position:relative;width:104px;height:104px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px rgba(124,92,255,.25))}
  .gauge::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg-elevated);backdrop-filter:blur(14px)}
  .gauge-label{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1}
  .gauge-label b{font-family:var(--font-mono);font-size:19px}
  .gauge-label span{font-size:9.5px;color:var(--chrome-text-faint);text-transform:uppercase;letter-spacing:.05em}
  .gauge-row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .gauge-row .g-item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .gauge-row .g-item > span{font-size:11px;color:var(--text-faint)}

  .chip-btn{background:var(--sidebar-bg);border:1px solid transparent;color:#fff;font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;transition:all .15s}
  .chip-btn.active{background:var(--accent-gradient);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(124,92,255,.3)}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}

  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;min-width:220px;transition:border-color .15s,box-shadow .15s}
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .search-box svg{width:14px;height:14px;color:var(--text-faint);flex:none}
  .search-box input{background:none;border:none;color:var(--text);font-size:12.5px;font-family:inherit;width:100%}
  .search-box input:focus{outline:none}
  .search-box input::placeholder{color:var(--text-faint)}

  .empty-note{padding:26px;text-align:center;color:var(--text-faint);font-size:12.5px}

  /* ---------- topology ---------- */
  /* No backdrop-filter here anymore: blurring whatever sits behind this
     element forces Chromium into an extra compositing pass, and the
     connection lines (painted inside it) would render visibly softer/dimmer
     until something elsewhere -- hovering a node -- triggered a repaint and
     the blur recomposited, at which point they'd suddenly look sharp and
     bright. The radial-gradient background alone gives the same look
     without that render path. */
  .topo-wrap{flex:1;min-height:0;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:
    radial-gradient(circle at 20% 20%,rgba(124,92,255,.10),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(0,230,168,.08),transparent 45%),
    radial-gradient(circle at 50% 100%,rgba(255,62,201,.07),transparent 50%),var(--bg-elevated);}
  /* transform:translateZ(0) forces this onto its own compositor layer
     permanently, instead of only getting promoted (and only then rasterized
     at full sharpness) the moment something inside it -- a node's hover
     box-shadow -- first triggers compositing. Without it the connection
     lines render visibly softer until the mouse touches an icon. */
  .topo-canvas{position:relative;width:100%;height:100%;min-height:320px;--topo-icon-size:52px;transform:translateZ(0)}
  .topo-canvas svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;shape-rendering:geometricPrecision}
  .topo-canvas.link-mode .topo-node{cursor:crosshair}
  .topo-node{
    /* x/y (left/top) must land on the ICON's center, not the whole node's
       (icon + label) center -- those only coincide when every icon is the
       same height. Shifting up by half the icon's own height (not -50% of
       the whole box) keeps the connected line anchored on the icon as its
       size changes per-node. */
    position:absolute;transform:translate(-50%, calc(-1 * var(--topo-icon-size, 52px) / 2));width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none;
  }
  .topo-node *{-webkit-user-drag:none}
  .topo-node:active{cursor:grabbing}
  .topo-node .node-box{
    width:var(--topo-icon-size,52px);height:var(--topo-icon-size,52px);border-radius:12px;background:var(--surface);border:1.5px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .15s,box-shadow .15s;
  }
  .topo-node .node-box svg{width:calc(var(--topo-icon-size,52px) * .46);height:calc(var(--topo-icon-size,52px) * .46);stroke:var(--text-dim)}
  .topo-node .node-status{position:absolute;bottom:-3px;right:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg-elevated)}
  .topo-node .node-del{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--crit);color:#fff;border:2px solid var(--bg-elevated);font-size:12px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .topo-node:not([data-node="hub"]):hover .node-del{display:flex}
  .topo-node .node-name{font-size:10.5px;font-weight:600;text-align:center;color:var(--chrome-text-dim);font-family:var(--font-mono);white-space:nowrap}

<script>
(function(){
"use strict";

/* ================= helpers ================= */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function fmt0(n){ return Math.round(n).toString(); }
function pad2(n){ return n.toString().padStart(2,'0'); }
function levelOf(pct, warnAt, critAt){ return pct>=critAt?'crit': pct>=warnAt?'warn':'good'; }
function levelColor(lv){ return lv==='crit'?'var(--crit)': lv==='warn'?'var(--warn)':'var(--good)'; }
function levelColorHex(lv){ return lv==='crit'?'#ef3b5c': lv==='warn'?'#e6960f':'#00b087'; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function regTag(entity){
  // "신규등록" 배지는 영구 표시가 아니라 등록 직후 약 1분간만 보이는 알림이다
  // -- 상태 폴링(수 초 주기)으로 화면이 계속 다시 그려지므로, 1분이 지나면
  // 이 조건이 false가 되면서 다음 리렌더에 자연스럽게 사라진다. 별도 타이머가
  // 필요 없는 이유.
  if(entity.origin !== 'user' || !entity.createdAt) return '';
  if(Date.now() - entity.createdAt >= 60000) return '';
  return `<span class="pill info" style="font-size:9px;padding:1px 6px;margin-left:5px;vertical-align:middle">신규등록</span>`;
}
function maintTag(entity){ return entity.maintenance && entity.maintenance.enabled ? `<span class="pill" style="font-size:9px;padding:1px 6px;margin-left:5px;vertical-align:middle;background:var(--warn-soft);color:var(--warn)">점검중</span>` : ''; }
function groupTag(entity){ return entity.group ? `<span class="pill" style="font-size:9px;padding:1px 6px;margin-left:5px;vertical-align:middle;background:var(--accent-soft);color:var(--accent)">${escapeHtml(entity.group)}</span>` : ''; }

Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.color = '#6b7488';
Chart.defaults.borderColor = '#e7eaf3';

/* ================= auth ================= */
let CSRF_TOKEN = null;
let CURRENT_ROLE = null;
let CURRENT_USER = null;

async function checkAuth(){
  try{
    const r = await fetch('/api/auth/me', {cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

let _reauthPromise = null;
function reAuth(){
  if(_reauthPromise) return _reauthPromise;
  $('#loginOverlay').style.display = 'flex';
  $('#loginError').textContent = '';
  _reauthPromise = new Promise((resolve)=>{
    $('#loginForm').addEventListener('submit', async function onSubmit(e){
      e.preventDefault();
      $('#loginError').textContent = '';
      const u = $('#loginUsername').value.trim();
      const p = $('#loginPassword').value;
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p}),
        });
        const j = await r.json();
        if(!r.ok) throw new Error(j.error || '로그인 실패');
        if(j.mustChangePassword){
          // Login itself succeeded (the server already set a valid session
          // cookie), but the account is still on the installer's default
          // password -- hold the login as "not really done" until a new
          // password is set, then make them log back in with it rather than
          // silently carrying this temporary session into the app.
          CSRF_TOKEN = j.csrfToken;
          const changed = await promptForcedPasswordChange(p);
          CSRF_TOKEN = null;
          $('#loginPassword').value = '';
          $('#loginError').textContent = changed ? '비밀번호가 변경되었습니다. 새 비밀번호로 다시 로그인해주세요.' : '';
          return;
        }
        CSRF_TOKEN = j.csrfToken; CURRENT_ROLE = j.role; CURRENT_USER = j.username;
        $('#loginForm').removeEventListener('submit', onSubmit);
        $('#loginOverlay').style.display = 'none';
        $('#loginPassword').value = '';
        $('#foot-user').textContent = j.username + (j.role!=='ADMIN' ? ` (${j.role})` : '');
        applyRoleUI();
        _reauthPromise = null;
        resolve();
      }catch(err){
        $('#loginError').textContent = err.message;
      }
    });
  });
  return _reauthPromise;
}

/* Shown right after a login that comes back with mustChangePassword (the
   installer's admin/admin default). Resolves true once the password is
   actually changed, false if the user navigates away without changing it
   (tab close etc. -- there's no cancel button on purpose, this isn't
   optional). The session this runs under is the one /api/auth/login just
   created; changing the password invalidates it server-side, which is
   exactly why the caller sends them back to the login form afterward
   instead of continuing on into the app. */
function promptForcedPasswordChange(currentPassword){
  return new Promise((resolve)=>{
    $('#forcePwError').textContent = '';
    $('#forcePwNew').value = ''; $('#forcePwNew2').value = '';
    $('#forcePwOverlay').style.display = 'flex';
    $('#forcePwForm').addEventListener('submit', async function onSubmit(e){
      e.preventDefault();
      $('#forcePwError').textContent = '';
      const pw = $('#forcePwNew').value, pw2 = $('#forcePwNew2').value;
      if(pw.length < 8){ $('#forcePwError').textContent = '8자 이상 입력해주세요.'; return; }
      if(pw !== pw2){ $('#forcePwError').textContent = '비밀번호가 일치하지 않습니다.'; return; }
      try{
        const r = await fetch('/api/auth/change-password', {
          method:'POST', headers:{'Content-Type':'application/json', 'X-CSRF-Token':CSRF_TOKEN},
          body: JSON.stringify({currentPassword:currentPassword, newPassword:pw}),
        });
        const j = await r.json();
        if(!r.ok) throw new Error(j.error || '변경 실패');
        $('#forcePwForm').removeEventListener('submit', onSubmit);
        $('#forcePwOverlay').style.display = 'none';
        resolve(true);
      }catch(err){
        $('#forcePwError').textContent = err.message;
      }
    });
  });
}

function ensureAuthed(){
  return new Promise((resolve)=>{
    checkAuth().then(info=>{
      if(info && info.username && info.mustChangePassword){
        // A still-valid session cookie from before the password was ever
        // changed (e.g. the tab was closed right after logging in with
        // admin/admin and reopened later) -- promptForcedPasswordChange
        // needs the current password in hand to call change-password with,
        // which this restored-session path never has. Simplest correct fix:
        // drop this session and send them through the normal login form,
        // which does capture it and already handles mustChangePassword.
        fetch('/api/auth/logout', {method:'POST'}).catch(()=>{}).then(()=>{
          reAuth().then(resolve);
        });
        return;
      }
      if(info && info.username){
        CSRF_TOKEN = info.csrfToken; CURRENT_ROLE = info.role; CURRENT_USER = info.username;
        $('#foot-user').textContent = info.username + (info.role!=='ADMIN' ? ` (${info.role})` : '');
        applyRoleUI();
        resolve();
        return;
      }
      reAuth().then(resolve);
    });
  });
}

/* Every mutating call goes through this: attaches the CSRF header, and if
   the session has been invalidated (logout elsewhere, idle timeout, a
   password change) since the page loaded, re-shows the login overlay
   in-place instead of silently failing or leaving the button looking stuck. */
async function apiFetch(url, opts){
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({}, opts.headers||{});
  const method = (opts.method||'GET').toUpperCase();
  if(['POST','PUT','DELETE','PATCH'].includes(method) && CSRF_TOKEN){
    opts.headers['X-CSRF-Token'] = CSRF_TOKEN;
  }
  const r = await fetch(url, opts);
  if(r.status === 401){
    await reAuth();
    throw new Error('세션이 만료되어 다시 로그인했습니다. 다시 시도해주세요.');
  }
  return r;
}

/* Hiding controls per role is convenience only -- server.py enforces the
   real access control on every route regardless of what the UI shows. */
function applyRoleUI(){
  const isAdmin = CURRENT_ROLE === 'ADMIN';
  const isOperatorPlus = CURRENT_ROLE === 'ADMIN' || CURRENT_ROLE === 'OPERATOR';
  document.body.classList.toggle('role-admin', isAdmin);
  document.body.classList.toggle('role-operator-plus', isOperatorPlus);
  const usersNav = $('#nav-users');
  if(usersNav) usersNav.style.display = isAdmin ? '' : 'none';
}

/* ================= backend-driven live state ================= */
let SERVERS = [], DBS = [], NETS = [], FACS = [], INCIDENTS = [];
let DEVICE_LLDP_LINKS = [];
let SERVER_INFO = { lanIp: location.hostname || 'localhost', port: location.port || '5057' };

/* ================= alert design: web notification channel =================
   "1단계: 웹 화면 알림". Every incident already lands in the DB the instant
   add_incident() (in storage.py) writes it -- this just watches the same
   incidents list syncState() already polls every 2.2s and raises a toast for
   anything genuinely new-worth-surfacing, using the exact same "new or
   escalated or recovered" definition storage.py uses to decide whether to
   fire an email (so the web toast and an eventual email never disagree about
   what counts as noteworthy). Never re-toasts a repeat occurrence of an
   already-open incident (occurrence_count bump only) -- that's the
   알림 폭주 방지 requirement. */
let _seenIncidents = new Map();  // id -> {severity, status}
let _firstIncidentSync = true;
const SEVERITY_LABEL = {crit:'위험', warn:'주의', info:'정보'};
function notifyNewIncidents(list){
  if(_firstIncidentSync){
    _firstIncidentSync = false;
    list.forEach(i=> _seenIncidents.set(i.id, {severity:i.severity, status:i.status}));
    return;
  }
  list.forEach(i=>{
    const prev = _seenIncidents.get(i.id);
    if(prev === undefined){
      if(i.status==='open') showToast(i, 'new');
      else if(i.status==='resolved' && i.severity==='info') showToast(i, 'recovery');
    } else if(i.status==='open' && prev.severity !== i.severity){
      showToast(i, 'escalation');
    }
    _seenIncidents.set(i.id, {severity:i.severity, status:i.status});
  });
}
/* ================= custom confirm dialog (always centered, unlike native confirm()) ================= */
function showConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    $('#confirmTitle').textContent = opts.title || '확인';
    $('#confirmMsg').textContent = message;
    $('#confirmOkBtn').textContent = opts.okText || '확인';
    $('#confirmOverlay').classList.add('show');
    $('#confirmModal').classList.add('show');
    function cleanup(result){
      $('#confirmOverlay').classList.remove('show');
      $('#confirmModal').classList.remove('show');
      $('#confirmOkBtn').removeEventListener('click', onOk);
      $('#confirmCancelBtn').removeEventListener('click', onCancel);
      $('#confirmOverlay').removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    $('#confirmOkBtn').addEventListener('click', onOk);
    $('#confirmCancelBtn').addEventListener('click', onCancel);
    $('#confirmOverlay').addEventListener('click', onCancel);
  });
}
function showToast(inc, kind){
  const stack = $('#toastStack');
  if(!stack) return;
  const sevClass = kind==='recovery' ? 'good' : (inc.severity==='crit'?'crit':inc.severity==='warn'?'warn':'info');
  const kindLabel = kind==='recovery' ? '복구' : kind==='escalation' ? '심각도 변경' : SEVERITY_LABEL[inc.severity]||'알림';
  const el = document.createElement('div');
  el.className = `toast toast-${sevClass}`;
  el.innerHTML = `
    <span class="dot"></span>
    <div class="toast-body">
      <div class="toast-head"><b>${escapeHtml(inc.category||'')} · ${kindLabel}</b><span>${escapeHtml(inc.source||'')}</span></div>
      <div class="toast-msg">${escapeHtml(inc.message||'')}</div>
    </div>
    <button type="button" class="toast-close" aria-label="닫기">&times;</button>`;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.toast-close')){ el.remove(); return; }
    switchView('incidents'); el.remove();
  });
  stack.appendChild(el);
  while(stack.children.length > 5) stack.removeChild(stack.firstChild);
  setTimeout(()=>{ el.classList.add('closing'); setTimeout(()=> el.remove(), 220); }, 8000);
}

async function syncState(){
  try{
    const r = await apiFetch('/api/state', {cache:'no-store'});
    if(!r.ok) throw new Error('bad status');
    const j = await r.json();
    SERVERS = j.servers; DBS = j.dbs; NETS = j.nets; FACS = j.facs;
    INCIDENTS = j.incidents.map(i=>({
      id:i.id, time:new Date(i.ts), severity:i.severity, source:i.source, category:i.category, message:i.message,
      status:i.status, deviceId:i.device_id, eventType:i.event_type, occurrenceCount:i.occurrence_count,
    }));
    if(j.serverInfo) SERVER_INFO = j.serverInfo;
    DEVICE_LLDP_LINKS = j.deviceLinks || [];
    rebuildTopology();
    notifyNewIncidents(INCIDENTS);
    return true;
  }catch(e){
    return false;
  }
}
async function registerDevice(category, mode, name, ip, fields){
  const r = await apiFetch('/api/devices', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category, mode, name, ip, fields}),
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'등록 실패');
  return j;
}
async function unregisterDevice(id){
  await apiFetch('/api/devices/'+id, {method:'DELETE'});
}
async function updateDevice(id, name, ip, fields){
  const r = await apiFetch('/api/devices/'+id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, ip, fields}),
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'수정 실패');
  return j;
}
async function ackIncident(id){
  await apiFetch('/api/incidents/'+id+'/ack', {method:'POST'});
}

  if(VIEWS[currentView]) VIEWS[currentView].render();
  refreshOpenDrawer();

}

/* ================= topology: hub + every registered device, fully dynamic ================= */
let TOPO_NODES = [];
let TOPO_LINKS = [];
let lastTopoSignature = null;
let topoDefaultContentW = 0;
let topoDefaultContentH = 0;
let topoDragging = false;
let topoLinkMode = false;
let topoLinkFrom = null;
let topoAddPanelOpen = false;
const ICON_LABELS = {router:'라우터', switch:'스위치', server:'서버', db:'데이터베이스', firewall:'방화벽', cloud:'클라우드', monitor:'모니터', ups:'UPS', alert:'경고', question:'기타'};
const TOPO_DEFAULT_ICON_SIZE = 52;
const TOPO_LAYOUT_KEY = 'infrasight_topo_layout';
const TOPO_NODE_SIZES_KEY = 'infrasight_topo_node_sizes';
const TOPO_CUSTOM_NODES_KEY = 'infrasight_topo_custom_nodes';
const TOPO_CUSTOM_LINKS_KEY = 'infrasight_topo_custom_links';
const TOPO_HIDDEN_LINKS_KEY = 'infrasight_topo_hidden_links';
const TOPO_HIDDEN_NODES_KEY = 'infrasight_topo_hidden_nodes';
function loadTopoLayout(){
  try{ return JSON.parse(localStorage.getItem(TOPO_LAYOUT_KEY) || '{}'); }catch(e){ return {}; }
}
function saveTopoLayout(layout){
  try{ localStorage.setItem(TOPO_LAYOUT_KEY, JSON.stringify(layout)); }catch(e){}
}
function loadTopoNodeSizes(){ try{ return JSON.parse(localStorage.getItem(TOPO_NODE_SIZES_KEY)||'{}'); }catch(e){ return {}; } }
function saveTopoNodeSizes(sizes){ try{ localStorage.setItem(TOPO_NODE_SIZES_KEY, JSON.stringify(sizes)); }catch(e){} }
function clampTopoNodeSize(v){ return Math.min(96, Math.max(28, v)); }
function loadTopoCustomNodes(){ try{ return JSON.parse(localStorage.getItem(TOPO_CUSTOM_NODES_KEY)||'[]'); }catch(e){ return []; } }
function saveTopoCustomNodes(list){ try{ localStorage.setItem(TOPO_CUSTOM_NODES_KEY, JSON.stringify(list)); }catch(e){} }
function loadTopoCustomLinks(){ try{ return JSON.parse(localStorage.getItem(TOPO_CUSTOM_LINKS_KEY)||'[]'); }catch(e){ return []; } }
function saveTopoCustomLinks(list){ try{ localStorage.setItem(TOPO_CUSTOM_LINKS_KEY, JSON.stringify(list)); }catch(e){} }
function loadTopoHiddenLinks(){ try{ return JSON.parse(localStorage.getItem(TOPO_HIDDEN_LINKS_KEY)||'[]'); }catch(e){ return []; } }
function saveTopoHiddenLinks(list){ try{ localStorage.setItem(TOPO_HIDDEN_LINKS_KEY, JSON.stringify(list)); }catch(e){} }
function loadTopoHiddenNodes(){ try{ return JSON.parse(localStorage.getItem(TOPO_HIDDEN_NODES_KEY)||'[]'); }catch(e){ return []; } }
function saveTopoHiddenNodes(list){ try{ localStorage.setItem(TOPO_HIDDEN_NODES_KEY, JSON.stringify(list)); }catch(e){} }
function topoLinkKey(a,b){ return [a,b].sort().join('|'); }
function rebuildTopology(){
  const nodes = [{id:'hub', label:'InfraSight', icon:'monitor', x:70, y:280, ref:null}];
  const links = [];
  const iconFor = cat => cat==='server'?'server':cat==='db'?'db':cat==='net'?'switch':'ups';
  let i = 0;
  [['server',SERVERS],['db',DBS],['net',NETS],['fac',FACS]].forEach(([cat,list])=>{
    list.forEach(e=>{
      const col = Math.floor(i/7), row = i%7;
      nodes.push({id:e.id, label:e.name, icon:iconFor(cat), x:290+col*160, y:40+row*90, ref:e.id});
      links.push({a:'hub', b:e.id, custom:false});
      i++;
    });
  });
  loadTopoCustomNodes().forEach(c=>{
    nodes.push({id:c.id, label:c.label, icon:c.icon, x:c.x, y:c.y, ref:null, custom:true});
  });
  // A registered device's icon can be hidden from just the map (its own ×
  // button, see renderTopologySkeleton) without touching the device itself
  // -- it stays fully registered/monitored, this only drops it from `nodes`
  // here so nothing below ever builds a link to/from it. The hub is exempt:
  // hiding the one node everything else radiates from would orphan the
  // whole diagram. A custom (hand-added) icon's × instead deletes it
  // outright via loadTopoCustomNodes/saveTopoCustomNodes -- it was never
  // added to this hidden set in the first place.
  const hiddenNodes = new Set(loadTopoHiddenNodes());
  const visibleNodes = nodes.filter(n => n.id === 'hub' || !hiddenNodes.has(n.id));
  const hidden = new Set(loadTopoHiddenLinks());
  let allLinks = links.filter(l => !hidden.has(topoLinkKey(l.a,l.b)));
  const nodeIds = new Set(visibleNodes.map(n=>n.id));
  // LLDP-discovered links (collector/lldp.py; SNMP 'net' devices only, every
  // ~5 min) -- only ever between two devices InfraSight already has
  // registered, so this never invents a node. Skipped if a link between the
  // same two already exists (hub spoke or a hand-drawn one) or was
  // explicitly hidden, and -- like a hand-drawn link -- hiding one through
  // the usual "연결선 그리기" click-to-delete just adds it to hiddenLinks,
  // no separate UI needed for that.
  DEVICE_LLDP_LINKS.forEach(dl=>{
    const a = dl.from_device_id, b = dl.to_device_id;
    if(!nodeIds.has(a) || !nodeIds.has(b)) return;
    if(hidden.has(topoLinkKey(a,b))) return;
    if(allLinks.some(l => (l.a===a&&l.b===b)||(l.a===b&&l.b===a))) return;
    allLinks.push({a, b, custom:false, lldp:true});
  });
  loadTopoCustomLinks().forEach(([a,b])=>{
    if(nodeIds.has(a) && nodeIds.has(b)) allLinks.push({a, b, custom:true});
  });
  // Captured from the DEFAULT (grid) positions, before any saved drag
  // override is applied -- this is what legitimately drives the canvas
  // bigger when there's actually more devices to show. A saved override is
  // just someone's past drag and is clamped to fit afterwards (see
  // renderTopologySkeleton) rather than allowed to grow the canvas itself --
  // otherwise one stale saved position from an old layout change (this used
  // to let nodes be dragged further than it does now) permanently breaks the
  // "fits on one screen" sizing on every future load.
  topoDefaultContentW = Math.max(0, ...visibleNodes.map(n=>n.x+90));
  topoDefaultContentH = Math.max(0, ...visibleNodes.map(n=>n.y+60));
  const layout = loadTopoLayout();
  const sizes = loadTopoNodeSizes();
  visibleNodes.forEach(n=>{
    const p = layout[n.id]; if(p){ n.x = p.x; n.y = p.y; }
    n.size = sizes[n.id] || TOPO_DEFAULT_ICON_SIZE;
  });
  TOPO_NODES = visibleNodes; TOPO_LINKS = allLinks;
}
function findEntity(ref){
  return SERVERS.find(s=>s.id===ref) || DBS.find(s=>s.id===ref) || NETS.find(s=>s.id===ref) || FACS.find(s=>s.id===ref);
}

/* ================= chart registry ================= */
const charts = {};
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function lineChart(canvas, labels, series, opts){
  return new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets: series.map(s=>({
      label:s.label, data:s.data, borderColor:s.color, backgroundColor:s.fill?hexA(s.color,.14):'transparent',
      fill:!!s.fill, tension:.35, pointRadius:0, borderWidth:2,
    })) },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{intersect:false,mode:'index'},
      plugins:{ legend:{display: series.length>1, labels:{boxWidth:8,boxHeight:8,color:'#5b6478',font:{size:10.5}}},
        tooltip:{backgroundColor:'#ffffff', borderColor:'#e2e6f0', borderWidth:1, titleColor:'#1c2333', bodyColor:'#1c2333', titleFont:{size:10.5}, bodyFont:{size:10.5}, boxPadding:4} },
      scales:{
        x:{display:!!opts?.showX, grid:{color:'#eef1f7'}, ticks:{color:'#8792a8',font:{size:9.5},maxTicksLimit:6}},
        y:{ display:true, grid:{color:'#eef1f7'}, ticks:{color:'#8792a8',font:{size:9.5}}, suggestedMax:opts?.max, suggestedMin:0 },
      }
    }
  });
}
function barChart(canvas, labels, data, colors){
  return new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{data, backgroundColor:colors, borderRadius:5, maxBarThickness:26}] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:false}, tooltip:{backgroundColor:'#ffffff',borderColor:'#e2e6f0',borderWidth:1,titleColor:'#1c2333',bodyColor:'#1c2333'}},
      scales:{ x:{max:100, grid:{color:'#eef1f7'}, ticks:{color:'#8792a8',font:{size:9.5}}}, y:{grid:{display:false}, ticks:{color:'#5b6478',font:{size:10.5,family:"'IBM Plex Mono'"}}} }
    }
  });
}
function doughnutChart(canvas, labels, data, colors){
  return new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels, datasets:[{data, backgroundColor:colors, borderWidth:0, hoverOffset:3}] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false, cutout:'70%',
      plugins:{ legend:{display:false},
        tooltip:{backgroundColor:'#ffffff', borderColor:'#e2e6f0', borderWidth:1, titleColor:'#1c2333', bodyColor:'#1c2333'} }
    }
  });
}
function hexA(hex,a){
  const m={'#7c5cff':'124,92,255','#00e6a8':'0,230,168','#ffb020':'255,176,32','#ff3b5c':'255,59,92','#3ecbff':'62,203,255','#ff3ec9':'255,62,201'};
  return `rgba(${m[hex]||'124,92,255'},${a})`;
}

/* ================= gauge component ================= */
function gaugeHtml(pct, lv, label, valueText){
  const color = levelColor(lv);
  return `<div class="gauge" style="background:conic-gradient(${color} ${clamp(pct,0,100)*3.6}deg, var(--surface-2) 0)">
    <div class="gauge-label"><b style="color:${color}">${valueText}</b><span>${label}</span></div>
  </div>`;
}

function renderOverview(){
  const allEntities = [...SERVERS, ...DBS, ...NETS, ...FACS];
  const total = allEntities.length;
  // 3rd-dev-pass dashboard refresh (reference mockup): the top row now reads
  // "how many devices, by collection-health status" (전체/정상/주의/장애/미수집)
  // instead of "how many devices per category" -- that per-category count
  // moved down into the 장비 종류별 현황 donut + 등록된 장비 목록 tables below,
  // reusing the already-existing 5-state collectionState model 1:1 rather
  // than inventing a second status taxonomy.
  const csCounts = {good:0, warn:0, crit:0, nodata:0, unknown:0};
  allEntities.forEach(e=>{ csCounts[e.collectionState||'unknown'] = (csCounts[e.collectionState||'unknown']||0) + 1; });
  const uncollected = csCounts.nodata + csCounts.unknown;
  const statusKpis = [
    {label:'전체 장비', value:total, icon:'server', color:'accent'},
    {label:'정상', value:csCounts.good, icon:'check', color:'good'},
    {label:'주의', value:csCounts.warn, icon:'alert', color:'warn'},
    {label:'장애', value:csCounts.crit, icon:'alert', color:'crit'},
    {label:'미수집', value:uncollected, icon:'question', color:'neutral'},
  ];
  $('#ov-kpis').innerHTML = statusKpis.map(k=>{
    const isTotal = k.label==='전체 장비';
    const neutral = k.color==='neutral';
    const bg = neutral ? 'rgba(140,150,170,.14)' : `var(--${k.color}-soft)`;
    const fg = neutral ? '#8f99b3' : `var(--${k.color})`;
    const sub = isTotal
      ? `<span class="g">정상 ${csCounts.good}</span><span class="w">주의 ${csCounts.warn}</span><span class="c">장애 ${csCounts.crit}</span>`
      : `<span style="color:${fg}">${total ? fmt0(k.value/total*100) : 0}%</span>`;
    return `
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:${bg};color:${fg}">${iconSvg(k.icon)}</div>
      <div class="kpi-body">
        <span class="kpi-label">${k.label}</span>
        <span class="kpi-value">${k.value}<span style="font-size:11px;color:var(--text-faint)"> 대</span></span>
        <span class="kpi-sub">${sub}</span>
      </div>
    </div>`;
  }).join('');

  if(charts.ov_donut){
    charts.ov_donut.data.datasets[0].data = [SERVERS.length, DBS.length, NETS.length, FACS.length];
    charts.ov_donut.update('none');
  }
  $('#ov-donut-total').textContent = total;
  $('#ov-donut-legend').innerHTML = [
    {key:'server', n:SERVERS.length}, {key:'db', n:DBS.length}, {key:'net', n:NETS.length}, {key:'fac', n:FACS.length},
  ].map(c=>`
    <div style="display:flex;align-items:center;gap:7px">
      <span style="width:8px;height:8px;border-radius:50%;background:${OV_CAT_HEX[c.key]};flex:none"></span>
      <span style="color:var(--text-dim);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${OV_CAT_LABEL[c.key]}</span>
      <b class="mono" style="font-size:11px;flex:none">${c.n}</b>
      <span class="mono" style="color:var(--text-faint);font-size:9.5px;width:32px;text-align:right;flex:none">${total?fmt0(c.n/total*100):0}%</span>
    </div>`).join('');

  const localEntity = SERVERS.find(s=>s.mode==='local');
  if(charts.ov_traffic){
    const netHist = (localEntity && localEntity.hist && localEntity.hist.net) || Array(24).fill(0);
    charts.ov_traffic.data.datasets[0].data = netHist.map(v=>fmt1(v));
    charts.ov_traffic.update('none');
  }

  const cpuServers = SERVERS.filter(s=>typeof s.cpu==='number');
  const avgCpu = cpuServers.length ? cpuServers.reduce((s,x)=>s+x.cpu,0)/cpuServers.length : 0;
  const avgMem = cpuServers.length ? cpuServers.reduce((s,x)=>s+x.mem,0)/cpuServers.length : 0;
  $('#ov-g-cpu').innerHTML = gaugeHtml(avgCpu, levelOf(avgCpu,75,90), 'CPU', fmt0(avgCpu)+'%') + `<span>CPU 평균</span>`;
  $('#ov-g-mem').innerHTML = gaugeHtml(avgMem, levelOf(avgMem,80,92), 'MEM', fmt0(avgMem)+'%') + `<span>메모리 평균</span>`;

  const top5 = cpuServers.slice().sort((a,b)=>b.cpu-a.cpu).slice(0,5);
  if(charts.ov_top5){
    charts.ov_top5.data.labels = top5.map(s=>s.name);
    charts.ov_top5.data.datasets[0].data = top5.map(s=>fmt1(s.cpu));
    charts.ov_top5.data.datasets[0].backgroundColor = top5.map(s=>levelColorHex(s.status));
    charts.ov_top5.update('none');
  }

  $('#ov-devlist-sub').textContent = `전체 ${total}대`;
  [['server',SERVERS], ['db',DBS], ['net',NETS], ['fac',FACS]].forEach(([key,list])=>{
    const countEl = $(`#ov-devlist-count-${key}`);
    if(countEl) countEl.textContent = `${list.length}대`;
    const tbodyEl = $(`#ov-devlist-tbody-${key}`);
    if(!tbodyEl) return;
    const sorted = list.slice().sort((a,b)=>(OV_CAT_RANK[a.status]??1)-(OV_CAT_RANK[b.status]??1)).slice(0,3);
    tbodyEl.innerHTML = sorted.map(e=>`
      <tr>
        <td class="name" style="padding:5px 7px;font-size:11px;text-align:center">${escapeHtml(e.name)}</td>
        <td class="mono" style="padding:5px 7px;font-size:10px;text-align:center">${e.ip||'-'}</td>
        <td style="padding:5px 7px;text-align:center"><span class="pill ${e.status}" style="padding:2px 7px;font-size:9.5px"><span class="dot"></span>${statusLabel(e.status)}</span></td>
      </tr>`).join('') || `<tr><td colspan="3"><div class="empty-note" style="padding:10px;font-size:10.5px">등록 없음</div></td></tr>`;
  });

  const openIncidents = INCIDENTS.filter(i=>i.status==='open');
  const recent = openIncidents.length ? openIncidents.slice(0,15) : INCIDENTS.slice(0,8);
  $('#ov-inc-sub').textContent = `미해결 ${openIncidents.length}건 · 전체 보기 →`;
  const incBody = $('#ov-recent-inc');
  const incScroll = incBody ? incBody.scrollTop : 0;
  incBody.innerHTML = recent.map(i=>`
    <div style="display:flex;gap:9px;align-items:center">
      <span style="width:24px;height:24px;border-radius:50%;background:${sevColor(i.severity)};display:flex;align-items:center;justify-content:center;flex:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" style="width:12px;height:12px">${i.status==='resolved'?'<path d="M5 13l4 4L19 7"/>':'<path d="M12 8v5M12 16.5h.01"/>'}</svg>
      </span>
      <div style="min-width:0">
        <div style="font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(i.message)}</div>
        <div style="font-size:10.5px;color:var(--text-faint)" class="mono">${escapeHtml(i.source)} · ${timeAgo(i.time)}</div>
      </div>
    </div>`).join('') || `<div class="empty-note">이벤트가 없습니다</div>`;
  incBody.scrollTop = incScroll;

  const failBuckets = {
    agent: allEntities.filter(e=>e.mode==='agent' && e.online===false),
    snmp: allEntities.filter(e=>e.mode==='snmp' && e.collectionState && e.collectionState!=='good'),
    ping: allEntities.filter(e=>e.mode==='ping' && e.collectionState && e.collectionState!=='good'),
  };
  Object.keys(failBuckets).forEach(key=>{
    const list = failBuckets[key];
    const countEl = $(`#ov-fail-count-${key}`);
    if(countEl) countEl.style.color = list.length ? 'var(--crit)' : 'var(--text)';
    if(countEl) countEl.textContent = list.length;
    const listEl = $(`#ov-fail-list-${key}`);
    if(listEl){
      listEl.innerHTML = list.map(e=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${escapeHtml(e.name)}</span>
          <span class="mono" style="font-size:10px;color:var(--text-faint);flex:none">${e.ip||'-'}</span>
        </div>`).join('') || `<div class="empty-note" style="padding:8px;font-size:11px">해당 없음</div>`;
    }
  });
}

function sevColor(sev){ return sev==='critical'||sev==='crit' ? 'var(--crit)' : sev==='warning'||sev==='warn' ? 'var(--warn)' : 'var(--info)'; }
function timeAgo(d){
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return `${s}초 전`;
  if(s<3600) return `${Math.floor(s/60)}분 전`;
  return `${Math.floor(s/3600)}시간 전`;
}

/* ================= TOPOLOGY ================= */
function renderTopologySkeleton(){
  const el = $('#view-topology');
  const linksSvg = TOPO_LINKS.map((l,i)=>{
    const na=TOPO_NODES.find(n=>n.id===l.a), nb=TOPO_NODES.find(n=>n.id===l.b);
    if(!na||!nb) return '';
    const dash = l.lldp ? ' stroke-dasharray="5,4"' : '';
    return `<line data-link="${i}" x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="${l.lldp?'#22d3ee':'#c7cede'}" stroke-width="2"${dash}/>`
      + `<line data-link-hit="${i}" x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="transparent" stroke-width="16" style="cursor:${topoLinkMode?'pointer':'default'}"/>`;
  }).join('');
  const nodesHtml = TOPO_NODES.map(n=>`
    <div class="topo-node${n.custom?' custom':''}" data-node="${n.id}" draggable="false" style="left:${n.x}px;top:${n.y}px;--topo-icon-size:${n.size||TOPO_DEFAULT_ICON_SIZE}px">
      <div class="node-box">${iconSvg(n.icon)}<span class="node-status" style="background:var(--good)"></span>${n.id!=='hub'?`<button type="button" class="node-del" data-del-node="${n.id}" title="${n.custom?'삭제':'지도에서 숨기기 (장비 등록은 그대로 유지)'}">×</button>`:''}</div>
      <span class="node-name">${escapeHtml(n.label)}</span>
    </div>`).join('');
  // Sized off the DEFAULT grid positions (topoDefaultContentW/H, from
  // rebuildTopology), not off TOPO_NODES' current x/y -- those can include a
  // saved drag override, and basing the canvas's own size on that let one
  // stale saved position (from a drag made before positions were clamped to
  // the canvas) permanently force a bigger-than-one-screen canvas on every
  // later load. Resolved further (below) against whatever width/height the
  // view actually has available, rather than forced to some fixed number.
  const contentW = topoDefaultContentW;
  const contentH = Math.max(320, topoDefaultContentH);
  el.innerHTML = `
    <div class="card" style="background:var(--bg);display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="card-head" style="align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h3 style="color:var(--chrome-text);font-size:20px;position:relative;top:-9px">인프라 토플로지</h3>
          <span class="sub" style="color:var(--chrome-text-faint)">${topoLinkMode ? '연결선 그리기 모드: 노드 두 개를 순서대로 클릭해 연결하고, 선을 클릭하면 삭제됩니다' : '노드를 드래그해 배치를 바꾸고, 노드 위에서 마우스 휠로 그 아이콘만 크기를 조절할 수 있습니다'}</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:none">
          <button type="button" class="btn${topoLinkMode?' primary':''}" id="topoLinkModeBtn" style="white-space:nowrap">${topoLinkMode?'연결선 그리기 종료':'연결선 그리기'}</button>
          <button type="button" class="btn" id="topoAddIconBtn" style="white-space:nowrap">아이콘 추가</button>
          <button type="button" class="btn" id="topoResetLayoutBtn" style="white-space:nowrap">배치 초기화</button>
          ${loadTopoHiddenNodes().length ? `<button type="button" class="btn" id="topoShowHiddenBtn" style="white-space:nowrap">숨긴 장비 ${loadTopoHiddenNodes().length}개 표시</button>` : ''}
        </div>
      </div>
      ${topoAddPanelOpen ? `
      <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;padding:12px 14px">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-faint)">아이콘 종류
          <select id="topoAddIconType" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12.5px">
            ${Object.keys(ICON_LABELS).map(k=>`<option value="${k}">${ICON_LABELS[k]}</option>`).join('')}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-faint)">이름
          <input id="topoAddIconLabel" placeholder="예: 공유기" style="padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12.5px">
        </label>
        <button type="button" class="btn primary" id="topoAddIconConfirm">추가</button>
        <button type="button" class="btn" id="topoAddIconCancel">취소</button>
      </div>` : ''}
      <div class="topo-wrap">
        <div class="topo-canvas${topoLinkMode?' link-mode':''}" style="--topo-icon-size:${TOPO_DEFAULT_ICON_SIZE}px">
          <svg class="links">${linksSvg}</svg>
          ${nodesHtml}
        </div>
      </div>
      <div class="topo-legend" style="margin-top:12px">
        <div class="l"><span class="sw" style="background:var(--good)"></span>정상 회선</div>
        <div class="l"><span class="sw" style="background:var(--warn)"></span>혼잡 (70%+)</div>
        <div class="l"><span class="sw" style="background:var(--crit)"></span>과부하 / 장애</div>
        <div class="l"><span class="sw" style="background:#22d3ee"></span>LLDP 자동 발견 연결 (점선)</div>
      </div>
    </div>
    <div class="grid grid-3" id="topo-detail-cards"></div>
  `;
  // Only widen the canvas past the screen (forcing the horizontal scrollbar)
  // when the devices actually laid out on it need more room than the view
  // has -- otherwise it just fills the available width, so the topology
  // fits on one screen instead of always reserving space for 1180px' worth
  // of devices whether or not that many exist yet.
  const canvasEl = $('.topo-canvas', el);
  const wrapEl = $('.topo-wrap', el);
  if(canvasEl && wrapEl){
    // CSS height:100% on the canvas doesn't reliably resolve against
    // .topo-wrap's flex-grown height, so its wrapper's actual rendered
    // height is measured directly and set in px instead of trusted to
    // resolve on its own.
    const finalW = Math.max(contentW, wrapEl.clientWidth);
    const finalH = Math.max(contentH, wrapEl.clientHeight);
    canvasEl.style.width = finalW+'px';
    canvasEl.style.height = finalH+'px';
    // Self-heal: a saved drag position from before positions were clamped to
    // the canvas (or from a since-shrunk canvas) can still sit outside these
    // final bounds even though the canvas itself no longer grows to chase
    // it. Pull any such node back inside once here and persist the
    // correction, instead of leaving it to float off the visible card until
    // someone happens to hit "배치 초기화".
    const layoutNow = loadTopoLayout();
    let corrected = false;
    TOPO_NODES.forEach(n=>{
      const nodeEl = el.querySelector(`.topo-node[data-node="${n.id}"]`);
      if(!nodeEl) return;
      const nodeW = nodeEl.offsetWidth, nodeH = nodeEl.offsetHeight;
      const iconHalf = (n.size || TOPO_DEFAULT_ICON_SIZE) / 2;
      const cx = Math.max(nodeW/2, Math.min(finalW - nodeW/2, n.x));
      const cy = Math.max(iconHalf, Math.min(finalH - (nodeH - iconHalf), n.y));
      if(cx !== n.x || cy !== n.y){
        n.x = cx; n.y = cy;
        if(layoutNow[n.id]){ layoutNow[n.id] = {x:cx, y:cy}; corrected = true; }
      }
    });
    if(corrected){ saveTopoLayout(layoutNow); renderTopologySkeleton(); return; }
  }
  $$('.topo-node', el).forEach(node=>{
    node.addEventListener('mouseenter', e=>{ if(!topoDragging) showTopoTip(node); });
    node.addEventListener('mousemove', e=>{ if(!topoDragging) positionTip(e); });
    node.addEventListener('mouseleave', ()=> $('#topoTip').classList.remove('show'));
    node.addEventListener('dragstart', e=> e.preventDefault());
    node.addEventListener('mousedown', e=> startTopoDrag(e, node));
    node.addEventListener('wheel', e=>{
      e.preventDefault();
      const id = node.dataset.node;
      const sizes = loadTopoNodeSizes();
      const current = sizes[id] || TOPO_NODES.find(x=>x.id===id)?.size || TOPO_DEFAULT_ICON_SIZE;
      const next = clampTopoNodeSize(current + (e.deltaY < 0 ? 4 : -4));
      sizes[id] = next;
      saveTopoNodeSizes(sizes);
      const liveN = TOPO_NODES.find(x=>x.id===id);
      if(liveN) liveN.size = next;
      node.style.setProperty('--topo-icon-size', next+'px');
      $('#topoTip').classList.remove('show');
    }, {passive:false});
    node.addEventListener('click', ()=>{
      if(node.dataset.dragged === '1'){ node.dataset.dragged = ''; return; }
      if(topoLinkMode){ handleTopoLinkClick(node.dataset.node); return; }
      const n = TOPO_NODES.find(x=>x.id===node.dataset.node);
      if(n.ref) openDrawerFor(n.ref);
    });
    if(topoLinkMode && node.dataset.node === topoLinkFrom) node.classList.add('sel');
  });
  $$('.node-del', el).forEach(btn=>{
    // mousedown is deliberately NOT stopped here (used to be): the button
    // sits right on the icon's corner, which is exactly where a drag
    // naturally starts for anyone grabbing near the edge -- stopping it
    // there made a drag that happened to begin on the button silently do
    // nothing. Letting it bubble lets the parent .topo-node's own mousedown
    // (startTopoDrag) run as normal; a real drag still completes normally,
    // and the click guard below is what keeps a plain click from both
    // deleting AND registering as a drag-click.
    btn.addEventListener('click', ev=>{
      ev.stopPropagation();
      const node = btn.closest('.topo-node');
      if(node && node.dataset.dragged === '1'){ node.dataset.dragged = ''; return; }
      const id = btn.dataset.delNode;
      const n = TOPO_NODES.find(x=>x.id===id);
      if(n && n.custom){
        // Hand-added icon: it only ever existed on the map, so × removes it
        // outright (and anything that referenced it).
        saveTopoCustomNodes(loadTopoCustomNodes().filter(c=>c.id!==id));
        saveTopoCustomLinks(loadTopoCustomLinks().filter(([a,b])=>a!==id&&b!==id));
      } else {
        // Registered device: × only hides its icon from this map. The
        // device itself, and its monitoring, are untouched -- unregistering
        // it is still a separate, deliberate action on the 장비 등록 screen.
        const hiddenNodes = loadTopoHiddenNodes();
        if(!hiddenNodes.includes(id)) hiddenNodes.push(id);
        saveTopoHiddenNodes(hiddenNodes);
        saveTopoCustomLinks(loadTopoCustomLinks().filter(([a,b])=>a!==id&&b!==id));
      }
      const layout = loadTopoLayout(); delete layout[id]; saveTopoLayout(layout);
      const sizes = loadTopoNodeSizes(); delete sizes[id]; saveTopoNodeSizes(sizes);
      rebuildTopology(); renderTopologySkeleton(); refreshTopology();
    });
  });
  $$('[data-link-hit]', el).forEach(hit=>{
    hit.addEventListener('click', ev=>{
      if(!topoLinkMode) return;
      ev.stopPropagation();
      const idx = parseInt(hit.dataset.linkHit, 10);
      const link = TOPO_LINKS[idx];
      if(!link) return;
      if(link.custom){
        saveTopoCustomLinks(loadTopoCustomLinks().filter(([a,b]) => !((a===link.a&&b===link.b)||(a===link.b&&b===link.a))));
      } else {
        const hidden = loadTopoHiddenLinks();
        const key = topoLinkKey(link.a, link.b);
        if(!hidden.includes(key)) hidden.push(key);
        saveTopoHiddenLinks(hidden);
      }
      rebuildTopology(); renderTopologySkeleton(); refreshTopology();
    });
  });
  const resetBtn = $('#topoResetLayoutBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    saveTopoLayout({});
    rebuildTopology();
    renderTopologySkeleton();
    refreshTopology();
  });
  const showHiddenBtn = $('#topoShowHiddenBtn');
  if(showHiddenBtn) showHiddenBtn.addEventListener('click', ()=>{
    saveTopoHiddenNodes([]);
    rebuildTopology();
    renderTopologySkeleton();
    refreshTopology();
  });
  const linkModeBtn = $('#topoLinkModeBtn');
  if(linkModeBtn) linkModeBtn.addEventListener('click', ()=>{
    topoLinkMode = !topoLinkMode;
    topoLinkFrom = null;
    renderTopologySkeleton();
    refreshTopology();
  });
  const addBtn = $('#topoAddIconBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    topoAddPanelOpen = !topoAddPanelOpen;
    renderTopologySkeleton();
    refreshTopology();
  });
  const addCancel = $('#topoAddIconCancel');
  if(addCancel) addCancel.addEventListener('click', ()=>{
    topoAddPanelOpen = false;
    renderTopologySkeleton();
    refreshTopology();
  });
  const addConfirm = $('#topoAddIconConfirm');
  if(addConfirm) addConfirm.addEventListener('click', ()=>{
    const icon = $('#topoAddIconType').value;
    const label = ($('#topoAddIconLabel').value||'').trim() || ICON_LABELS[icon] || '아이콘';
    const list = loadTopoCustomNodes();
    list.push({id:'custom-'+Date.now(), label, icon, x:150+Math.round(Math.random()*60), y:560+Math.round(Math.random()*40)});
    saveTopoCustomNodes(list);
    topoAddPanelOpen = false;
    rebuildTopology();
    renderTopologySkeleton();
    refreshTopology();
  });
}
function handleTopoLinkClick(nodeId){
  if(!topoLinkFrom){
    topoLinkFrom = nodeId;
    const nodeEl = document.querySelector(`.topo-node[data-node="${nodeId}"]`);
    if(nodeEl) nodeEl.classList.add('sel');
    return;
  }
  if(topoLinkFrom === nodeId){
    const nodeEl = document.querySelector(`.topo-node[data-node="${nodeId}"]`);
    if(nodeEl) nodeEl.classList.remove('sel');
    topoLinkFrom = null;
    return;
  }
  const a = topoLinkFrom, b = nodeId;
  const prevEl = document.querySelector(`.topo-node[data-node="${a}"]`);
  if(prevEl) prevEl.classList.remove('sel');
  topoLinkFrom = null;
  const exists = TOPO_LINKS.some(l => (l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  if(exists) return;
  const custom = loadTopoCustomLinks();
  custom.push([a,b]);
  saveTopoCustomLinks(custom);
  rebuildTopology();
  renderTopologySkeleton();
  refreshTopology();
}
function startTopoDrag(e, node){
  if(e.button !== 0) return;
  if(topoLinkMode) return;
  e.preventDefault();
  const nodeId = node.dataset.node;
  const n0 = TOPO_NODES.find(x=>x.id===nodeId);
  if(!n0) return;
  const canvas = node.closest('.topo-canvas');
  const canvasStartW = canvas ? canvas.getBoundingClientRect().width : 0;
  const canvasStartH = canvas ? canvas.getBoundingClientRect().height : 0;
  // node's top/left is the ICON's center (see .topo-node's transform), but
  // the node's own box also includes the label underneath it, which is
  // taller than the icon alone. Clamping only to the icon's half-size let
  // the label spill past the canvas's bottom edge once a node was dragged
  // all the way down -- invisible-but-real overflow that was nudging the
  // card's scrollable area (and so the page) by a few pixels.
  const nodeW = node.offsetWidth, nodeH = node.offsetHeight;
  const iconHalf = (n0.size || TOPO_DEFAULT_ICON_SIZE) / 2;
  const minX = nodeW/2, maxX = canvasStartW - nodeW/2;
  const minY = iconHalf, maxY = canvasStartH - (nodeH - iconHalf);
  const startX = e.clientX, startY = e.clientY;
  const origX = n0.x, origY = n0.y;
  let moved = false;
  $('#topoTip').classList.remove('show');
  // Dragging a node down used to scroll the whole page along with it. The
  // actual cause was the canvas resizing on every single mousemove (fixed
  // below -- the canvas is now a fixed size for the whole drag, and the node
  // is clamped to stay inside it), which was real layout thrashing on an
  // ancestor box. Forcing overflow:hidden on html/body was tried as a blunter
  // backstop on top of that, but it has its own side effect: removing the
  // scrollbar mid-drag shifts the page width, which read as the canvas's
  // right edge growing/shrinking as you click and release. With the resize
  // itself gone, pinning the scroll position below is enough on its own.
  const prevUserSelect = document.body.style.userSelect;
  document.body.style.userSelect = 'none';
  const lockedScrollX = window.scrollX, lockedScrollY = window.scrollY;
  function lockScroll(){
    if(window.scrollX !== lockedScrollX || window.scrollY !== lockedScrollY){
      window.scrollTo(lockedScrollX, lockedScrollY);
    }
  }
  window.addEventListener('scroll', lockScroll, {passive:true});
  let curX = origX, curY = origY;
  function onMove(ev){
    ev.preventDefault();
    lockScroll();
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if(!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) moved = true;
    if(!moved) return;
    topoDragging = true;
    // Clamped to the canvas's own (fixed, unchanging) bounds -- a node can be
    // moved anywhere inside the topology card, but never past its edge, so
    // dragging can never grow the card itself or push the legend below it
    // down the page. The card's size is set once at render and stays put.
    curX = Math.max(minX, Math.min(maxX, origX + dx));
    curY = Math.max(minY, Math.min(maxY, origY + dy));
    node.style.left = curX+'px';
    node.style.top = curY+'px';
    // Re-resolve the node by id (not the object captured at drag-start): a
    // background poll can swap TOPO_NODES for fresh objects mid-drag
    // (rebuildTopology runs on every state sync), which used to leave the
    // old, now-detached node object still being dragged while every line
    // endpoint looked the node back up in the NEW array and found it still
    // sitting at its pre-drag position -- the icon moved but its lines
    // didn't follow. Writing curX/curY into whatever object currently lives
    // in TOPO_NODES keeps that array authoritative no matter how many times
    // it gets replaced underneath the drag.
    const liveN = TOPO_NODES.find(x=>x.id===nodeId);
    if(liveN){ liveN.x = curX; liveN.y = curY; }
    TOPO_LINKS.forEach((l,i)=>{
      if(l.a!==nodeId && l.b!==nodeId) return;
      const na = l.a===nodeId ? {x:curX,y:curY} : TOPO_NODES.find(x=>x.id===l.a);
      const nb = l.b===nodeId ? {x:curX,y:curY} : TOPO_NODES.find(x=>x.id===l.b);
      if(!na||!nb) return;
      [`line[data-link="${i}"]`, `line[data-link-hit="${i}"]`].forEach(sel=>{
        const line = document.querySelector(sel);
        if(line){ line.setAttribute('x1', na.x); line.setAttribute('y1', na.y); line.setAttribute('x2', nb.x); line.setAttribute('y2', nb.y); }
      });
    });
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    window.removeEventListener('scroll', lockScroll);
    document.body.style.userSelect = prevUserSelect;
    if(moved){
      node.dataset.dragged = '1';
      const liveN = TOPO_NODES.find(x=>x.id===nodeId);
      if(liveN){ liveN.x = curX; liveN.y = curY; }
      const layout = loadTopoLayout();
      layout[nodeId] = {x:curX, y:curY};
      saveTopoLayout(layout);
    }
    topoDragging = false;
  }
  document.addEventListener('mousemove', onMove, {passive:false});
  document.addEventListener('mouseup', onUp);
}
function showTopoTip(node){
  const n = TOPO_NODES.find(x=>x.id===node.dataset.node);
  const tip = $('#topoTip');
  let html = `<div class="t-title">${escapeHtml(n.label)}</div>`;
  const ent = n.ref ? findEntity(n.ref) : null;
  if(ent){
    const rows = [];
    if(ent.mode==='ping' || ent.mode==='snmp'){
      rows.push(`<div class="t-row"><span>응답</span><span style="color:${ent.reachable?'var(--good)':'var(--crit)'}">${ent.reachable? fmt0(ent.latencyMs||0)+' ms' : '응답없음'}</span></div>`);
    }
    if(typeof ent.cpu === 'number') rows.push(`<div class="t-row"><span>CPU</span><span>${fmt0(ent.cpu)}%</span></div>`);
    if(typeof ent.mem === 'number') rows.push(`<div class="t-row"><span>MEM</span><span>${fmt0(ent.mem)}%</span></div>`);
    if(typeof ent.portsTotal === 'number') rows.push(`<div class="t-row"><span>인터페이스</span><span>${ent.portsUp}/${ent.portsTotal} Up</span></div>`);
    if(typeof ent.trafficIn === 'number') rows.push(`<div class="t-row"><span>트래픽</span><span>${fmt1((ent.trafficIn||0)+(ent.trafficOut||0))} Mbps</span></div>`);

    else rows.push(`<div class="t-row"><span>상태</span><span style="color:${levelColor(ent.status)}">${statusLabel(ent.status)}</span></div>`);
    html += rows.join('');
  } else {
    html += `<div class="t-row"><span>구간</span><span>관제 네트워크</span></div>`;
  }
  tip.innerHTML = html;

}
function positionTip(e){
  const tip = $('#topoTip');
  const wrap = $('.topo-wrap');
  const rect = wrap.getBoundingClientRect();
  let x = e.clientX - rect.left + wrap.scrollLeft + 16;
  let y = e.clientY - rect.top + wrap.scrollTop + 12;

}
function statusLabel(lv){ return lv==='crit'?'위험':lv==='warn'?'주의':'정상'; }

function refreshTopology(){
  TOPO_NODES.forEach(n=>{
    if(!n.ref) return;
    const ent = findEntity(n.ref);
    if(!ent) return;
    const box = document.querySelector(`.topo-node[data-node="${n.id}"] .node-status`);
    if(box) box.style.background = levelColor(ent.status);
  });
  TOPO_LINKS.forEach((l,i)=>{
    const na = TOPO_NODES.find(n=>n.id===l.a);
    const entA = na && na.ref ? findEntity(na.ref) : null;
    const line = document.querySelector(`line[data-link="${i}"]`);
    if(!line) return;
    let color = l.lldp ? '#22d3ee' : '#c7cede', width=2;
    if(entA && entA.status){ color = entA.status==='crit'?'#ef3b5c':entA.status==='warn'?'#e6960f':(l.lldp?'#22d3ee':'#9fb0d8'); width = entA.status==='good'?2:2.6; }
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', width);
  });
}
function refreshTopologyView(){
  // Node set alone used to gate the full re-render, on the assumption that
  // links only ever change when nodes do -- not true once links can also
  // come from LLDP discovery running in the background: a newly-found link
  // between two already-rendered devices changed TOPO_LINKS without adding
  // or removing a node, so it silently never made it into the DOM.
  const nodeSig = TOPO_NODES.map(n=>n.id).join(',');
  const linkSig = TOPO_LINKS.map(l=>`${l.a}>${l.b}${l.lldp?'~lldp':''}`).join(',');
  const sig = nodeSig + '|' + linkSig;
  if(sig !== lastTopoSignature){
    renderTopologySkeleton();
    lastTopoSignature = sig;
  }
  refreshTopology();
}

async function renderFlow(){

    filterEl.innerHTML = '<option value="">전체 장비</option>' +
      deviceList.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
  }
  const qs = `range=${flowRange}` + (flowDeviceFilter ? `&deviceId=${encodeURIComponent(flowDeviceFilter)}` : '');
  let status, summary, timeseries, protocols, talkers;
  try{
    [status, summary, timeseries, protocols, talkers] = await Promise.all([
      apiFetch('/api/flow/status').then(r=>r.json()),
      apiFetch(`/api/flow/summary?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/timeseries?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/protocols?${qs}`).then(r=>r.json()),
      apiFetch(`/api/flow/top-talkers?${qs}`).then(r=>r.json()),

    $('#flow-status-body').innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(err.message||'')}</div>`;

  const statusBody = $('#flow-status-body');
  if(!status.exporters || !status.exporters.length){

    </div>`;

    statusBody.innerHTML = `<div class="table-wrap"><table class="data reg-device-table">
      <thead><tr><th>Exporter IP</th><th>매칭된 장비</th><th>방식</th><th>최근 수신</th><th>누적 레코드</th></tr></thead>

        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  $('#flow-summary-sub').textContent = `총 ${fmtBytes(summary.bytesTotal)} · 패킷 ${fmt0(summary.packetsTotal)}개 (${flowRange})`;
  const labels = timeseries.points.map(p=> new Date(p.ts).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'}));
  const bwData = timeseries.points.map(p=> p.bytes);

    {label:'트래픽', data:bwData, color:'#3ecbff', fill:true},

  const protoColors = {TCP:'#7c5cff', UDP:'#00e6a8', ICMP:'#ffb020', OTHER:'#8f99b3'};

    protocols.protocols.map(p=>protoColors[p.protocol]||'#8f99b3'));
  const protoTotal = protocols.protocols.reduce((s,p)=>s+p.bytes,0);
  $('#flow-protocol-legend').innerHTML = protocols.protocols.length ? protocols.protocols.map(p=>`

    </div>`).join('') : `<div class="empty-note" style="padding:8px">데이터 없음</div>`;

  $('#flow-talkers-tbody').innerHTML = talkers.pairs.map(p=>`
    <tr>
      <td class="mono">${escapeHtml(p.srcIp)}</td>
      <td class="mono">${escapeHtml(p.dstIp)}</td>

      <td class="mono">${fmt0(p.packets)}</td>
    </tr>`).join('') || `<tr><td colspan="4"><div class="empty-note">해당 구간에 수집된 트래픽이 없습니다</div></td></tr>`;
}

function renderIncidents(){

  function updateSnmpFieldVisibility(){

    $('#f-snmp-v3-authpw').placeholder = pwPlaceholder;

  function markSnmpUntested(){

  // New registrations only -- edits never re-check reachability (same as
  // before this feature; see api_update_device), so the gate would just be
  // in the way of e.g. renaming a device without touching its SNMP creds.
  function updateSnmpSubmitGate(){
    const effMode = regCategory==='server' ? regMode : (regMode==='agent' ? 'ping' : regMode);
    const blocked = effMode==='snmp' && !editingDeviceId && !snmpTestPassed;
    $('#reg-submit-btn').disabled = blocked;
    $('#snmp-test-hint').style.display = blocked ? '' : 'none';
  }
  $$('#reg-cat-chips .chip-btn').forEach(b=> b.addEventListener('click', ()=>{
    $$('#reg-cat-chips .chip-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    regCategory = b.dataset.cat; updateFormVisibility(); markSnmpUntested();
  }));
  $$('#reg-mode-chips .chip-btn').forEach(b=> b.addEventListener('click', ()=>{
    regMode = b.dataset.mode; updateFormVisibility(); markSnmpUntested();
  }));
  $('#agent-copy-btn').addEventListener('click', ()=>{
    const text = $('#agent-command-text').textContent;
    try{ navigator.clipboard.writeText(text); }catch(e){}
  });
  ['f-ip','f-snmp-version','f-snmp-port','f-snmp-community','f-snmp-v3-username',
   'f-snmp-v3-seclevel','f-snmp-v3-authproto','f-snmp-v3-authpw','f-snmp-v3-privproto','f-snmp-v3-privpw']
    .forEach(id=> $('#'+id).addEventListener('input', markSnmpUntested));
  $('#f-snmp-version').addEventListener('change', updateSnmpFieldVisibility);
  $('#f-snmp-v3-seclevel').addEventListener('change', updateSnmpFieldVisibility);
  function buildSnmpTestPayload(){
    const ip = $('#f-ip').value.trim();
    if(!ip) return {error:'IP 주소를 먼저 입력하세요'};
    const version = $('#f-snmp-version').value;
    const port = parseInt($('#f-snmp-port').value) || 161;
    const payload = {ip, snmpVersion: version, snmpPort: port};
    if(version === 'v3'){
      const username = $('#f-snmp-v3-username').value.trim();
      if(!username) return {error:'SNMPv3 사용자명을 입력하세요'};
      payload.snmpv3Username = username;
      const lvl = $('#f-snmp-v3-seclevel').value;
      if(lvl==='authNoPriv' || lvl==='authPriv'){
        const authPw = $('#f-snmp-v3-authpw').value;
        if(!authPw) return {error:'인증 비밀번호를 입력하세요'};
        if(authPw.length < 8) return {error:'인증 비밀번호는 8자 이상이어야 합니다'};
        payload.snmpv3AuthProtocol = $('#f-snmp-v3-authproto').value;
        payload.snmpv3AuthPassword = authPw;
      }
      if(lvl==='authPriv'){
        const privPw = $('#f-snmp-v3-privpw').value;
        if(!privPw) return {error:'개인정보 보호 비밀번호를 입력하세요'};
        if(privPw.length < 8) return {error:'개인정보 보호 비밀번호는 8자 이상이어야 합니다'};
        payload.snmpv3PrivProtocol = $('#f-snmp-v3-privproto').value;
        payload.snmpv3PrivPassword = privPw;
      }
    } else {
      payload.community = $('#f-snmp-community').value.trim() || 'public';
    }
    return payload;
  }
  $('#snmp-test-btn').addEventListener('click', async ()=>{
    const resultEl = $('#snmp-test-result');
    const btn = $('#snmp-test-btn');
    const payload = buildSnmpTestPayload();
    if(payload.error){ resultEl.textContent = payload.error; resultEl.style.color = 'var(--crit)'; return; }
    btn.disabled = true; btn.textContent = '테스트 중...';
    resultEl.textContent = '응답 대기 중...'; resultEl.style.color = 'var(--text-faint)';
    try{
      const r = await apiFetch('/api/devices/test-snmp', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const j = await r.json();
      if(!r.ok || j.ok === false){
        resultEl.textContent = j.error || '테스트에 실패했습니다';
        resultEl.style.color = 'var(--crit)';
        snmpTestPassed = false;
      } else {
        resultEl.textContent = '✓ ' + (j.message || '연결에 성공했습니다');
        resultEl.style.color = 'var(--good)';
        snmpTestPassed = true;
      }
    }catch(err){
      resultEl.textContent = err.message || '테스트 중 오류가 발생했습니다';
      resultEl.style.color = 'var(--crit)';
      snmpTestPassed = false;
    }finally{
      btn.disabled = false; btn.textContent = '연결 테스트';
      updateSnmpSubmitGate();
    }
  });
  updateFormVisibility();
  markSnmpUntested();

  $('#scan-start-btn').addEventListener('click', async ()=>{
